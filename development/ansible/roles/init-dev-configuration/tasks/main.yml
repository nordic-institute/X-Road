---
- name: copy CP container configuration files
  copy:
    src: "files/cp/"
    dest: "/"
    group: "root"
    owner: "root"
    mode: "0644"
    directory_mode: "0755"
  when: inventory_hostname in groups['cp_servers']
  tags: dev-configuration

- name: copy CS container configuration files
  copy:
    src: "files/cs/"
    dest: "/"
    group: "root"
    owner: "root"
    mode: "0644"
    directory_mode: "0755"
  when: inventory_hostname in groups['cs_servers']
  tags: dev-configuration

- name: copy SS container configuration files
  copy:
    src: "files/ss/"
    dest: "/"
    group: "root"
    owner: "root"
    mode: "0644"
    directory_mode: "0755"
  when: inventory_hostname in groups['ss_servers']
  tags: dev-configuration

- name: render per-host OTEL config
  template:
    src: "otel.conf.j2"
    dest: "/etc/xroad/conf.d/otel.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  when: inventory_hostname in groups['ss_servers']
  tags: dev-configuration

- name: Install and configure Mailpit
  when: inventory_hostname in groups['cs_servers']
  block:
# Deliberately NOT the upstream install.sh: it resolves the latest release via the GitHub
# API, and anonymous API calls from shared CI runner IPs get rate-limited ("Unable to
# determine the latest version"). The releases/latest/download/ URL is a plain web redirect
# with no such limit and needs no token.
    - name: Download and extract Mailpit
      vars:
        mailpit_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
      unarchive:
        src: "https://github.com/axllent/mailpit/releases/latest/download/mailpit-linux-{{ mailpit_arch }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - mailpit
        creates: /usr/local/bin/mailpit
        mode: "0755"
      register: mailpit_install
      retries: 3
      delay: 15
      until: mailpit_install is succeeded

    - name: Create Mailpit config directory
      file:
        path: /etc/mailpit
        state: directory
        mode: "0755"

    - name: Create auth file
      copy:
        dest: /etc/mailpit/auth.txt
        content: "testusername:testpassword"
        mode: "0644"

    - name: Generate TLS certificates
      shell: |
        cd /etc/mailpit && \
        openssl req -x509 -newkey rsa:4096 \
        -nodes -keyout /etc/mailpit/key.pem -out /etc/mailpit/cert.pem \
        -sha256 -days 3650 \
        -subj "/CN=xrd-cs"
      args:
        creates: /etc/mailpit/cert.pem
        chdir: /etc/mailpit

    - name: Set TLS cert permissions
      file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - /etc/mailpit/cert.pem
        - /etc/mailpit/key.pem

    - name: Create Mailpit systemd service file
      copy:
        dest: /etc/systemd/system/mailpit.service
        content: |
          [Unit]
          Description=Mailpit mail server
          After=network.target

          [Service]
          ExecStart=/usr/local/bin/mailpit \
            --smtp-auth-file /etc/mailpit/auth.txt \
            --smtp-tls-cert /etc/mailpit/cert.pem \
            --smtp-tls-key /etc/mailpit/key.pem
          Restart=always
          User=xroad
          Group=xroad
          RestartSec=10
          SyslogIdentifier=mailpit

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and start Mailpit service
      systemd:
        name: mailpit
        state: started
        enabled: true
  tags:
    - dev-configuration
    - mailpit
