---
# Single shared package repository served over HTTP.
#
# Host build dir is bind-mounted into /srv/xroad-build (LXD disk device,
# attached by init-lxd). nginx aliases serve DEB/RPM straight from the
# mount — no copy. dpkg-scanpackages and createrepo_c run in-place on
# every fresh env so rebuilt packages are picked up immediately.
#
# Two phases:
#   - Cache-fill (baked into xroad-repo-cached): install tooling, write
#     nginx site config. Skipped at runtime when /etc/xroad-cached-image
#     exists.
#   - Runtime (always, unless cache_fill_mode): regenerate Packages /
#     repodata in mounted dirs, ensure nginx running.

- name: Detect cached-image marker
  stat:
    path: /etc/xroad-cached-image
  register: cached_image_marker

# ---- baked-in steps (cache-fill only) ----

- name: Install repo tooling
  apt:
    name: [dpkg-dev, createrepo-c, nginx-light]
    state: present
    update_cache: true
    install_recommends: false
  when: not cached_image_marker.stat.exists

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: not cached_image_marker.stat.exists

- name: Configure nginx site
  copy:
    dest: /etc/nginx/sites-available/xrd-repo
    mode: '0644'
    content: |
      server {
        listen 80 default_server;
        location /deb/ {
          alias /srv/xroad-build/ubuntu{{ ansible_facts['distribution_version'] }}/;
          autoindex on;
        }
        location /rpm/ {
          alias /srv/xroad-build/rhel/{{ rhel_releasever }}/;
          autoindex on;
        }
      }
  when: not cached_image_marker.stat.exists

- name: Enable xrd-repo nginx site
  file:
    src: /etc/nginx/sites-available/xrd-repo
    dest: /etc/nginx/sites-enabled/xrd-repo
    state: link
  when: not cached_image_marker.stat.exists

# ---- runtime steps (skipped during cache-fill) ----

- name: Scan DEB repo (writes Packages into mounted host dir)
  shell: dpkg-scanpackages -m . > Packages
  args:
    chdir: "/srv/xroad-build/ubuntu{{ ansible_facts['distribution_version'] }}"
  when: not cache_fill_mode | default(false)

- name: Build RPM repodata (writes repodata/ into mounted host dir)
  command: createrepo_c /srv/xroad-build/rhel/{{ rhel_releasever }}
  when: not cache_fill_mode | default(false)

- name: Ensure nginx running
  systemd:
    name: nginx
    state: started
    enabled: true
  when: not cache_fill_mode | default(false)
