---
- name: Resolve cached image and Ubuntu freshness state
  become: "{{ onMacOs | default(true) }}"
  run_once: true
  block:
    - name: Read upstream Ubuntu fingerprint for xrd-is
      shell: |
        set -o pipefail
        lxc image info ubuntu:{{ hostvars['xrd-is'].ubuntu_releasever }} | awk '/^Fingerprint:/ {print $2; exit}'
      args:
        executable: /bin/bash
      register: xrd_is_upstream_fp_raw
      changed_when: false
      failed_when: false

    - name: Read upstream Ubuntu fingerprint for xrd-ca
      shell: |
        set -o pipefail
        lxc image info ubuntu:{{ hostvars['xrd-ca'].ubuntu_releasever }} | awk '/^Fingerprint:/ {print $2; exit}'
      args:
        executable: /bin/bash
      register: xrd_ca_upstream_fp_raw
      changed_when: false
      failed_when: false

    - name: Read xroad-is-cached image properties
      command: lxc image show xroad-is-cached
      register: xroad_is_cached_show
      changed_when: false
      failed_when: false

    - name: Read xroad-ca-cached image properties
      command: lxc image show xroad-ca-cached
      register: xroad_ca_cached_show
      changed_when: false
      failed_when: false

    - name: Compute cached image usability
      set_fact:
        xrd_is_upstream_fp: >-
          {{
            (xrd_is_upstream_fp_raw.stdout | trim)
            if xrd_is_upstream_fp_raw.rc == 0
            else ''
          }}

        xrd_ca_upstream_fp: >-
          {{
            (xrd_ca_upstream_fp_raw.stdout | trim)
            if xrd_ca_upstream_fp_raw.rc == 0
            else ''
          }}

        xroad_is_cached_props: >-
          {{
            (xroad_is_cached_show.stdout | from_yaml).properties | default({})
            if xroad_is_cached_show.rc == 0
            else {}
          }}

        xroad_ca_cached_props: >-
          {{
            (xroad_ca_cached_show.stdout | from_yaml).properties | default({})
            if xroad_ca_cached_show.rc == 0
            else {}
          }}

    - name: Decide xroad cache usability
      set_fact:
        xroad_is_cache_usable: >-
          {{
            (xroad_is_cached_show.rc | default(1)) == 0
            and (
              xrd_is_upstream_fp == ''
              or xroad_is_cached_props.ubuntu_base | default('')
                 == xrd_is_upstream_fp
            )
          }}

        xroad_ca_cache_usable: >-
          {{
            (xroad_ca_cached_show.rc | default(1)) == 0
            and (
              xrd_ca_upstream_fp == ''
              or xroad_ca_cached_props.ubuntu_base | default('')
                 == xrd_ca_upstream_fp
            )
          }}

    - name: Build per-container image source map
      set_fact:
        container_image_alias_map: >-
          {{
            ({'xrd-is': 'xroad-is-cached'} if xroad_is_cache_usable else {})
            | combine({'xrd-ca': 'xroad-ca-cached'} if xroad_ca_cache_usable else {})
          }}

    - name: Show cached image decisions
      debug:
        msg:
          - "xrd-is source: {{ container_image_alias_map['xrd-is'] | default(hostvars['xrd-is'].ubuntu_releasever ~ ' (upstream)') }}"
          - "xrd-ca source: {{ container_image_alias_map['xrd-ca'] | default(hostvars['xrd-ca'].ubuntu_releasever ~ ' (upstream)') }}"

- name: Ready all Ubuntu containers
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost
  become: "{{ onMacOs | default(true) }}"
  community.general.lxd_container:
    name: "{{ item }}"
    url: "{{ lxd_url | default(omit) }}"
    state: started
    source: "{{
      {
        'type': 'image',
        'mode': 'pull',
        'alias': container_image_alias_map[item]
      }
      if container_image_alias_map[item] is defined
      else {
        'type': 'image',
        'mode': 'pull',
        'server': 'https://cloud-images.ubuntu.com/releases',
        'protocol': 'simplestreams',
        'alias': hostvars[item].ubuntu_releasever
      }
    }}"
    profiles: ["default"]
    wait_for_ipv4_addresses: true
    devices: "{{ hostvars[item].container_ports | default({}) }}"
    timeout: 600
  tags:
    - ubuntu-container-init

- name: Force IPv4 for APT to prevent IPv6 timeouts
  raw: echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
  delegate_to: "{{ item }}"
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Configure safe APT timeouts
  raw: |
    cat <<EOF > /etc/apt/apt.conf.d/99timeouts
    Acquire::Connect::Timeout "5";
    Acquire::http::Timeout "10";
    Acquire::https::Timeout "10";
    Acquire::Retries "3";
    Acquire::http::LowSpeedLimit "100000";
    Acquire::http::LowSpeedTime "10";
    EOF
  delegate_to: "{{ item }}"
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Configure package mirror (Ubuntu)
  include_tasks: package-mirror.yml
  when: package_mirror_url is defined and package_mirror_user is defined and package_mirror_token is defined
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Disable unattended-upgrades
  raw: systemctl stop unattended-upgrades && systemctl disable unattended-upgrades
  ignore_errors: true
  delegate_to: "{{ item }}"
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Ready all Rocky Linux {{rhel_releasever}} containers
  become: "{{ onMacOs | default(true) }}"
  with_inventory_hostnames: rhel_ss
  community.general.lxd_container:
    name: "{{item}}"
    url: "{{ lxd_url | default(omit) }}"
    state: started
    source:
      type: image
      mode: pull
      server: https://images.lxd.canonical.com
      protocol: simplestreams
      alias: "rockylinux/{{ rhel_releasever }}"
    profiles: ["default"]
    wait_for_ipv4_addresses: true
    devices: "{{ hostvars[item].container_ports | default({}) }}"
    timeout: 600
  tags:
    - rhel-container-init
  vars:
    arch:
      aarch64: arm64
      x86_64: amd64

- name: Configure package mirror (Rocky Linux)
  include_tasks: package-mirror.yml
  when: package_mirror_url is defined and package_mirror_user is defined and package_mirror_token is defined
  with_inventory_hostnames: rhel_ss
