---
- name: Resolve cached image and Ubuntu freshness state
  become: "{{ onMacOs | default(true) }}"
  run_once: true
  block:
    - name: Read upstream Ubuntu fingerprint
      shell: |
        set -o pipefail
        lxc image info ubuntu:{{ ubuntu_releasever }} | awk '/^Fingerprint:/ {print $2; exit}'
      args:
        executable: /bin/bash
      register: ubuntu_upstream_fp_raw
      changed_when: false
      failed_when: false

    - name: Read xroad-is-cached image properties
      command: lxc image show xroad-is-cached
      register: xroad_is_cached_show
      changed_when: false
      failed_when: false

    - name: Read xroad-ca-cached image properties
      command: lxc image show xroad-ca-cached
      register: xroad_ca_cached_show
      changed_when: false
      failed_when: false

    - name: Read xroad-repo-cached image properties
      command: lxc image show xroad-repo-cached
      register: xroad_repo_cached_show
      changed_when: false
      failed_when: false

    - name: Compute cached image usability
      set_fact:
        ubuntu_upstream_fp: "{{ (ubuntu_upstream_fp_raw.stdout | trim) if ubuntu_upstream_fp_raw.rc == 0 else '' }}"
        xroad_is_cached_props: >-
          {{ (xroad_is_cached_show.stdout | from_yaml).properties | default({})
             if xroad_is_cached_show.rc == 0 else {} }}
        xroad_ca_cached_props: >-
          {{ (xroad_ca_cached_show.stdout | from_yaml).properties | default({})
             if xroad_ca_cached_show.rc == 0 else {} }}
        xroad_repo_cached_props: >-
          {{ (xroad_repo_cached_show.stdout | from_yaml).properties | default({})
             if xroad_repo_cached_show.rc == 0 else {} }}

    - name: Decide xroad-is cache usability
      set_fact:
        xroad_is_cache_usable: >-
          {{ (xroad_is_cached_show.rc | default(1)) == 0
             and (ubuntu_upstream_fp == ''
                  or xroad_is_cached_props.ubuntu_base | default('') == ubuntu_upstream_fp) }}
        xroad_ca_cache_usable: >-
          {{ (xroad_ca_cached_show.rc | default(1)) == 0
             and (ubuntu_upstream_fp == ''
                  or xroad_ca_cached_props.ubuntu_base | default('') == ubuntu_upstream_fp) }}
        xroad_repo_cache_usable: >-
          {{ (xroad_repo_cached_show.rc | default(1)) == 0
             and (ubuntu_upstream_fp == ''
                  or xroad_repo_cached_props.ubuntu_base | default('') == ubuntu_upstream_fp) }}

    - name: Build per-container image source map
      set_fact:
        container_image_alias_map: >-
          {{
            ({'xrd-is': 'xroad-is-cached'} if xroad_is_cache_usable else {})
            | combine({'xrd-ca': 'xroad-ca-cached'} if xroad_ca_cache_usable else {})
            | combine({'xrd-repo': 'xroad-repo-cached'} if xroad_repo_cache_usable else {})
          }}

    - name: Show cached image decisions
      debug:
        msg:
          - "xrd-is source: {{ container_image_alias_map['xrd-is'] | default(ubuntu_releasever ~ ' (upstream)') }}"
          - "xrd-ca source: {{ container_image_alias_map['xrd-ca'] | default(ubuntu_releasever ~ ' (upstream)') }}"
          - "xrd-repo source: {{ container_image_alias_map['xrd-repo'] | default(ubuntu_releasever ~ ' (upstream)') }}"

- name: Ready all Ubuntu {{ ubuntu_releasever }} containers
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost
  become: "{{ onMacOs | default(true) }}"
  community.general.lxd_container:
    name: "{{ item }}"
    url: "{{ lxd_url | default(omit) }}"
    state: started
    source: "{{
      {
        'type': 'image',
        'mode': 'pull',
        'alias': container_image_alias_map[item]
      }
      if container_image_alias_map[item] is defined
      else {
        'type': 'image',
        'mode': 'pull',
        'server': 'https://cloud-images.ubuntu.com/releases',
        'protocol': 'simplestreams',
        'alias': ubuntu_releasever
      }
    }}"
    profiles: ["default"]
    wait_for_ipv4_addresses: true
    devices: "{{ hostvars[item].container_ports | default({}) }}"
    timeout: 600
  tags:
    - ubuntu-container-init

- name: Bind-mount host package build dir into xrd-repo
  become: "{{ onMacOs | default(true) }}"
  shell: |
    set -e
    SRC={{ (playbook_dir + '/../../deployment/native-packages/build') | realpath }}
    HOST_UID=$(stat -c '%u' "$SRC")
    # Map Lima-visible owner of build dir to container root so dpkg-scanpackages /
    # createrepo_c can write Packages and repodata back to the host dir.
    lxc config set xrd-repo raw.idmap "both $HOST_UID 0"
    lxc config device remove xrd-repo xroad-build 2>/dev/null || true
    lxc config device add xrd-repo xroad-build disk source="$SRC" path=/srv/xroad-build
    lxc restart xrd-repo
    # Re-wait for network after restart.
    for i in $(seq 1 30); do
      ip=$(lxc list xrd-repo -c 4 --format csv | awk '{print $1}')
      [ -n "$ip" ] && [ "$ip" != "-" ] && exit 0
      sleep 1
    done
    echo "xrd-repo did not get an IPv4 in time" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: true
  tags:
    - ubuntu-container-init

- name: Force IPv4 for APT to prevent IPv6 timeouts
  raw: echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
  delegate_to: "{{ item }}"
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Configure safe APT timeouts
  raw: |
    cat <<EOF > /etc/apt/apt.conf.d/99timeouts
    Acquire::Connect::Timeout "5";
    Acquire::http::Timeout "10";
    Acquire::https::Timeout "10";
    Acquire::Retries "3";
    Acquire::http::LowSpeedLimit "100000";
    Acquire::http::LowSpeedTime "10";
    EOF
  delegate_to: "{{ item }}"
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Configure package mirror (Ubuntu)
  include_tasks: package-mirror.yml
  when: package_mirror_url is defined and package_mirror_user is defined and package_mirror_token is defined
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Disable unattended-upgrades
  raw: systemctl stop unattended-upgrades && systemctl disable unattended-upgrades
  ignore_errors: true
  delegate_to: "{{ item }}"
  with_inventory_hostnames: all:!lxd_servers:!rhel_ss:!localhost

- name: Ready all Rocky Linux {{rhel_releasever}} containers
  become: "{{ onMacOs | default(true) }}"
  with_inventory_hostnames: rhel_ss
  community.general.lxd_container:
    name: "{{item}}"
    url: "{{ lxd_url | default(omit) }}"
    state: started
    source:
      type: image
      mode: pull
      server: https://images.lxd.canonical.com
      protocol: simplestreams
      alias: "rockylinux/{{ rhel_releasever }}"
    profiles: ["default"]
    wait_for_ipv4_addresses: true
    devices: "{{ hostvars[item].container_ports | default({}) }}"
    timeout: 600
  tags:
    - rhel-container-init
  vars:
    arch:
      aarch64: arm64
      x86_64: amd64

- name: Configure package mirror (Rocky Linux)
  include_tasks: package-mirror.yml
  when: package_mirror_url is defined and package_mirror_user is defined and package_mirror_token is defined
  with_inventory_hostnames: rhel_ss
