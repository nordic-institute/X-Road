---
- name: Gather facts from target container
  setup:
  delegate_to: "{{ item }}"
  delegate_facts: true

- name: Provide the APT mirror auth helper (Debian-based)
  copy:
    src: "{{ role_path }}/../../../../deployment/.scripts/mirror-apt-auth.sh"
    dest: /tmp/mirror-apt-auth.sh
    mode: "0644"
  delegate_to: "{{ item }}"
  when: hostvars[item]['ansible_facts']['os_family'] == "Debian"

- name: Configure package mirror for APT (Debian-based)
  script:
    cmd: >-
      {{ role_path }}/../../../../deployment/.scripts/configure-mirror-apt.sh
      '{{ package_mirror_url }}'
      '{{ package_mirror_user }}'
  environment:
    XROAD_MIRROR_TOKEN: "{{ package_mirror_token }}"
  no_log: true
  delegate_to: "{{ item }}"
  when: hostvars[item]['ansible_facts']['os_family'] == "Debian"

- name: Remove the APT mirror auth helper (Debian-based)
  file:
    path: /tmp/mirror-apt-auth.sh
    state: absent
  delegate_to: "{{ item }}"
  when: hostvars[item]['ansible_facts']['os_family'] == "Debian"

- name: Configure package mirror for DNF (RedHat-based)
  script:
    cmd: >-
      {{ role_path }}/../../../../deployment/.scripts/configure-mirror-dnf.sh
      '{{ package_mirror_url | regex_replace('/mirror-.*$', '') }}'
      '{{ package_mirror_user }}'
  environment:
    XROAD_MIRROR_TOKEN: "{{ package_mirror_token }}"
  no_log: true
  delegate_to: "{{ item }}"
  when: hostvars[item]['ansible_facts']['os_family'] == "RedHat"
