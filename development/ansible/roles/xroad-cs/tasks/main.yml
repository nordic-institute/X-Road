---
# Pre-install preseed: runs before the xroad-centralserver packages' postinst
# auto-starts their units, so the values it places are on disk at first start.
# It carries dev-only tuning (the Issuer Service trust reload interval), which
# stays, and the XROAD_HOST systemd drop-ins, which go once packaging provides them.
- include_tasks: pre-cs-install.yml

- include_tasks: ubuntu.yml
  when: ansible_facts['os_family'] == "Debian"

- include_role:
    name: xroad-base
    tasks_from: postgres_remote_dev.yml
  when: enable_postgres_remote_access | default(false) | bool

- include_tasks: post-cs-install.yml
