---
- include_tasks: pre-cs-install.yml

- include_tasks: ubuntu.yml
  when: ansible_facts['os_family'] == "Debian"

- include_role:
    name: xroad-base
    tasks_from: postgres_remote_dev.yml
  when: enable_postgres_remote_access | default(false) | bool

- include_tasks: openbao-cluster-member.yml
  when: xroad_cs_openbao_cluster_nodes | length > 1 and inventory_hostname == xroad_cs_openbao_cluster_nodes | first

- include_tasks: post-cs-install.yml
