---
# TEMPORARY (dataspaces dev): remove stale systemd drop-in that set jwks.url
# via Environment= (superseded by local-ds-issuer-service.yaml placed by
# pre-cs-install.yml). The drop-in dir is created by the package, so this
# must run after install. Remove once the packages never shipped this drop-in.
- name: drop legacy ds-issuer-service systemd override (now in YAML)
  file:
    path: /etc/systemd/system/xroad-ds-issuer-service.service.d/jwks.conf
    state: absent

# Stopgap (XRDDEV-3294 retires this): the owned Jetty module reads the DS TLS
# certificate from OpenBao, not from the file ds-https-keystore.yml generates —
# seed the same key/cert into tls/ds-https so the co-located Issuer Service
# doesn't fail closed. Must run post-install: ds-https-keystore.yml runs
# pre-install (see pre-cs-install.yml), before xroad-secret-store-local's own
# package install has necessarily finished producing a client token.
- name: wait for secret store client token
  wait_for:
    path: /etc/xroad/secret-store-client-token
    state: present
    timeout: 180

# curl instead of the uri module: see the note on the xrd-ca wait task in
# ds-https-keystore.yml — the same ansible-core CA-trust-loading bug applies.
- name: write ds-https certificate and key to OpenBao
  shell: |
    set -euo pipefail
    TOKEN=$(cat /etc/xroad/secret-store-client-token)
    PAYLOAD=$(jq -n --rawfile cert /etc/xroad/ssl/ds-https-cert.pem --rawfile key /etc/xroad/ssl/ds-https-key.pem \
      '{certificate: $cert, privateKey: $key}')
    curl -fsSk -X POST \
      -H "X-Vault-Token: ${TOKEN}" \
      -H "Content-Type: application/json" \
      --data "$PAYLOAD" \
      "https://127.0.0.1:8200/v1/xrd-secret/tls/ds-https" >/dev/null
  args:
    executable: /bin/bash

# TEMPORARY (dataspaces dev): post-install safety net. Same reasoning as
# xroad-ss/tasks/post-ss-install.yml — `state: started` recovers any DS unit
# left `inactive` by a prior StartLimitBurst from before the preseed existed
# (or before tls/ds-https existed in OpenBao). Idempotent; not `restarted`.
# Remove once the env is stable.
- name: ensure DS units are running after install (idempotent — no restart)
  systemd:
    name: xroad-ds-issuer-service
    state: started

# The XRoadConfig DSL resolves DB overrides and packaged defaults only — env vars
# and conf.d yaml are ignored — so the issuer DID host must be a row in the
# centerui configuration_properties table (default is localhost; the SS side
# references did:web:<cs-host>...). Deterministic upsert; restart xroad-center
# because it resolved the DSL config before the row existed.
- name: seed dataspace issuer host into centerui configuration_properties
  become: true
  command:
    argv:
      - /usr/share/xroad/scripts/db_property.sh
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
      - --yes
  loop:
    - key: xroad.dataspace.issuer.host
      value: "{{ groups['cs_servers'] | first }}"
    - key: xroad.admin-service.global-configuration-generation-rate-in-seconds
      value: "10"
    # See the identical setting in xroad-ss/tasks/seed-config-properties.yml —
    # the Issuer Service's own outbound self-connect trust and DID publication
    # need globalconf (approved DS TLS CAs) to propagate on the same shortened
    # cadence, gated by this key rather than xroad.edc.web.https.trust.reload-interval-seconds.
    - key: xroad.common-global-conf.refresh-rate
      value: "5S"
  loop_control:
    label: "{{ item.key }}"

- name: restart xroad-center to resolve the seeded issuer host
  systemd:
    name: xroad-center
    state: restarted

- name: restart xroad-ds-issuer-service to resolve the seeded configuration
  systemd:
    name: xroad-ds-issuer-service
    state: restarted

# TEMPORARY FIX — race in ManagementServiceSslBundleRegistrar
# (core/src/common/common-management-service/.../ManagementServiceSslBundleRegistrar.java).
# Both xroad-center-management-service and xroad-center-registration-service share
# the vault path `tls/management-service` and each calls `ensureTlsKeyPresent()`
# at startup. On a clean install the path is empty, so BOTH services provision a
# fresh keypair via `vaultKeyClient.provisionNewCerts()` and `createManagementServiceTlsCredentials`
# overwrites whichever wrote first. The losing service stays in memory with cert A
# while vault (and the second service) hold cert B; admin-service's globalconf-generator
# (PrivateParametersLoader.java:73) then publishes cert B as authCertRegServiceCert
# while port 4001 (registration-service) actually presents cert A → SS auth-cert
# registration fails with "Central server TLS certificate does not match in global conf".
#
# The proper fix is to make ensureTlsKeyPresent idempotent across services
# (one writer, others read-only) — see ManagementServiceSslBundleRegistrar.
# Until then: restart registration-service AFTER both have settled. The restarted
# instance will read the now-populated vault entry and serve whichever cert
# management-service wrote (also what globalconf advertises). One sync point is
# enough — vault state is then stable.
- name: wait for management & registration services to be active (race resolution prerequisite)
  systemd:
    name: "{{ item }}"
  register: cs_mgmt_reg_state
  until: cs_mgmt_reg_state.status.ActiveState == "active"
  retries: 30
  delay: 2
  loop:
    - xroad-center-management-service
    - xroad-center-registration-service

- name: restart xroad-center-registration-service so its TLS bundle reloads from vault
  systemd:
    name: xroad-center-registration-service
    state: restarted
