---
- name: debconf xroad-center
  debconf:
    name: xroad-center
    question: "{{ item.question }}"
    vtype: "string" # parametrize if you add a different type of question to item list
    value: "{{ item.value }}"
  loop:
    - { question: "xroad-common/username", value: "{{ xroad_ui_user }}" }
    - { question: "xroad-common/database-host", value: "{{ database_host }}" }
    - { question: "xroad-common/admin-subject", value: "{{ inventory_hostname }}.lxd" }
    - { question: "xroad-common/admin-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ inventory_hostname }}.lxd,DNS:{{ inventory_hostname }}" }
    - { question: "xroad-common/service-subject", value: "{{ inventory_hostname }}.lxd" }
    - { question: "xroad-common/service-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ inventory_hostname }}.lxd,DNS:{{ inventory_hostname }}" }
    - { question: "xroad-common/global-conf-subject", value: "/CN={{ inventory_hostname }}.lxd" }
    - { question: "xroad-common/global-conf-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ inventory_hostname }}.lxd,DNS:{{ inventory_hostname }}" }
    - { question: "xroad-common/skip-cs-db-migrations", value: "false" }
  tags:
    - install-xroad-cs-packages

- name: create xroad properties file
  copy:
    content: "postgres.connection.password = {{ database_admin_password }}"
    dest: /etc/xroad.properties
    mode: "0600"
  when: (database_admin_password is defined) and (database_admin_password != "")

- name: use remote database
  apt:
    name: xroad-database-remote
  when: (database_admin_password is defined) and (database_admin_password != "")

# TEMPORARY (dataspaces dev): installed ahead of xroad-centralserver so its local secret store
# (OpenBao) is up before ds-tls-vault-provision.yml writes the DS TLS certificate -
# xroad-ds-issuer-service (pulled in below) fails fast at boot if that vault slot is empty.
# xroad-secret-store-local is already a direct dependency of xroad-ds-issuer-service, so
# installing it explicitly here is a no-op for apt once the main install runs; it only changes
# the order in which it configures.
- name: install xroad-secret-store-local ahead of the rest of the package set
  apt:
    name: xroad-secret-store-local
    state: latest
  tags:
    - install-xroad-cs-packages

- include_tasks: ds-tls-vault-provision.yml
  tags:
    - install-xroad-cs-packages

- name: install xroad central server
  apt:
    name: xroad-centralserver
    state: latest
    force: true
  tags:
    - install-xroad-cs-packages
