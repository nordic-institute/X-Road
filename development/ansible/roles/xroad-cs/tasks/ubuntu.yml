---
- name: debconf xroad-center
  debconf:
    name: xroad-center
    question: "{{ item.question }}"
    vtype: "string" # parametrize if you add a different type of question to item list
    value: "{{ item.value }}"
  loop:
    - { question: "xroad-common/username", value: "{{ xroad_ui_user }}" }
    - { question: "xroad-common/database-host", value: "{{ database_host }}" }
    - { question: "xroad-common/admin-subject", value: "{{ xroad_host_fqdn }}" }
    - { question: "xroad-common/admin-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ xroad_host_fqdn }}{{ xroad_host_extra_dns_san }}" }
    - { question: "xroad-common/service-subject", value: "{{ xroad_host_fqdn }}" }
    - { question: "xroad-common/service-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ xroad_host_fqdn }}{{ xroad_host_extra_dns_san }}" }
    - { question: "xroad-common/global-conf-subject", value: "/CN={{ xroad_host_fqdn }}" }
    - { question: "xroad-common/global-conf-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ xroad_host_fqdn }}{{ xroad_host_extra_dns_san }}" }
    - { question: "xroad-common/skip-cs-db-migrations", value: "false" }
    - { question: "xroad-common/dataspace-issuer-host", value: "{{ groups['cs_servers'] | first }}" }
  tags:
    - install-xroad-cs-packages

- name: create xroad properties file
  copy:
    content: "postgres.connection.password = {{ database_admin_password }}"
    dest: /etc/xroad.properties
    mode: "0600"
  when: (database_admin_password is defined) and (database_admin_password != "")

- name: use remote database
  apt:
    name: xroad-database-remote
  when: (database_admin_password is defined) and (database_admin_password != "")

- name: install xroad central server
  apt:
    name: xroad-centralserver
    state: latest
    force: true
  tags:
    - install-xroad-cs-packages
