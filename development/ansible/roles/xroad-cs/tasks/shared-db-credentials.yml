---
# Copies the first node's Central Server database credentials to this node before the package
# install, so the install meets the existing database roles instead of generating new passwords.
# Values stay in memory (slurp/command results under no_log) and never reach the controller disk.
- name: read db.properties of the first node
  slurp:
    src: /etc/xroad/db.properties
  delegate_to: "{{ xroad_cs_openbao_cluster_nodes | first }}"
  register: cs_first_node_db_properties
  no_log: true

- name: write db.properties of the first node to this node
  command:
    argv:
      - bash
      - -c
      - |
        set -e
        target="$1"
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        base64 -d >"$tmp"
        if [ -f "$target" ] && cmp -s "$tmp" "$target" \
            && [ "$(stat -c '%U:%G:%a' "$target")" = "xroad:xroad:640" ]; then
          echo unchanged
        else
          install -o xroad -g xroad -m 0640 "$tmp" "$target"
          echo changed
        fi
      - db-properties-copy
      - /etc/xroad/db.properties
    stdin: "{{ cs_first_node_db_properties.content }}"
  register: cs_db_properties_copy
  changed_when: cs_db_properties_copy.stdout == 'changed'
  no_log: true

- name: read the database admin credentials of the first node
  command: grep -E '^centerui\.database\.admin_(user|password)[[:space:]]*=' /etc/xroad.properties
  delegate_to: "{{ xroad_cs_openbao_cluster_nodes | first }}"
  register: cs_first_node_db_admin
  changed_when: false
  failed_when: cs_first_node_db_admin.rc > 1
  check_mode: false
  no_log: true

- name: check that both database admin credentials were found
  assert:
    that: cs_first_node_db_admin.stdout_lines | length == 2
    fail_msg: "/etc/xroad.properties of the first node must hold centerui.database.admin_user and centerui.database.admin_password"
    quiet: true

- name: set the database admin credentials of the first node in xroad.properties
  lineinfile:
    path: /etc/xroad.properties
    regexp: "^{{ item.split('=') | first | trim | regex_escape }}\\s*="
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ cs_first_node_db_admin.stdout_lines }}"
  loop_control:
    label: "centerui.database.admin credential"
  no_log: true
