---
# TEMPORARY (dataspaces dev): everything in this file is a workaround for the fact
# that xroad-centralserver package auto-starts xroad-ds-issuer-service before
# its runtime config is on disk, causing crash-loop / StartLimitBurst.
# Pre-seeding here lets the service boot cleanly once the DS TLS certificate is
# provisioned via the admin API.
#
# Remove this file (and the `include_tasks: pre-cs-install.yml` line in main.yml)
# once upstream packaging ships debconf preseeds or cloud-init hooks for:
#   - ds-issuer-service: hostname, statuslist.callback.address
# AND the package no longer starts the unit unconditionally during postinst.

# ---------------------------------------------------------------------------
# 1. /etc/xroad/conf.d — xroad-common creates this during install; we need
#    it earlier to drop YAML preseed files before any postinst auto-starts a
#    unit. dpkg leaves pre-existing dirs intact (not a conffile).
#
# TEMPORARY (dataspaces dev): remove once packages ship the config stubs.
# ---------------------------------------------------------------------------
- name: ensure /etc/xroad/conf.d exists for preseeded configs
  file:
    path: /etc/xroad/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# 2b. TLS certificate host for the vault-provisioned service certs. The cert
#     common-name resolves from the XROAD_HOST env var (default localhost);
#     management/registration-service run Jetty with SNI validation, so the SS
#     connecting to https://<cs>.lxd:4001 gets "400 Invalid SNI" when the cert
#     says localhost. Provisioning is only-if-absent, so the env var must be in
#     place before the package postinst starts the services the first time —
#     hence systemd drop-ins created pre-install (they apply once the units
#     appear).
# ---------------------------------------------------------------------------
- name: create systemd drop-in dirs for XROAD_HOST
  file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: &cs_xroad_host_units
    - xroad-center
    - xroad-center-management-service
    - xroad-center-registration-service

- name: set XROAD_HOST for CS services (TLS cert common-name)
  copy:
    dest: "/etc/systemd/system/{{ item }}.service.d/xroad-host.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment=XROAD_HOST={{ inventory_hostname }}.lxd
  loop: *cs_xroad_host_units
  register: cs_xroad_host_dropins

- name: reload systemd after drop-in changes
  systemd:
    daemon_reload: true
  when: cs_xroad_host_dropins is changed

# ---------------------------------------------------------------------------
# 2a. Vault CA for the Issuer Service's own EDC/Hashicorp vault client. The DS
#     TLS trust replaces JVM defaults on the shared EDC OkHttp client, so
#     OpenBao's self-signed cert (installed system-wide by
#     xroad-secret-store-local's postinst) is no longer trusted implicitly —
#     the vault-specific escape hatch must point at it. QUARKUS_VAULT_TLS_CA_CERT
#     is read via plain System.getenv in VaultEndpointTrust, never through
#     EDC's @Setting resolution, so it is not subject to the QuarkusConfigBridge
#     env-var limitation noted below.
#
#     Points at the installed system copy (644, world-readable) rather than
#     /opt/openbao/tls/tls.crt itself (640, openbao:openbao only) to avoid a
#     second permissions dependency.
# ---------------------------------------------------------------------------
- name: create systemd drop-in dir for QUARKUS_VAULT_TLS_CA_CERT
  file:
    path: /etc/systemd/system/xroad-ds-issuer-service.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: set QUARKUS_VAULT_TLS_CA_CERT for the Issuer Service's EDC vault client
  copy:
    dest: /etc/systemd/system/xroad-ds-issuer-service.service.d/vault-tls-ca.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment=QUARKUS_VAULT_TLS_CA_CERT=/usr/local/share/ca-certificates/openbao.crt
  register: cs_vault_tls_ca_dropin

# The Issuer Service fails fast on an empty tls/ds-https vault slot (by design) until
# run-hurl.sh provisions the DS TLS certificate through the admin API — which happens
# only after this playbook has finished. The packaged unit's default start-limit would
# leave it permanently dead long before that; keep it retrying instead.
- name: keep the Issuer Service retrying until the DS TLS certificate is provisioned
  copy:
    dest: /etc/systemd/system/xroad-ds-issuer-service.service.d/ds-tls-retry.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      StartLimitIntervalSec=0
      [Service]
      RestartSec=5
  register: cs_ds_retry_dropin

- name: reload systemd after the Issuer Service drop-ins
  systemd:
    daemon_reload: true
  when: cs_vault_tls_ca_dropin is changed or cs_ds_retry_dropin is changed

# ---------------------------------------------------------------------------
# 2. DS issuer-service runtime overrides. EDC's QuarkusConfigBridge only sees
#    enumerable SmallRye sources (yaml/properties files); env-vars never reach
#    EDC's @Setting resolution. These must exist before the unit's first start.
#
#    edc.statuslist.callback.address: EDC's LocalStatusListCredentialPublisher
#    composes "http://${edc.hostname}:6187/statuslist" by default, but
#    edc.hostname (templated as ${HOSTNAME} in application.yaml) doesn't resolve
#    because the systemd unit doesn't export HOSTNAME to the JVM, so EDC
#    defaults to "localhost". The URL must be reachable from any consumer SS's
#    Identity Hub during VP validation — we point at the CS host directly.
#    https because the owned Jetty module serves TLS on every ds-* port; plain
#    http would surface as "unexpected end of stream" on the IH side.
#
# TEMPORARY (dataspaces dev): remove once xroad-ds-issuer-service debconf ships
#   hostname and statuslist.callback.address.
#
#    xroad.edc.web.https.trust.reload-interval-seconds: see the identical setting in
#    xroad-ss/tasks/pre-ss-install.yml — the Issuer Service's own outbound self-connect trust needs
#    the same reload-cycle shortening, since it is subject to the same fail-closed trust extension.
# ---------------------------------------------------------------------------
- name: preseed ds-issuer-service runtime overrides
  copy:
    dest: /etc/xroad/conf.d/local-ds-issuer-service.yaml
    owner: xroad
    group: xroad
    mode: "0640"
    content: |
      edc:
        hostname: "{{ groups['cs_servers'] | first }}"
        statuslist:
          callback:
            # https because the owned Jetty module serves TLS on every ds-* port —
            # plain http here surfaces as "unexpected end of stream" on the IH side.
            address: "https://{{ groups['cs_servers'] | first }}:6187/statuslist"
      xroad:
        edc:
          web:
            https:
              trust:
                reload-interval-seconds: 5

