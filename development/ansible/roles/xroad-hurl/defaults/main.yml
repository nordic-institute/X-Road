---
hurl_version: "8.0.1"
hurl_install_dir: "/opt/hurl"
hurl_scenario_dir: "{{ playbook_dir }}/../hurl/scenarios"
# Order matters: run-hurl.sh sorts by filename. `setup.hurl` must run before the
# `test-proxy-*.hurl` scenarios, which exercise flows it provisions.
hurl_files:
  - setup.hurl
  - test-proxy-rest.hurl
  - test-proxy-soap.hurl
  - test-proxy-dsp.hurl
hurl_env_file: "files/vars.env"
