---
- name: resolve postgres config paths
  become: true
  become_user: postgres
  command: psql -tAXc "{{ item.q }}"
  register: pg_paths
  changed_when: false
  loop:
    - { key: conf, q: "SHOW config_file" }
    - { key: hba,  q: "SHOW hba_file" }
  loop_control:
    label: "{{ item.key }}"

- set_fact:
    pg_conf_path: "{{ (pg_paths.results | selectattr('item.key','equalto','conf') | first).stdout | trim }}"
    pg_hba_path:  "{{ (pg_paths.results | selectattr('item.key','equalto','hba')  | first).stdout | trim }}"

- name: postgres listen on all interfaces
  become: true
  lineinfile:
    path: "{{ pg_conf_path }}"
    regexp: '^\s*#?\s*listen_addresses\s*='
    line: "listen_addresses = '*'"
    backup: true
  notify: restart postgresql (dev remote)

- name: pg_hba rules for dev CIDRs
  become: true
  blockinfile:
    path: "{{ pg_hba_path }}"
    marker: "# {mark} ANSIBLE MANAGED — dev remote access"
    block: |
      {% for cidr in pg_remote_dev_cidrs %}
      host    all    all    {{ cidr }}    md5
      host    all    all    {{ cidr }}    scram-sha-256
      {% endfor %}
    backup: true
  notify: restart postgresql (dev remote)
