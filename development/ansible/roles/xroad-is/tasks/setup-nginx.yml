---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true
    install_recommends: false
  when: not cache_marker.stat.exists

- name: Configure Nginx for mock service
  template:
    src: templates/nginx-mock.conf.j2
    dest: /etc/nginx/sites-available/mock-service
    mode: "0644"

- name: Enable mock service site
  file:
    src: /etc/nginx/sites-available/mock-service
    dest: /etc/nginx/sites-enabled/mock-service
    state: link

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: ensure nginx running
  service:
    name: nginx
    state: "{{ 'restarted' if not cache_marker.stat.exists else 'started' }}"
    enabled: true
