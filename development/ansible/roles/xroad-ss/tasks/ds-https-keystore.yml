---
# WIP / DEV: provision a TLS keystore for ds-* services.
#
# Trust root: xrd-ca (the env-wide test CA). One CA signs every ds-* host's
# server cert, so all containers trust each other through a single anchor.
# OpenBao's xrd-pki engine is NOT used for this — its CA is per-container,
# which would force cross-distribution of three CA bundles for inter-host
# trust. xrd-ca's auth_ext profile already issues with EKU = clientAuth,
# serverAuth (verified in /home/ca/CA/CA.cnf), suitable for TLS server use.
#
# EDC's JettyService applies one keystore globally — enabling the keystore
# lights up TLS on every ds-* port (identity, did, sts, issuance, admin) at
# once. Hurl scenarios + service-to-service callers must therefore speak
# https. The xrd-ca CA is installed into the system trust store so the JVM
# trusts certs presented by sibling ds-* hosts (ca-certificates-java on
# Debian / update-ca-trust on RHEL refreshes the JVM cacerts automatically).
#
# Production: replace xrd-ca with the federation's real internal CA; rotate
# the keystore via your existing PKI lifecycle.

- name: set ds-https provisioning facts
  set_fact:
    xrd_ca_host: "{{ groups.ca_servers | first }}"

- name: ensure ds-https keystore directory exists
  file:
    path: /etc/xroad/ssl
    state: directory
    owner: xroad
    group: xroad
    mode: "0750"

- name: stat existing ds-https keystore
  stat:
    path: /etc/xroad/ssl/ds-https.p12
  register: ds_https_keystore_stat

- name: wait for xrd-ca signing endpoint to be ready
  uri:
    url: "http://{{ xrd_ca_host }}:8888/testca/certs/ca.cert.pem"
    status_code: 200
  register: xrdca_ready
  retries: 30
  delay: 2
  until: xrdca_ready.status == 200

# Shell body intentionally contains no jinja2 templating — Ansible's split_args
# trips on jinja2 + nested quotes. Values come in via environment: instead.
- name: provision ds-https keystore from xrd-ca
  shell: |
    set -euo pipefail
    cd /etc/xroad/ssl
    openssl genrsa -out ds-https-key.pem 2048
    openssl req -new -key ds-https-key.pem -out ds-https-auth.csr -subj "/CN=${HOST}" -addext "subjectAltName=DNS:${HOST},DNS:${HOST}.lxd,DNS:localhost,IP:127.0.0.1,IP:::1"
    curl -fsS -X POST -F "type=auth" -F "certreq=@ds-https-auth.csr" "http://${CA_HOST}:8888/testca/sign" -o ds-https-cert.pem
    curl -fsS "http://${CA_HOST}:8888/testca/certs/ca.cert.pem" -o ds-https-ca.pem
    openssl pkcs12 -export -out ds-https.p12 -inkey ds-https-key.pem -in ds-https-cert.pem -certfile ds-https-ca.pem -name ds-https -password pass:changeit
    chmod 0640 ds-https-cert.pem ds-https-ca.pem ds-https.p12
    chmod 0600 ds-https-key.pem
    chown xroad:xroad ds-https-key.pem ds-https-cert.pem ds-https-ca.pem ds-https.p12
    : > ds-https-auth.csr
  args:
    executable: /bin/bash
  environment:
    HOST: "{{ inventory_hostname }}"
    CA_HOST: "{{ xrd_ca_host }}"
  when: not ds_https_keystore_stat.stat.exists

- name: install xrd-ca CA into system trust store (Debian)
  copy:
    src: /etc/xroad/ssl/ds-https-ca.pem
    dest: /usr/local/share/ca-certificates/xrd-ca.crt
    remote_src: true
    mode: "0644"
  register: ds_https_ca_copy_deb
  when: ansible_facts['os_family'] == "Debian"

- name: refresh system CA trust bundle (Debian)
  command: update-ca-certificates --fresh
  when:
    - ansible_facts['os_family'] == "Debian"
    - ds_https_ca_copy_deb.changed | default(false)

- name: install xrd-ca CA into system trust store (RHEL)
  copy:
    src: /etc/xroad/ssl/ds-https-ca.pem
    dest: /etc/pki/ca-trust/source/anchors/xrd-ca.crt
    remote_src: true
    mode: "0644"
  register: ds_https_ca_copy_rhel
  when: ansible_facts['os_family'] == "RedHat"

- name: refresh system CA trust bundle (RHEL)
  command: update-ca-trust extract
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ds_https_ca_copy_rhel.changed | default(false)
