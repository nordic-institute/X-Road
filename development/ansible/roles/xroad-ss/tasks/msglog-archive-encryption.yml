---
# Archive-encryption config itself (grouping keys/strategy, default key id) is preseeded together
# with DB encryption in msglog-encryption.yml — both subkeys must share one top-level
# "message-log-encryption:" block (see comment there for why). This file covers the remaining
# pieces: parking the auxiliary-service archive/clean crons, making cleanup immediate, and
# importing the recipient PGP public keys into openbao.

# Compose parks these on the auxiliary-service container only (env vars on that service in
# compose.ss-msglog.e2e.yaml); the e2e scenarios trigger archive/cleanup manually via the CLI for
# deterministic timing. "off" is accepted by Quarkus SchedulerUtils.isOff for both properties.
- name: seed auxiliary-service message-log cron parking
  become: true
  command:
    argv:
      - /usr/share/xroad/scripts/db_property.sh
      - set
      - "{{ item }}"
      - "off"
      - --yes
  loop:
    - xroad.auxiliary-service.message-log.archive-cron
    - xroad.auxiliary-service.message-log.clean-cron
  notify: restart xroad-auxiliary-service

# xroad.message-log-archiver.clean-keep-records-for defaults to 30 (days) — compose seeds 0 so a
# freshly archived record is eligible for cleanup immediately. Read by the CLI process itself
# (not auxiliary-service), so no restart is needed: the CLI resolves config on every invocation.
- name: seed messagelog archiver immediate-cleanup retention
  become: true
  command:
    argv:
      - /usr/share/xroad/scripts/db_property.sh
      - set
      - xroad.message-log-archiver.clean-keep-records-for
      - "0"
      - --yes

# xrd-ss1-ONLY, mirroring compose: ComposeEnvSetup.importPublicKeysToBao is only called for the
# envSs1 environment (guarded by features.contains(Feature.MESSAGE_LOG_ENCRYPTION)) — ss0 never
# gets the keys imported into its openbao. The xroad client token (read from
# /etc/xroad/secret-store-client-token, exported by secret-store-local.conf into every xroad-*
# process's environment) already carries write access to xrd-secret/message-log/archival/pgp/*
# via the xroad-policy ACL (_openbao.sh configure_pki). KV v1 write: POST /v1/<mount>/<path> with
# a "payload" field, mirroring `bao write xrd-secret/message-log/archival/pgp/public-keys
# payload=@public-keys.asc`.
- name: copy PGP public keys fixture to SS host
  copy:
    src: "{{ playbook_dir }}/../../src/security-server/e2e-test/src/intTest/resources/gpg_keys/public-keys.asc"
    dest: /etc/xroad/msglog-archival-public-keys.asc
    owner: xroad
    group: xroad
    mode: "0640"
  when: inventory_hostname == 'xrd-ss1'

- name: import PGP public keys into openbao at message-log/archival/pgp/public-keys
  ansible.builtin.shell: >-
    set -o pipefail &&
    . /etc/xroad/services/secret-store-local.conf &&
    jq -Rs '{payload: .}' /etc/xroad/msglog-archival-public-keys.asc |
    curl -fsS -k -X POST
    -H "X-Vault-Token: ${XROAD_SECRET_STORE_TOKEN}"
    -d @-
    "${XROAD_SECRET_STORE_SCHEME}://${XROAD_SECRET_STORE_HOST}:${XROAD_SECRET_STORE_PORT}/v1/xrd-secret/message-log/archival/pgp/public-keys"
  args:
    executable: /bin/bash
  changed_when: true
  when: inventory_hostname == 'xrd-ss1'
