---
# TEMPORARY (dataspaces dev): everything in this file is a workaround for the fact
# that xroad-* packages auto-start EDC systemd units (ds-identity-hub,
# ds-control-plane, xroad-proxy) before their runtime configs and TLS keystore
# are on disk, causing crash-loop / StartLimitBurst. Pre-seeding here lets every
# service boot exactly once, cleanly.
#
# Remove this file (and the `include_tasks: pre-ss-install.yml` line in main.yml)
# once upstream packaging ships debconf preseeds or cloud-init hooks for:
#   - ds-control-plane:  participant-context-id
#   - ds-identity-hub:   jwks.url, keystore path
#   - xroad-proxy:       dsp.participant-context-id
# AND the packages no longer start the units unconditionally during postinst.

# xroad user/group are already created by the xroad-base role (meta dependency
# of xroad-ss) before this file runs, so keystore tasks below can `chown
# xroad:xroad` without pre-creating anything.

# ---------------------------------------------------------------------------
# 1. /etc/xroad/conf.d — config dir. xroad-common creates this during install;
#    we need it earlier so we can drop YAML preseed files before any package
#    auto-starts a unit. dpkg leaves pre-existing dirs intact (not a conffile).
#
# TEMPORARY (dataspaces dev): remove once packages ship the config stubs.
# ---------------------------------------------------------------------------
- name: ensure /etc/xroad/conf.d exists for preseeded configs
  file:
    path: /etc/xroad/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# 3. Preseed DSP proxy config. xroad-proxy postinst starts the proxy; strict
#    SmallRye validation aborts startup when dsp.participant-context-id is
#    missing. Dropping the file here lets the first package-driven start succeed.
#
# TEMPORARY (dataspaces dev): remove once xroad-proxy debconf ships
#   participant-context-id as an answerable question.
# ---------------------------------------------------------------------------
- name: preseed DSP control plane config (must precede xroad-proxy package install)
  copy:
    dest: /etc/xroad/conf.d/local-dsp.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      xroad:
        proxy:
          dsp:
            participant-context-id: "{{ inventory_hostname }}.lxd"
            cache:
              enabled: false

# ---------------------------------------------------------------------------
# 3b. Preseed proxy-ui-api dataspace provisioning config.
#     identity-hub-url MUST be this host's FQDN, not localhost: the
#     provisioning service derives the holder DID, the credentialService endpoint
#     (where the issuer on the CS pushes the issued credential) and the STS token
#     URL from its host, and all three must be reachable cross-host. proxy-ui-api
#     only imports local.yaml and local-tls.yaml, so this is injected into
#     local.yaml. The reconciler drives provisioning automatically at SS init
#     and on each globalconf-refresh tick; no manual API call is needed.
#
#     xroad.dataspace.*-provisioning.rpc: the provisioning gRPC client defaults
#     (ds-identity-hub:5460 / ds-control-plane:5460) are Docker service names;
#     here both runtimes are co-located, so point at loopback (127.0.0.1, not
#     localhost — the mTLS server cert carries an IP SAN) and give identity-hub
#     its non-default port (see 4.).
#
# TEMPORARY (dataspaces dev): remove once packaging ships these as debconf
#   answerable questions / real STS-issued tokens.
# ---------------------------------------------------------------------------
- name: ensure local.yaml exists with proxy-ui-api root for the dataspace block
  copy:
    dest: /etc/xroad/conf.d/local.yaml
    force: false
    owner: xroad
    group: xroad
    mode: "0640"
    content: |
      xroad:
        proxy-ui-api:

- name: preseed proxy-ui-api dataspace provisioning config into local.yaml
  blockinfile:
    path: /etc/xroad/conf.d/local.yaml
    insertafter: '^  proxy-ui-api:'
    marker: "    # {mark} DATASPACE PROVISIONING (lxd dev preseed)"
    block: "    dataspace:\n      identity-hub-url: https://{{ inventory_hostname }}.lxd:7182\n      control-plane-url: https://localhost:8182\n      participant-id: {{ inventory_hostname }}.lxd\n      issuer-did: did:web:{{ groups['cs_servers'] | first }}%3A6183:issuer\n      identity-token: eyJraWQiOiI3NGYzNDIyYjM3ZmM4Njg4ZTdmNWE3NDE2MjdmODg4OSIsInR5cCI6ImF0K2p3dCIsImFsZyI6IlJTMjU2In0.eyJpc3MiOiJ0ZXN0LWlzc3VlciIsImV4cCI6MjAwNDI2ODkwMCwiaWF0IjoxNzgzNTE2OTAwLCJqdGkiOiI3NDcyYmExN2ExMjE0MGI3YWVhNjNlNDM2ZWI1OTMxMSIsInNjb3BlIjoiaWRlbnRpdHktYXBpOmFkbWluIn0.LTjYT366IgFiI12rkxBatvzoIbtTzoYYVXRE9ytAJ23thT_cVid6Gv3m7XKe6bEphARXodhJqTwxeLYMtHAI_XIIC50xZ76e2mo9qLF9LX3JR2_Y5prMDb1BjmYpzedLupnu8SwB2W9n7POYeaMMTTXDlCZsqR2zffwZaCliXGWuj9VLdp0SUvNc8Xz9LMR1C0NNwL-HSH0oBHzMTn0E7kFSJ5HU0AZNa-h9ZNpYu6e4S_Yx7Lo4xRFtVMFRCW8sqfWfqjE861DVGTaQKgmBerbA0jfgaOWB4IU_8EwPBse68N2w8rCUJ4NU6MgRpd8uKEAbSBwNCmSpBvOOriqqAw\n      control-plane-token: eyJraWQiOiI3NGYzNDIyYjM3ZmM4Njg4ZTdmNWE3NDE2MjdmODg4OSIsInR5cCI6ImF0K2p3dCIsImFsZyI6IlJTMjU2In0.eyJpc3MiOiJ0ZXN0LWlzc3VlciIsImV4cCI6MjAwNDI2ODkwMCwiaWF0IjoxNzgzNTE2OTAwLCJqdGkiOiJjZWI1MjYzM2M1YjU0MDU3OWM3OTIxZTRmN2QyOWM3NSIsInNjb3BlIjoibWFuYWdlbWVudC1hcGk6YWRtaW4ifQ.iNTzn9fdrEkO5SChx8d9aZI34kKW7HV6EfUauPHUs_HC7OpGXMra9qLaEUwcNVmaPdIp7qypBG-wgIEn9znZ6inhDI7V4hoGVTEE7bZS2jar5LTcnr_tt-7Y-frV7GX-qW-b-C9y7hDWpTE_D4mPCLXvhSPjKYAS3_ZP2uCryQ6wGyFUToyf39YDnMOys2vpkI9knnCDfdFFoPsLmVWAz7CWjtV5J_IpTwRP2c63trsPVuPn85tQqXIDI8-geiXmxUVGWFGQQSkCyHX3xSbFE0vC23HFFxkmV0EUr8qFS6wDNiSFw2UYmYfWgfMk64xRY3d07HFbAWwgYa4tZixT6Q\n  dataspace:\n    identity-hub-provisioning:\n      rpc:\n        host: 127.0.0.1\n        port: 5461\n    control-plane-provisioning:\n      rpc:\n        host: 127.0.0.1"

# ---------------------------------------------------------------------------
# 4. DS identity-hub runtime overrides. EDC's QuarkusConfigBridge only sees
#    enumerable SmallRye sources (yaml/properties files); env-vars never reach
#    EDC's @Setting resolution. These must exist before the unit's first start.
#
# TEMPORARY (dataspaces dev): remove once xroad-ds-identity-hub debconf ships
#   edc.iam.oauth2.jwks.url and keystore config as answerable questions.
# ---------------------------------------------------------------------------
- name: preseed ds-identity-hub runtime overrides
  copy:
    dest: /etc/xroad/conf.d/local-ds-identity-hub.yaml
    owner: xroad
    group: xroad
    mode: "0640"
    content: |
      # Both EDC runtimes default the shared gRPC server to 5460; co-located on
      # one host, the control plane keeps 5460 (the proxy asset-access client
      # defaults to 127.0.0.1:5460) and identity-hub moves off it (matching the
      # proxy-ui-api client preseed in 3b).
      xroad:
        ds:
          rpc:
            port: 5461
      edc:
        iam:
          oauth2:
            jwks:
              url: "http://{{ groups['cs_servers'] | first }}:8099/jwks.json"
        web:
          https:
            keystore:
              path: "/etc/xroad/ssl/ds-https.p12"
              type: "PKCS12"
              password: "changeit"
            keymanager:
              password: "changeit"

# ---------------------------------------------------------------------------
# 5. DS control-plane runtime overrides. Same reasoning as identity-hub above.
#
# TEMPORARY (dataspaces dev): remove once xroad-ds-control-plane debconf ships
#   participant-context-id, jwks.url, trusted-issuer.id, sts.oauth.token.url,
#   dsp.callback.address, and keystore config.
# ---------------------------------------------------------------------------
- name: preseed ds-control-plane runtime overrides
  copy:
    dest: /etc/xroad/conf.d/local-ds-control-plane.yaml
    owner: xroad
    group: xroad
    mode: "0640"
    content: |
      edc:
        # TODO: EDC's DspApiBaseConfigurationExtension.defaultWebhookAddress() hardcodes
        # http:// and uses Hostname.get() — which is "localhost" inside the systemd unit
        # because HOSTNAME isn't exported to the JVM. Both defects need to be addressed
        # properly (upstream patch or proper hostname propagation + scheme override).
        # For now pin the callback address explicitly so contract-agreement POSTs go to
        # the right host over TLS.
        dsp:
          callback:
            address: "https://{{ inventory_hostname }}.lxd:8183/api/dsp/%s"
        iam:
          oauth2:
            jwks:
              url: "http://{{ groups['cs_servers'] | first }}:8099/jwks.json"
          trusted-issuer:
            issuer:
              id: "did:web:{{ groups['cs_servers'] | first }}%3A6183:issuer"
          credential:
            revocation:
              cache:
                validity: 1
          sts:
            oauth:
              token:
                url: "https://{{ inventory_hostname }}.lxd:7184/api/sts/token"
        web:
          https:
            keystore:
              path: "/etc/xroad/ssl/ds-https.p12"
              type: "PKCS12"
              password: "changeit"
            keymanager:
              password: "changeit"
      xroad:
        dsp:
          participant-context-id: "{{ inventory_hostname }}.lxd"

# ---------------------------------------------------------------------------
# 6. TLS keystore for DS services. Must be on disk before ds-* units start.
#    Also installs xrd-ca into the system trust store so the JVM (xroad-proxy,
#    Quarkus ds-* services) can verify peer certs at first boot.
#
# TEMPORARY (dataspaces dev): remove once packages handle TLS bootstrap via
#   real PKI (replace xrd-ca with federation CA, rotate via PKI lifecycle).
# ---------------------------------------------------------------------------
- include_tasks: ds-https-keystore.yml
