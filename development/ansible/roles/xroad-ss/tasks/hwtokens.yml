---
- name: Configure SoftHSM token for X-Road
  become: true
  when:
    - "'ubuntu_hsm_ss' in group_names"
  block:
    - name: Ensure apt cache is up to date
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install SoftHSM2
      apt:
        name: softhsm2
        state: present

    - name: Ensure 'xroad' user is in 'softhsm' group
      user:
        name: xroad
        append: true
        groups: softhsm

    - name: Check existing SoftHSM slots for token label
      command: softhsm2-util --show-slots
      register: softhsm_slots
      changed_when: false

    - name: Build SoftHSM token search pattern
      ansible.builtin.set_fact:
        _hwtoken_search_pattern: "Label\\s*:\\s*{{ hwtoken_label | regex_escape() }}"

    - name: Initialize SoftHSM token (idempotent if label already present)
      command: >
        softhsm2-util --init-token
        --slot 0
        --label "{{ hwtoken_label }}"
        --so-pin "{{ hwtoken_so_pin }}"
        --pin "{{ hwtoken_user_pin }}"
      when: softhsm_slots.stdout is not search(_hwtoken_search_pattern)
      register: init_result
      changed_when: init_result.rc == 0

    - name: Show token initialization status
      debug:
        msg: >-
          {{ "Token already present; no changes made."
             if softhsm_slots.stdout is search("Label\\s*:\\s*{{ hwtoken_label | regex_escape() }}")
             else "The token has been initialized." }}

    - name: Capture SoftHSM2 slot id for label
      shell: >
        softhsm2-util --show-slots | awk '/^Slot / { slot=$2 } /Label: *{{ hwtoken_label }}/ { print slot }'
      register: softhsm2_slot_id
      changed_when: false

    # The module config lives in the configuration_properties DB override layer
    # (the DSL ignores conf.d yaml); slot-ids keeps softhsm's uninitialized free
    # slot from surfacing as a second hardware token. Deterministic upsert.
    - name: Seed SoftHSM2 signer module into serverconf configuration_properties
      become: true
      command:
        argv:
          - /usr/share/xroad/scripts/db_property.sh
          - set
          - xroad.signer.modules
          - >-
            {"softhsm2":{"library":"/usr/lib/softhsm/libsofthsm2.so","os-locking-ok":true,
            "library-cant-create-os-threads":true,"slot-ids":[{{ softhsm2_slot_id.stdout | trim }}],
            "token-id-format":"1"}}
          - --yes

    - name: Recursively chown tokens to xroad
      become: true
      file:
        path: /var/lib/softhsm/tokens
        state: directory
        owner: xroad
        recurse: true

    - name: Restart signer to resolve the seeded module configuration
      systemd:
        name: xroad-signer
        state: restarted
