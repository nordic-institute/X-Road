---
# The country profile loads at process start; the services must have logged it.
- name: wait for signer and proxy to log the active country profile
  become: true
  command:
    argv:
      - grep
      - -q
      - "Country profile {{ variant | upper }} active"
      - "/var/log/xroad/{{ item }}.log"
  register: country_profile_log
  until: country_profile_log.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  loop:
    - signer
    - proxy
