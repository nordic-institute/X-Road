---
- name: configure remote database
  # can not be used to reconfigure a database
  block:
    - name: install remote database package
      yum:
        name: "xroad-database-remote"
        state: latest

    - name: xroad.properties template
      template:
        src: "xroad.properties"
        dest: "/etc/xroad.properties"
        owner: "root"
        group: "root"
        mode: "0600"
        force: false

    - name: db.properties template
      template:
        src: "db.properties"
        dest: "/etc/xroad/db.properties"
        owner: "xroad"
        group: "xroad"
        mode: "0751"
        force: false

    - name: openbao.env environment file
      template:
        src: "openbao.env.j2"
        dest: "/etc/openbao/openbao.env"
        owner: "openbao"
        group: "openbao"
        mode: "0600"
        force: false
  when: (database_admin_password is defined) and (database_admin_password != "")
  tags:
    - install-xroad-ss-packages

- name: Enable PostgreSQL 15 module (RHEL 9)
  become: true
  command: dnf module enable postgresql:15 -y
  when:
    - ansible_facts['distribution_major_version'] | int == 9
    - not ((database_admin_password is defined) and (database_admin_password != ""))
  tags:
    - install-xroad-ss-packages

- name: Install PostgreSQL packages (RHEL)
  become: true
  dnf:
    name:
      - postgresql-server
      - postgresql-contrib
    state: present
  when:
    - not ((database_admin_password is defined) and (database_admin_password != ""))
  tags:
    - install-xroad-ss-packages

# TEMPORARY (dataspaces dev): installed ahead of the full package set so its local secret store
# (OpenBao) is up before ds-tls-vault-provision.yml writes the DS TLS certificate - the ds-control-
# plane / ds-identity-hub packages (pulled in below) fail fast at boot if that vault slot is empty.
# xroad-secret-store-local is already a transitive dependency of the full package set (via
# xroad-proxy -> xroad-confclient), so installing it explicitly here is a no-op for yum once the
# main install runs; it only changes the order in which it configures.
- name: install xroad-secret-store-local ahead of the rest of the package set
  yum:
    name: xroad-secret-store-local
    state: latest
  tags:
    - install-xroad-ss-packages

- include_tasks: ds-tls-vault-provision.yml
  tags:
    - install-xroad-ss-packages

- name: install xroad packages and dependencies from set up repository
  yum:
    name: "{{ vars['xroad_varpkg_' + variant] }}"
    state: latest
  tags:
    - install-xroad-ss-packages

- name: install opmonitoring
  yum:
    name: xroad-opmonitor
    state: latest
  when:
    - (xroad_install_opmonitoring is defined) and (xroad_install_opmonitoring)
  tags:
    - install-xroad-ss-packages

- name: add xroad admin user
  command: "xroad-add-admin-user {{ xroad_ui_user }}"
  tags:
    - install-xroad-ss-packages

- name: start xroad-proxy (RHEL)
  service:
    name: xroad-proxy
    state: started
  tags:
    - install-xroad-ss-packages