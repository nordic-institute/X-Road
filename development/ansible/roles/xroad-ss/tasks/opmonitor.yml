---
# Operational-monitoring enablement for dev stacks (gated on
# xroad_install_opmonitoring at the include site). xroad-opmonitor is not part
# of the xroad-securityserver meta-package or the product installer's package
# set, and the proxy-side addon defaults to disabled
# (xroad.proxy.addon.op-monitor.enabled=false in ProxyProperties) — compose
# enables the equivalent via XROAD_PROXY_ADDON_OP_MONITOR_ENABLED=true plus
# RECORDS_AVAILABLE_TIMESTAMP_OFFSET_SECONDS=1 so freshly logged records are
# queryable within the e2e settle window.
- name: install xroad-opmonitor
  package:
    name: xroad-opmonitor
    state: present

# The op-monitor timestamp offset is stored in configuration_properties.
# The local daemon on this Security Server gets this setting from the database.
- name: seed op-monitor addon config
  become: true
  command:
    argv:
      - /usr/share/xroad/scripts/db_property.sh
      - set
      - xroad.op-monitor.records-available-timestamp-offset-seconds
      - "1"
      - --yes
  notify: restart xroad-proxy

# The three op-monitor channel rows hold the values the Security Server uses when no row exists.
# The dev environment seeds them on xrd-ss1 so the LXD e2e tests start from stored rows.
- name: seed op-monitor channel rows
  become: true
  when: inventory_hostname == 'xrd-ss1'
  command:
    argv:
      - /usr/share/xroad/scripts/db_property.sh
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
      - --yes
  loop:
    - { key: xroad.common-rpc.channel.op-monitor.host, value: "127.0.0.1" }
    - { key: xroad.common-rpc.channel.op-monitor.port, value: "2081" }
    - { key: xroad.common-rpc.channel.op-monitor.deadline-after, value: "60000" }
  notify: restart xroad-proxy

# deb postinst auto-starts the daemon on Ubuntu; the RHEL package does not.
- name: ensure xroad-opmonitor is enabled and running
  systemd:
    name: xroad-opmonitor
    state: started
    enabled: true
