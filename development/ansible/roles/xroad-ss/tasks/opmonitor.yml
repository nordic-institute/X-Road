---
# Operational-monitoring enablement for dev stacks (gated on
# xroad_install_opmonitoring at the include site). xroad-opmonitor is not part
# of the xroad-securityserver meta-package or the product installer's package
# set, and the proxy-side addon defaults to disabled
# (xroad.proxy.addon.op-monitor.enabled=false in ProxyProperties) — compose
# enables the equivalent via XROAD_PROXY_ADDON_OP_MONITOR_ENABLED=true plus
# RECORDS_AVAILABLE_TIMESTAMP_OFFSET_SECONDS=1 so freshly logged records are
# queryable within the e2e settle window.
- name: install xroad-opmonitor
  package:
    name: xroad-opmonitor
    state: present

# The proxy-side addon flag lives in the shared "proxy:" block owned by msglog-encryption.yml
# (single-owner rule for top-level local.yaml keys), gated on the same xroad_install_opmonitoring.
- name: preseed op-monitor addon config into local.yaml
  blockinfile:
    path: /etc/xroad/conf.d/local.yaml
    insertafter: '^xroad:'
    marker: "  # {mark} OP-MONITOR ADDON (lxd dev preseed)"
    block: "  op-monitor:\n    records-available-timestamp-offset-seconds: 1"
  notify: restart xroad-proxy

# deb postinst auto-starts the daemon on Ubuntu; the RHEL package does not.
- name: ensure xroad-opmonitor is enabled and running
  systemd:
    name: xroad-opmonitor
    state: started
    enabled: true
