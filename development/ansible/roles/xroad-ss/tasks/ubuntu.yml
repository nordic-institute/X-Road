---
- name: configure remote database
  block:
    - name: install remote database package
      apt:
        name: "xroad-database-remote"
        state: latest

    - name: xroad.properties template
      template:
        src: "xroad.properties"
        dest: "/etc/xroad.properties"
        owner: "root"
        group: "root"
        mode: "0600"
        force: false

  when: (database_admin_password is defined) and (database_admin_password != "")
  tags:
    - install-xroad-ss-packages

- name: debconf xroad-proxy
  debconf:
    name: xroad-proxy
    question: "{{ item.question }}"
    vtype: "string" # parametrize if you add a different type of question to item list
    value: "{{ item.value }}"
  loop:
    - { question: "xroad-common/username", value: "{{ xroad_ui_user }}" }
    - { question: "xroad-common/database-host", value: "{{ database_host }}" }
    - { question: "xroad-common/proxy-memory", value: "d" }
    - { question: "xroad-common/service-subject", value: "{{ inventory_hostname }}.lxd" }
    - { question: "xroad-common/service-altsubject", value: "IP:{{ ansible_facts['default_ipv4']['address'] }},DNS:{{ inventory_hostname }}.lxd,DNS:{{ inventory_hostname }}" }
  tags:
    - install-xroad-ss-packages

# TEMPORARY (dataspaces dev): installed ahead of the full package set so its local secret store
# (OpenBao) is up before ds-tls-vault-provision.yml writes the DS TLS certificate - the ds-control-
# plane / ds-identity-hub packages (pulled in below) fail fast at boot if that vault slot is empty.
# xroad-secret-store-local is already a transitive dependency of the full package set (via
# xroad-proxy -> xroad-confclient), so installing it explicitly here is a no-op for apt once the
# main install runs; it only changes the order in which it configures.
- name: install xroad-secret-store-local ahead of the rest of the package set
  apt:
    name: xroad-secret-store-local
    state: latest
  tags:
    - install-xroad-ss-packages

- include_tasks: ds-tls-vault-provision.yml
  tags:
    - install-xroad-ss-packages

- name: install xroad security server packages
  apt:
    name: "{{ vars['xroad_varpkg_' + variant] }}"
    state: latest
    force: true
  tags:
    - install-xroad-ss-packages

- name: install op-monitoring
  package: name=xroad-opmonitor state=latest
  when: (xroad_install_opmonitoring is defined) and (xroad_install_opmonitoring)
