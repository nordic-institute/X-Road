---
- include_tasks: ubuntu.yml
  when: ansible_facts['os_family'] == "Debian"

- include_tasks: rhel.yml
  when: ansible_facts['os_family'] == "RedHat"

# configuration tweaks
- name: enable health check
  ini_file:
    path: /etc/xroad/conf.d/local.ini
    section: proxy
    option: health-check-port
    value: "{{ xroad_proxy_health_check_port }}"
  when: xroad_proxy_health_check_port is defined

- name: delete archived files
  ini_file:
    path: /etc/xroad/conf.d/local.ini
    section: "message-log"
    option: "archive-transfer-command"
    value: "rm -f /var/lib/xroad/mlog*.zip"
  when: (xroad_delete_archive_files is defined) and (xroad_delete_archive_files)

- name: set message log retention
  ini_file:
    path: /etc/xroad/conf.d/local.ini
    section: "message-log"
    option: "keep-records-for"
    value: "{{ xroad_message_log_keep_records_for }}"
  when: xroad_message_log_keep_records_for is defined

- name: globalconf download interval
  ini_file:
    path: /etc/xroad/conf.d/local.ini
    section: "configuration-client"
    option: "update-interval"
    value: "{{ xroad_configuration_update_interval }}"
  when: xroad_configuration_update_interval is defined

# DSP mock JWKS server for ds-control-plane JWT validation in LXD
- name: create JWKS directory
  file:
    path: /opt/jwks
    state: directory
    mode: "0755"

- name: deploy JWKS public key
  copy:
    dest: /opt/jwks/jwks.json
    mode: "0644"
    content: |
      {"keys":[{"alg":"RS256","e":"AQAB","key_ops":["verify"],"kty":"RSA","n":"0AFuyFQDzQVhSexmhVgpkjcgaXxf4bQBAoHaTejarJe2DKeenr7NtiS2qzHTK7HC7ngDXrqbPtfBXZIXoep6XJq_RBvp-lbf1ZVsJWYyNbJRH_ydYhEyipb7CHxIGU0o5oilt2810ltHViG1-MKITnOuPVBlkER3NdRKDmkufgalksL7RRekuW9pIxCE1f8Hj-tAKSdFw8P1k8FJ9tmFYAk0Ev40zYtfLmvjdeNeuuZp_JDAFONV8Yi6LLpjccldSYvXh8lgHy1SwUFatchoyWqZNId6Ke705_F9BcZ4Dr3437j4Zk5uNMHNc2rDbxPehPjGj4ON_ySTRBKyql4Yiw","use":"sig","kid":"74f3422b37fc8688e7f5a741627f8889"}]}

- name: create mock JWKS server systemd service
  copy:
    dest: /etc/systemd/system/mock-jwks-server.service
    mode: "0644"
    content: |
      [Unit]
      Description=Mock JWKS Server for ds-control-plane
      Before=xroad-ds-control-plane.service

      [Service]
      Type=simple
      WorkingDirectory=/opt/jwks
      ExecStart=/usr/bin/python3 -m http.server 8099 --bind 127.0.0.1
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

- name: enable and start mock JWKS server
  systemd:
    name: mock-jwks-server
    state: started
    enabled: yes
    daemon_reload: yes

- name: create ds-control-plane systemd override directory
  file:
    path: /etc/systemd/system/xroad-ds-control-plane.service.d
    state: directory
    mode: "0755"

- name: configure ds-control-plane JWKS URL for LXD
  copy:
    dest: /etc/systemd/system/xroad-ds-control-plane.service.d/jwks.conf
    mode: "0644"
    content: |
      [Service]
      Environment=EDC_IAM_OAUTH2_JWKS_URL=http://localhost:8099/jwks.json

- name: restart ds-control-plane to pick up JWKS config
  systemd:
    name: xroad-ds-control-plane
    state: restarted
    daemon_reload: yes

# DSP control plane configuration for LXD environment
# Written to a separate file to avoid duplicate YAML root key in local.yaml
- name: configure DSP control plane URLs for LXD
  copy:
    dest: /etc/xroad/conf.d/local-dsp.yaml
    owner: xroad
    group: xroad
    mode: "0640"
    content: |
      xroad:
        proxy:
          dsp:
            control-plane-url: "http://localhost:8182"
            counter-party-address: "http://{{ (inventory_hostname == 'xrd-ss0') | ternary('xrd-ss1', 'xrd-ss0') }}:8183/api/dsp"
