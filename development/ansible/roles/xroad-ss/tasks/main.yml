---
- include_tasks: ubuntu.yml
  when: ansible_facts['os_family'] == "Debian"

- include_tasks: rhel.yml
  when: ansible_facts['os_family'] == "RedHat"

- include_role:
    name: xroad-base
    tasks_from: postgres_remote_dev.yml
  when: enable_postgres_remote_access | default(false) | bool

- name: enable proxy health check
  command: >-
    /usr/share/xroad/scripts/db_property.sh set
    {{ item.key }} "{{ item.value }}"
    proxy --yes
  loop:
    - { key: "xroad.proxy.health-check-port", value: "{{ xroad_proxy_health_check_port }}" }
    - { key: "xroad.proxy.health-check-enabled", value: "true" }
  when: xroad_proxy_health_check_port is defined
  changed_when: true
  notify: restart xroad-proxy

# archiver is a CLI invoked from cron — picks up new values on next run, no restart needed.
- name: delete archived files
  command: >-
    /usr/share/xroad/scripts/db_property.sh set
    xroad.message-log-archiver.archive-transfer-command
    "rm -f /var/lib/xroad/mlog*.zip"
    message-log-archiver --yes
  when: (xroad_delete_archive_files is defined) and (xroad_delete_archive_files)
  changed_when: true

- name: set message log retention
  command: >-
    /usr/share/xroad/scripts/db_property.sh set
    xroad.message-log-archiver.clean-keep-records-for
    "{{ xroad_message_log_keep_records_for }}"
    message-log-archiver --yes
  when: xroad_message_log_keep_records_for is defined
  changed_when: true

- name: globalconf download interval
  command: >-
    /usr/share/xroad/scripts/db_property.sh set
    xroad.configuration-client.update-interval
    "{{ xroad_configuration_update_interval }}"
    configuration-client --yes
  when: xroad_configuration_update_interval is defined
  changed_when: true
  notify: restart xroad-confclient
