# Dev-only DS-HTTPS keystore provisioner. NOT production-ready — a stop-gap
# (self-signed, file-based keystore) pending ACME-based certificate issuance
# from the secret store.

dsHttpsKeystore:
  image: eclipse-temurin:21-jre-alpine
  secretName: ds-https-keystore
  commonName: xrd-ds
  keystorePassword: changeit
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    name: ds-https-keystore-init-sa
  # Extra DNS SANs for the self-signed cert, on top of `commonName`. Defaults
  # mirror compose.aux.yaml's ds-https-keystore-init SAN list, substituted
  # with the k8s in-cluster DNS names the central-server / security-server
  # charts produce. ss0/ss1 are the actual namespace names the two Security
  # Server chart releases are deployed into.
  # Every name that is reached across a namespace boundary needs its qualified
  # form here as well as its bare one: a namespace-qualified host is only half
  # the job when the connection is TLS, since the peer still verifies the name
  # against the SAN list. did:web resolution of the Central Server's co-located
  # Issuer Service goes to `central-server.cs`, and without that entry the
  # identity hubs fail with SSLPeerUnverifiedException and no participant ever
  # gets a credential.
  extraSanDnsNames:
    - central-server
    - central-server.cs
    - ds-issuer-service
    - ds-issuer-service.cs
    - ds-identity-hub
    - ds-control-plane
    - ds-identity-hub.ss0
    - ds-identity-hub.ss1
    - ds-control-plane.ss0
    - ds-control-plane.ss1
    - ds-issuer-service.ss0
    - ds-issuer-service.ss1
    - xrd-ss0
    - xrd-ss1
    - localhost
