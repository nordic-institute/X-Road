apiVersion: v2
name: ds-https-keystore
description: >-
  Dev-only DS-HTTPS keystore provisioner. Generates a self-signed SAN cert +
  PKCS12 keystore and publishes it as the `ds-https-keystore` Secret consumed
  by the co-located Central Server Issuer Service and (when DSP is enabled) the
  Security Server ds_tls mode. Deployed early — before the Central Server and
  Security Server charts — because those consume the keystore at boot. Explicit
  stop-gap (file-based keystore until ACME-from-OpenBao lands).
type: application
version: 0.1.0
appVersion: "0.1.0"
annotations:
  xroad.niis.org/production-ready: "false"
