---
- name: Deploy X-Road Security Server stack
  hosts: k8s_control
  gather_facts: true
  pre_tasks:
    - name: Assert required vars present
      ansible.builtin.assert:
        that:
          - kubeconfig_path is defined
          - security_server_namespace is defined
          - cluster_provider is defined
        fail_msg: "Inventory group_vars missing required variables"

    - name: Ensure state directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../.state"
        state: directory
        mode: "0755"

  tasks:
    - name: Provision KinD cluster
      ansible.builtin.include_role:
        name: kind_cluster
      vars:
        kind_state_dir: "{{ playbook_dir }}/../.state"
      when: cluster_provider == 'kind'

    - name: Install CloudNativePG operator
      ansible.builtin.include_role:
        name: cloudnative_pg

    - name: Deploy OpenBao (TLS + postgres + openbao + init)
      ansible.builtin.include_role:
        name: openbao

    - name: Deploy external service bridges
      ansible.builtin.include_role:
        name: external_service_bridge
      vars:
        bridge_name: "{{ item.name }}"
        bridge_external_host: "{{ item.external_host }}"
        bridge_ports: "{{ item.ports }}"
      loop: "{{ external_service_bridges | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy Security Server
      ansible.builtin.include_role:
        name: security_server

    - name: Register ss2 host-record in LXD dnsmasq (mac + lima only)
      ansible.builtin.command:
        cmd: >-
          limactl shell {{ lxd_lima_instance }} --
          sudo lxc network set lxdbr0
          raw.dnsmasq host-record={{ ss2_advertised_host }},{{ ss2_advertised_ip }}
      register: ss2_dns_record
      changed_when: ss2_dns_record.rc == 0
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - ss2_advertised_host is defined

    # `lxc network set` makes LXD regenerate the in.lxdbr0 nftables chain,
    # wiping the xroad-mac-direct DNS accept rules — without them the mac
    # loses all *.lxd resolution. setup-mac-net.sh re-inserts idempotently.
    - name: Re-apply mac->LXD network exceptions after dnsmasq change
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../../native-lxd-stack/scripts/setup-mac-net.sh"
      register: mac_net_reapply
      changed_when: "'inserting nft accept rules' in mac_net_reapply.stdout"
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - ss2_advertised_host is defined

    - name: Deploy Prometheus (when enabled)
      ansible.builtin.include_role:
        name: prometheus
      when: deploy_prometheus | default(false) | bool

    - name: Deploy Netdata (when enabled)
      ansible.builtin.include_role:
        name: netdata
      when: deploy_netdata | default(true) | bool
