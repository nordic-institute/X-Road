---
- name: Tear down X-Road Security Server stack
  hosts: k8s_control
  gather_facts: true
  vars:
    keep_cluster: false
  tasks:
    - name: Tear down each Security Server instance (release + namespace-scoped OpenBao/CNPG)
      ansible.builtin.include_tasks: teardown_ss_instance.yml
      loop: "{{ security_server_instances | default([{'namespace': security_server_namespace}]) }}"
      loop_control:
        loop_var: ss_instance
        label: "{{ ss_instance.namespace }}"

    - name: Uninstall external-service-bridge helm releases
      kubernetes.core.helm:
        name: "xroad-bridge-{{ item.name }}"
        release_namespace: "{{ security_server_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
      loop: "{{ external_service_bridges | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      ignore_errors: true

    - name: Uninstall Central Server helm release + namespace (when enabled)
      when: central_server_enabled | default(false) | bool
      block:
        - name: Uninstall central-server helm release
          kubernetes.core.helm:
            name: central-server
            release_namespace: "{{ central_server_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
            state: absent
          ignore_errors: true

    - name: Uninstall e2e-fixtures helm release (when enabled)
      kubernetes.core.helm:
        name: e2e-fixtures
        release_namespace: "{{ e2e_fixtures_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
      when: e2e_fixtures_enabled | default(false) | bool
      ignore_errors: true

    # central_server/e2e_fixtures share one namespace (see those roles' defaults) — delete once,
    # after both releases in it are gone.
    - name: Delete Central Server / e2e-fixtures namespace (when either enabled)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: "{{ central_server_namespace | default(e2e_fixtures_namespace) }}"
        state: absent
        wait: true
      when: (central_server_enabled | default(false) | bool) or (e2e_fixtures_enabled | default(false) | bool)
      ignore_errors: true

    - name: Uninstall prometheus helm release
      kubernetes.core.helm:
        name: prometheus
        release_namespace: "{{ monitoring_namespace | default('ss-monitoring') }}"
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
      when: deploy_prometheus | default(false) | bool
      ignore_errors: true

    - name: Delete monitoring namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: "{{ monitoring_namespace | default('ss-monitoring') }}"
        state: absent
        wait: true
      ignore_errors: true

    - name: List existing kind clusters
      ansible.builtin.command: kind get clusters -q
      register: kind_clusters
      changed_when: false
      check_mode: false
      when: cluster_provider | default('kind') == 'kind'
      failed_when: kind_clusters.rc not in [0, 1]

    - name: Delete kind cluster
      ansible.builtin.command: "kind delete cluster --name {{ kind_cluster_name }}"
      when:
        - cluster_provider | default('kind') == 'kind'
        - not (keep_cluster | bool)
        - kind_cluster_name in (kind_clusters.stdout_lines | default([]))
      changed_when: true
