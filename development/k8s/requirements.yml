  # HEAD SHA for reproducible installs instead of tracking `main`. Bump only
  # after validating a newer revision.
  # TODO: switch to `version: ">=6.4.0,<7.0.0"` once 6.4.0 lands on Galaxy.
  - name: kubernetes.core
    source: https://github.com/ansible-collections/kubernetes.core.git
    type: git
    version: 11f619b69e11194492e4009bf0f668986ab8de46
  - name: community.crypto
    version: ">=3.0.0,<4.0.0"
  - name: ansible.posix
    version: ">=2.0.0,<3.0.0"
  - name: community.general
    version: ">=10.0.0,<13.0.0"
