---
security_server_namespace: ss
kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"

postgres_image: "ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie"
openbao_db:
  name: db-openbao
  database: openbao
  username: openbao
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi

openbao_chart_repo: "https://openbao.github.io/openbao-helm"
openbao_chart: "openbao/openbao"
openbao_chart_version: "0.25.6"

openbao_init_chart_repo: ""
openbao_init_chart: "{{ playbook_dir }}/../../../deployment/security-server/k8s/charts/openbao-init"
openbao_init_chart_version: ""

openbao_ha_replicas: 2

# self_signed writes a P384 ECDSA cert + k8s Secret. cert_manager delegates
# to cert-manager CRs (used on EKS; see docs/EKS.md).
openbao_tls_mode: self_signed
openbao_tls_secret_name: openbao-server-tls
openbao_tls_dir: "{{ playbook_dir }}/../.state/openbao-tls"
openbao_tls_validity_days: 1825

openbao_helm_wait_timeout: 10m

# Recipient PGP public keyring for messagelog archive encryption, seeded by a
# one-shot Job into this instance's OpenBao at
# xrd-secret/message-log/archival/pgp/public-keys (KV v1, field "payload" —
# see lib/vault-core VaultClient.MLOG_ARCHIVAL_PGP_PUBLIC_KEYS_PATH). A file
# path, read from disk at play time — same "read the real file, inject at render time"
# pattern as the e2e_fixtures role's hurl_setup_file/isrest_mapping_files.
# Empty by default: no seed Job/ConfigMap is created, matching dev/eks
# behavior. Only the recipient *public* keyring needs seeding — the archive
# signing key and the messagelog DB master key are both generated
# unconditionally at Security Server init and already live in openbao. Set
# per Security Server release (e.g. e2e's ss1 only, mirroring compose and the
# LXD role's xrd-ss1-only import).
messagelog_encryption_pgp_public_keyring_file: ""

# Image for the pgp-keyring-vault-seed Job.
openbao_pgp_keyring_vault_seed_image: "dwdraju/alpine-curl-jq"
openbao_pgp_keyring_vault_seed_backoff_limit: 3
openbao_pgp_keyring_wait_retries: 30
openbao_pgp_keyring_wait_delay: 5
