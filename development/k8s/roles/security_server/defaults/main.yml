---
security_server_namespace: ss
kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"

postgres_image: "ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie"

security_server_chart_repo: ""
security_server_chart: "{{ playbook_dir }}/../../../deployment/security-server/k8s/charts/security-server"
security_server_chart_version: ""

xroad_image_registry: ""
xroad_image_tag: ""
serverconf_init_image: ""

jvm_metrics_enabled: false

security_server_wait_retries: 60
security_server_wait_delay: 10

openbao_tls_secret_name: openbao-server-tls

configuration_client_update_interval: "10"

# op-monitor's records-available-timestamp-offset-seconds (chart/image default: 60s) delays how
# soon a freshly-logged request is visible to getSecurityServerOperationalData — fine for
# production, too slow for a test that queries within seconds of the request. Empty by default
# (chart/image default of 60s stands, e.g. for dev/eks); set per-inventory (e.g. e2e) to shorten it.
op_monitor_records_available_offset_seconds: ""

# The proxy batches timestamping on its own ~60s cadence by default
# (xroad.proxy.message-log.timestamper.timestamp-immediately). LogArchiver only picks up records
# that already have a timestamp record, so an archive triggered right after a traffic burst can
# silently miss the last wave. Off by default (chart/image default stands); e2e needs archiving
# to see every record it just logged, so it turns this on.
proxy_timestamp_immediately: false

# Cadence at which the proxy (and every other service holding a GlobalConfProvider) reloads the
# global configuration it already has on disk (xroad.common-global-conf.refresh-rate, chart/image
# default 60s). Empty by default; e2e shortens it so a Security Server notices newly-registered
# members/services without waiting out the full default interval.
common_global_conf_refresh_rate: ""

# xroad.proxy.batch-signing-enabled, off by default. e2e turns it on for parity with the compose
# lane's e2e fixture; message flow scenarios are indifferent to which signing mode produced the
# signature.
proxy_batch_signing_enabled: false

# xroad.message-log.archiver.clean-keep-records-for (days), @WithDefault("30") — LogCleaner only
# deletes records older than this. Empty by default (chart/image default of 30 days stands); e2e
# sets it to "0" so a record is cleanup-eligible immediately after archiving, which is what
# SsMessagelogArchiveTest's "0 records left in DB" assertions require.
messagelog_archiver_clean_keep_records_for: ""

# auxiliary-service schedules messagelog archival every 6h and cleanup every 12h
# (xroad.auxiliary-service.message-log.archive-cron / clean-cron), invoking the containerised
# profile's message_log_archiver.sh — the same script a test triggers on demand. A scheduled run
# firing mid-test would archive or clean records the test is asserting on. Empty by default
# (chart/image schedule stands); set per-inventory to a value Quarkus reads as off ("off",
# "disabled") where a test owns the triggering.
messagelog_archive_cron: ""
messagelog_clean_cron: ""

# Messagelog DB + archive encryption, mirroring compose's
# msglog_encryption_config/application.yaml mount (issue 16) and the LXD
# role's msglog-encryption.yml — the raw "xroad: message-log-encryption: ..."
# YAML document projected into the proxy and message-log-archiver containers
# (security-server chart's messageLogEncryption.applicationYaml). Empty by
# default: the chart renders no ConfigMap and no extra mount, matching
# chart/image behavior unchanged. Set per-release (e.g. e2e's ss1) to the
# fixture's exact block. Deliberately excludes any auxiliary-service
# archive-cron/clean-cron key — those stay parked off by
# messagelog_archive_cron/messagelog_clean_cron above; re-adding one here
# would re-arm a scheduled run that races the test.
messagelog_encryption_config: ""

proxy_dsp_enabled: true

# Per-release signer-HSM stop-gap toggle (chart's signer.hsm.enabled — see
# security-server chart values.yaml). Off by default: the chart's plain
# signer image renders unchanged. Set true for a single Security Server
# release (e.g. e2e's ss1) that needs a pkcs11 HARDWARE token.
signer_hsm_enabled: false

trusted_issuer_host: xrd-cs
xrd_ca_external_host: xrd-ca.lxd

# Per-release DSP participant-context-id override (chart's dsp.participantContextId — see
# security-server chart values.yaml). Empty by default: the chart's own hardcoded "xrd-ss2" env
# entries render unchanged. Set per Security Server release (e.g. one value per ss0/ss1 in a
# multi-SS topology) to give each release a distinct identifier instead of conflating them.
dsp_participant_context_id: ""

serverconf_db:
  name: db-serverconf
  database: serverconf
  username: serverconf
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi
messagelog_db:
  name: db-messagelog
  database: messagelog
  username: messagelog
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi
opmonitor_db:
  name: db-opmonitor
  database: op-monitor
  username: opmonitor
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi

# DSP-scoped databases — provisioned by the CNPG role alongside
# serverconf/messagelog/opmonitor. The chart consumes the app-user Secret
# (`db-<name>` with key `password`) and the bare Service DNS published by
# the CNPG role's ExternalName alias.
ds_control_plane_db:
  name: db-ds-control-plane
  database: ds-control-plane
  username: ds_control_plane
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi
ds_identity_hub_db:
  name: db-ds-identity-hub
  database: ds-identity-hub
  username: ds_identity_hub
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi
ds_issuer_service_db:
  name: db-ds-issuer-service
  database: ds-issuer-service
  username: ds_issuer_service
  password: secret
  postgres_password: admin_secret
  storage_size: 1Gi
