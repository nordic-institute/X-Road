---
# Provision TLS material for k8s-hosted ds-* services, anchored in the same
# xrd-ca test CA the LXD stack uses (see ansible/roles/xroad-cs/tasks/
# ds-https-keystore.yml). One trust root across both environments lets the
# LXD control planes verify ss2's DID/credential/DSP endpoints and vice
# versa. Generated on the control host, shipped into the cluster as the
# `ds-https-keystore` Secret.
#
# GAP (same root cause as the docker e2e / lxd-e2e fix in XRDDEV-3293): nothing
# here registers xrd-ca (or ds-https-ca.pem) in globalconf's approvedDsTlsCa,
# so ss2's fail-closed outbound DS TLS trust has no CA to trust and rejects
# ds-*-to-ds-* HTTPS the same way. Left unfixed deliberately — provisioning
# approvedDsTlsCa for the k8s env is issue 08's scope (XRDDEV-3294), which owns
# the k8s ds-* environment wiring end to end.

- name: Set ds-https working directory fact
  ansible.builtin.set_fact:
    ds_https_dir: "{{ k8s_state_dir | default(playbook_dir + '/../.state') }}/ds-https"

- name: Ensure ds-https working directory exists
  ansible.builtin.file:
    path: "{{ ds_https_dir }}"
    state: directory
    mode: "0700"

- name: Fetch the current xrd-ca root (waits for the signing endpoint)
  ansible.builtin.uri:
    url: "http://{{ xrd_ca_external_host }}:8888/testca/certs/ca.cert.pem"
    return_content: true
    status_code: 200
  register: k8s_xrdca_ready
  retries: 30
  delay: 2
  until: k8s_xrdca_ready.status == 200

- name: Cache the current xrd-ca root for signing + comparison
  ansible.builtin.copy:
    content: "{{ k8s_xrdca_ready.content }}"
    dest: "{{ ds_https_dir }}/xrd-ca-live.pem"
    mode: "0644"

- name: Fingerprint the current xrd-ca root
  community.crypto.x509_certificate_info:
    path: "{{ ds_https_dir }}/xrd-ca-live.pem"
  register: ds_https_live_ca

- name: Stat the previously issued ds-https trust anchor
  ansible.builtin.stat:
    path: "{{ ds_https_dir }}/ds-https-ca.pem"
  register: ds_https_cached_ca_stat

- name: Fingerprint the previously issued trust anchor
  community.crypto.x509_certificate_info:
    path: "{{ ds_https_dir }}/ds-https-ca.pem"
  register: ds_https_cached_ca
  when: ds_https_cached_ca_stat.stat.exists

# Re-issue when nothing is cached or the xrd-ca root rotated (e.g. the LXD
# stack was recreated). A plain "file exists" guard keeps serving a cert
# anchored to a dead CA that peers no longer trust (PKIX chain failure).
- name: Decide whether to re-issue ds-https material
  ansible.builtin.set_fact:
    ds_https_regenerate: >-
      {{ (not ds_https_cached_ca_stat.stat.exists)
         or (ds_https_cached_ca.fingerprints['sha256'] | default('')
             != ds_https_live_ca.fingerprints['sha256']) }}

# SANs: the LXD-facing advertised name plus the in-cluster service names the
# proxy and sibling ds-* services dial over https.
- name: Provision ds-https keystore + truststore from xrd-ca
  ansible.builtin.shell: |
    set -euo pipefail
    cd "$WORKDIR"
    openssl genrsa -out ds-https-key.pem 2048
    openssl req -new -key ds-https-key.pem -out ds-https-auth.csr \
      -subj "/CN=${ADVERTISED_HOST}" \
      -addext "subjectAltName=DNS:${ADVERTISED_HOST},DNS:ds-control-plane,DNS:ds-identity-hub,DNS:ds-issuer-service,DNS:localhost"
    curl -fsS -X POST -F "type=auth" -F "certreq=@ds-https-auth.csr" \
      "http://${CA_HOST}:8888/testca/sign" -o ds-https-cert.pem
    cp xrd-ca-live.pem ds-https-ca.pem
    openssl pkcs12 -export -out ds-https.p12 \
      -inkey ds-https-key.pem -in ds-https-cert.pem -certfile ds-https-ca.pem \
      -name ds-https -password pass:changeit
    # -jdktrust marks the cert with jdkTrustedKeyUsage — without it the JVM
    # loads the PKCS12 truststore as 0 entries (OpenSSL >= 3.2 required).
    openssl pkcs12 -export -out cacerts.p12 \
      -nokeys -in ds-https-ca.pem -name xrd-ca \
      -jdktrust anyExtendedKeyUsage -password pass:changeit
    chmod 0600 ds-https-key.pem ds-https.p12 cacerts.p12
    base64 -i ds-https.p12 | tr -d '\n' > ds-https.p12.b64
    base64 -i cacerts.p12 | tr -d '\n' > cacerts.p12.b64
    : > ds-https-auth.csr
  args:
    executable: /bin/bash
  environment:
    WORKDIR: "{{ ds_https_dir }}"
    ADVERTISED_HOST: "{{ ss2_advertised_host }}"
    CA_HOST: "{{ xrd_ca_external_host }}"
  when: ds_https_regenerate | bool

- name: Publish ds-https-keystore Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ds-https-keystore
        namespace: "{{ security_server_namespace }}"
      type: Opaque
      data:
        ds-https.p12: "{{ lookup('file', ds_https_dir + '/ds-https.p12.b64') }}"
        cacerts.p12: "{{ lookup('file', ds_https_dir + '/cacerts.p12.b64') }}"
        ca.pem: "{{ lookup('file', ds_https_dir + '/ds-https-ca.pem') | b64encode }}"

# On a fresh install the ds-* Deployments don't exist yet (the chart installs
# just after this file) and mount the Secret on first start, so a failed
# restart is expected and ignored. On a re-run against a live cluster this
# reloads the rotated cert into the running pods.
- name: Restart ds-* deployments when ds-https material was re-issued
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }}
    -n {{ security_server_namespace }}
    rollout restart deployment ds-control-plane ds-identity-hub ds-issuer-service
  register: ds_https_rollout
  changed_when: ds_https_rollout.rc == 0
  failed_when: false
  when: ds_https_regenerate | bool
