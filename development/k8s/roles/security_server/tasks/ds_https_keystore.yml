---
# Provision TLS material for k8s-hosted ds-* services, anchored in the same
# xrd-ca test CA the LXD stack uses (see ansible/roles/xroad-cs/tasks/
# ds-https-keystore.yml). One trust root across both environments lets the
# LXD control planes verify ss2's DID/credential/DSP endpoints and vice
# versa. Generated on the control host, shipped into the cluster as the
# `ds-https-keystore` Secret.

- name: Set ds-https working directory fact
  ansible.builtin.set_fact:
    ds_https_dir: "{{ k8s_state_dir | default(playbook_dir + '/../.state') }}/ds-https"

- name: Ensure ds-https working directory exists
  ansible.builtin.file:
    path: "{{ ds_https_dir }}"
    state: directory
    mode: "0700"

- name: Stat existing ds-https keystore
  ansible.builtin.stat:
    path: "{{ ds_https_dir }}/ds-https.p12"
  register: k8s_ds_https_stat

- name: Wait for xrd-ca signing endpoint
  ansible.builtin.uri:
    url: "http://{{ xrd_ca_external_host }}:8888/testca/certs/ca.cert.pem"
    status_code: 200
  register: k8s_xrdca_ready
  retries: 30
  delay: 2
  until: k8s_xrdca_ready.status == 200
  when: not k8s_ds_https_stat.stat.exists

# SANs: the LXD-facing advertised name plus the in-cluster service names the
# proxy and sibling ds-* services dial over https.
- name: Provision ds-https keystore + truststore from xrd-ca
  ansible.builtin.shell: |
    set -euo pipefail
    cd "$WORKDIR"
    openssl genrsa -out ds-https-key.pem 2048
    openssl req -new -key ds-https-key.pem -out ds-https-auth.csr \
      -subj "/CN=${ADVERTISED_HOST}" \
      -addext "subjectAltName=DNS:${ADVERTISED_HOST},DNS:ds-control-plane,DNS:ds-identity-hub,DNS:ds-issuer-service,DNS:localhost"
    curl -fsS -X POST -F "type=auth" -F "certreq=@ds-https-auth.csr" \
      "http://${CA_HOST}:8888/testca/sign" -o ds-https-cert.pem
    curl -fsS "http://${CA_HOST}:8888/testca/certs/ca.cert.pem" -o ds-https-ca.pem
    openssl pkcs12 -export -out ds-https.p12 \
      -inkey ds-https-key.pem -in ds-https-cert.pem -certfile ds-https-ca.pem \
      -name ds-https -password pass:changeit
    # -jdktrust marks the cert with jdkTrustedKeyUsage — without it the JVM
    # loads the PKCS12 truststore as 0 entries (OpenSSL >= 3.2 required).
    openssl pkcs12 -export -out cacerts.p12 \
      -nokeys -in ds-https-ca.pem -name xrd-ca \
      -jdktrust anyExtendedKeyUsage -password pass:changeit
    chmod 0600 ds-https-key.pem ds-https.p12 cacerts.p12
    base64 -i ds-https.p12 | tr -d '\n' > ds-https.p12.b64
    base64 -i cacerts.p12 | tr -d '\n' > cacerts.p12.b64
    : > ds-https-auth.csr
  args:
    executable: /bin/bash
  environment:
    WORKDIR: "{{ ds_https_dir }}"
    ADVERTISED_HOST: "{{ ss2_advertised_host }}"
    CA_HOST: "{{ xrd_ca_external_host }}"
  when: not k8s_ds_https_stat.stat.exists

- name: Publish ds-https-keystore Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ds-https-keystore
        namespace: "{{ security_server_namespace }}"
      type: Opaque
      data:
        ds-https.p12: "{{ lookup('file', ds_https_dir + '/ds-https.p12.b64') }}"
        cacerts.p12: "{{ lookup('file', ds_https_dir + '/cacerts.p12.b64') }}"
        ca.pem: "{{ lookup('file', ds_https_dir + '/ds-https-ca.pem') | b64encode }}"
