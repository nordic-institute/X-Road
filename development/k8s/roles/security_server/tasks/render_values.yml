---
# Renders the Security Server Helm values with the role's own template search
# path and variable precedence (role defaults + inventory group_vars + any
# vars passed to this include), but writes to a local file instead of calling
# `kubernetes.core.helm` — no cluster required. Used by playbooks/render_check.yml.
- name: Render Security Server Helm values (no cluster required)
  ansible.builtin.template:
    src: security-server-values.yaml.j2
    dest: "{{ render_values_dest }}"
    mode: "0644"
