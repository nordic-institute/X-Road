---
argument_specs:
  main:
    short_description: Deploy X-Road Security Server stack
    options:
      security_server_namespace: {type: str, required: true}
      kubeconfig_path: {type: path, required: true}
      security_server_chart_repo: {type: str, required: false}
      security_server_chart: {type: str, required: true}
      security_server_chart_version: {type: str, required: false}
      postgres_image: {type: str, required: true}
      xroad_image_registry: {type: str, required: false}
      xroad_image_tag: {type: str, required: false}
      serverconf_init_image: {type: str, required: false}
      jvm_metrics_enabled: {type: bool, default: false}
      openbao_tls_secret_name: {type: str, default: openbao-server-tls}
      configuration_client_update_interval: {type: str, default: "10"}
      op_monitor_records_available_offset_seconds: {type: str, default: ""}
      proxy_timestamp_immediately: {type: bool, default: false}
      common_global_conf_refresh_rate: {type: str, default: ""}
      proxy_batch_signing_enabled: {type: bool, default: false}
      messagelog_archiver_clean_keep_records_for: {type: str, default: ""}
      messagelog_archive_cron: {type: str, default: ""}
      messagelog_clean_cron: {type: str, default: ""}
      messagelog_encryption_config: {type: str, default: ""}
      ds_truststore_key: {type: str, default: cacerts}
      dsp_participant_context_id: {type: str, default: ""}
      signer_hsm_enabled: {type: bool, default: false}
      signer_hsm_image: {type: str, default: ss-signer-with-hsm}
      softtoken_signer_enabled: {type: bool, default: false}
      trusted_issuer_host: {type: str, default: xrd-cs}
      serverconf_db: {type: dict, required: true}
      messagelog_db: {type: dict, required: true}
      opmonitor_db: {type: dict, required: true}
      ds_control_plane_db: {type: dict, required: true}
      ds_identity_hub_db: {type: dict, required: true}
      ds_issuer_service_db: {type: dict, required: true}
