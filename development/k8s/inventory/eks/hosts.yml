---
# Skeleton inventory for EKS. Prerequisite:
#   aws eks update-kubeconfig --name <cluster> --region <region>
# Then:
#   core/scripts/env-k8s/start-env.sh --env=eks --skip-images --skip-forward --skip-init
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    k8s_control:
      hosts:
        localhost: {}
