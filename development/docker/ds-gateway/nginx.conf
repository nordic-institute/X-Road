# L4 front for a Security Server's GlobalConf-registered address in dev/test deployments.
# Counter-parties dial the ports named in the DID and DSP base URL the server publishes, which
# carry that one address, but the backends live in separate containers or pods; the stream servers under stream.d/
# (generated at startup from DS_GATEWAY_* env by 40-ds-gateway-stream.sh) forward each
# port to its backend. TLS passes through; the backends terminate.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
