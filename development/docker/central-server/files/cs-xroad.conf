[supervisord]
user=root

[program:postgres]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main -c config_file=/etc/postgresql/18/main/postgresql.conf
user=postgres
stopsignal=INT
stopwaitsecs=30
autorestart=unexpected
priority=100

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=unexpected
priority=100

[program:openbao]
command=/usr/bin/bao server -config=/etc/openbao/openbao.hcl
user=openbao
autorestart=true
stopsignal=INT
stopwaitsecs=30
priority=120

[program:xroad-secret-store-local]
command=/usr/share/xroad/scripts/secret-store-init.sh
autorestart=false
exitcodes=0
priority=150

[program:xroad-center]
command=/usr/share/xroad/scripts/wait-for-secret-store.sh /usr/share/xroad/bin/xroad-centralserver-admin-service
user=xroad
autorestart=true
priority=300

[program:xroad-center-registration-service]
command=/usr/share/xroad/scripts/wait-for-secret-store.sh /usr/share/xroad/bin/xroad-centralserver-registration-service
user=xroad
autorestart=true
priority=300

[program:xroad-center-management-service]
command=/usr/share/xroad/scripts/wait-for-secret-store.sh /usr/share/xroad/bin/xroad-centralserver-management-service
user=xroad
autorestart=true
priority=300

[program:xroad-signer]
command=/usr/share/xroad/scripts/wait-for-secret-store.sh /usr/share/xroad/bin/xroad-signer
user=xroad
autorestart=true
priority=300

; The Issuer Service serves the DS TLS certificate from OpenBao's tls/ds-https slot,
; provisioned through the admin API (setup.hurl or the manual-upload flow). Until the
; slot is populated it fails fast by design; startsecs=0 makes every exit count as a
; restartable run so supervisord retries it indefinitely instead of going FATAL.
[program:xroad-ds-issuer-service]
command=/usr/share/xroad/scripts/wait-for-secret-store.sh /usr/share/xroad/bin/xroad-ds-issuer-service
user=xroad
autorestart=true
startsecs=0
priority=350


[program:cron]
command=/usr/sbin/cron -f
user=root
autorestart=true
