metadata:
  country: EE
  description: Estonia Security Server settings

xroad:
  signer:
    key-length: 3072
    enforce-token-pin-policy: true
  proxy:
    batch-signing-enabled: true
    client-proxy:
      client-http-port: 80
      client-https-port: 443
    server:
      min-supported-client-version: "7.6.0"
    message-log:
      max-loggable-message-body-size: 20971520
