services:
  ssl-keystore-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -euo pipefail
        cd /keystore
        [ -f cacerts ] && exit 0
        cp /opt/java/openjdk/lib/security/cacerts cacerts
        chmod 0644 cacerts
    volumes:
      - ds-https-keystore:/keystore
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M

  configuration-client:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
    volumes:
      - ./container-files/etc/xroad/conf.d/local.yaml:/etc/xroad/conf.d/local.yaml

  signer:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - XROAD_SIGNER_OCSP_RESPONSE_RETRIEVAL_ACTIVE=true
      - QUARKUS_LOG_LEVEL=INFO
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d

  proxy:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml -Djavax.net.ssl.trustStore=/etc/xroad/ssl/cacerts -Djavax.net.ssl.trustStorePassword=changeit
      - DB_CONFIG_SOURCE_ENABLED=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - XROAD_PROXY_DSP_PARTICIPANT_CONTEXT_ID=ss0
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:5558/q/health" ]
    networks:
      xrd-ss-network:
        aliases:
          - ss0
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d
      - ./container-files/etc/xroad/messagelog:/etc/xroad/messagelog
    depends_on:
      testca:
        condition: service_healthy
      op-monitor:
        condition: service_healthy
      ssl-keystore-init:
        condition: service_completed_successfully

  ui:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - SERVER_SERVLET_SESSION_TIMEOUT=1m
      - XROAD_COMMON_RPC_CHANNEL_OP_MONITOR_HOST=op-monitor
      - XROAD_PROXY_UI_API_DATASPACE_ENABLED=true
      - XROAD_PROXY_UI_API_DATASPACE_IDENTITY_HUB_URL=https://ds-identity-hub:7182
      - XROAD_PROXY_UI_API_DATASPACE_CONTROL_PLANE_URL=https://ds-control-plane:8182
      - XROAD_PROXY_UI_API_DATASPACE_PARTICIPANT_ID=ss0
      - XROAD_PROXY_UI_API_DATASPACE_MANAGEMENT_CONTEXT_ENABLED=true
      - XROAD_PROXY_UI_API_DATASPACE_ISSUER_DID=did:web:ds-issuer-service%3A6183:issuer
