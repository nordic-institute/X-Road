        ON CONFLICT DO NOTHING;
        SQL
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully

  ui:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - SERVER_SERVLET_SESSION_TIMEOUT=1m
    ports:
      - "0:9999"
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d
    depends_on:
      testca:
        condition: service_healthy
      db-serverconf-config-seed:
        condition: service_completed_successfully

  auxiliary-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    ports:
      - "0:9999"
    volumes:
      - ./container-files/etc/xroad/conf.d/local.yaml:/etc/xroad/conf.d/local.yaml
      - ./container-files/etc/xroad/backup-keys:/etc/xroad/backup-keys
    depends_on:
      db-serverconf-config-seed:
        condition: service_completed_successfully

  db-opmonitor:
    image: ${POSTGRES_DEV_IMG}
    pull_policy: always
    environment:
      - POSTGRES_DB=op-monitor
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=opmonitor
    networks:
      - xrd-ss-network
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "pg_isready -U opmonitor -d op-monitor -h localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-opmonitor-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - JDBC_USER=opmonitor
      - JDBC_PASSWORD=secret
      - CHANGELOG=op-monitor
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=opmonitor
    depends_on:
      db-opmonitor:
        condition: service_healthy
    networks:
      - xrd-ss-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  op-monitor:
    image: ${OP_MONITOR_IMG}
    pull_policy: always
    environment:
      - QUARKUS_LOG_LEVEL=INFO
      - XROAD_HOST=op-monitor
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_USERNAME=opmonitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_PASSWORD=secret
      # op-monitor overrides (listen-address, scheme, tls cert-refresh, records offset) moved to the
      # configuration_properties DB-override layer - see seed service below.
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xrd-ss-network
    depends_on:
      db-opmonitor-init:
        condition: service_completed_successfully
      db-serverconf-config-seed:
        condition: service_completed_successfully

  testca:
    image: ${CA_IMG}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:8888/testca/certs/" ]
    networks:
      - xrd-ss-network

  testmailserver:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:587
      - MP_SMTP_REQUIRE_TLS=1
      - MP_SMTP_TLS_KEY=/tls/testmailserver_key.pem
      - MP_SMTP_TLS_CERT=/tls/testmailserver_cert.pem
      - MP_SMTP_AUTH_FILE=/tls/password_file
    networks:
      xrd-ss-network:
        aliases:
          - testmailserver
    volumes:
      - ./container-files/mail-server:/tls
    deploy:
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M

  nginx:
    image: nginx:latest
    networks:
      xrd-ss-network:
        aliases:
          - cs
          - mock-server
    volumes:
      - ./nginx-container-files/etc/nginx/conf.d:/etc/nginx/conf.d
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 256M
