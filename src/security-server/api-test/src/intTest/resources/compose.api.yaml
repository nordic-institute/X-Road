        ('xroad.op-monitor.records-available-timestamp-offset-seconds', '1', now(), now()),
        ('xroad.op-monitor.rpc.listen-address', '0.0.0.0', now(), now()),
        ('xroad.op-monitor.tls.certificate-provisioning.common-name', 'op-monitor', now(), now()),
