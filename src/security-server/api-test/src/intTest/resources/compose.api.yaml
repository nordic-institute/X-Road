        ('xroad.configuration-client.update-interval', '3', now(), now()),
        ('xroad.configuration-client.global-conf-tls-cert-verification', 'false', now(), now()),
        ('xroad.configuration-client.global-conf-hostname-verification', 'false', now(), now()),
        ('xroad.signer.enforce-token-pin-policy', 'true', now(), now()),
        ('xroad.signer.addon.hwtoken.enabled', 'true', now(), now()),
        ('xroad.signer.ocsp-prioritization-strategy', 'ONLY_FREE', now(), now()),
        ('xroad.signer.ocsp-response-retrieval-active', 'true', now(), now()),
        ('xroad.proxy-ui-api.rate-limit-requests-per-second', '10000', now(), now()),
        ('xroad.proxy-ui-api.rate-limit-requests-per-minute', '30000', now(), now()),
        ('xroad.proxy-ui-api.acme-challenge-port-enabled', 'true', now(), now()),
        ('xroad.proxy-ui-api.automatic-activate-acme-sign-certificate', 'true', now(), now()),
        ('xroad.proxy-ui-api.key-management-api-whitelist', '0.0.0.0/0, ::/0', now(), now()),
        ('xroad.proxy-ui-api.proxy-server-url', 'https://proxy:8443', now(), now()),

        ('xroad.proxy-ui-api.dataspace.enabled', 'true', now(), now()),
        ('xroad.proxy-ui-api.dataspace.identity-hub-url', 'https://ds-identity-hub:7182', now(), now()),
        ('xroad.proxy-ui-api.dataspace.control-plane-url', 'https://ds-control-plane:8182', now(), now()),
        ('xroad.proxy-ui-api.dataspace.participant-id', 'ss0', now(), now()),
        ('xroad.proxy-ui-api.dataspace.management-context-enabled', 'true', now(), now()),
        ('xroad.proxy-ui-api.dataspace.issuer-did', 'did:web:ds-issuer-service%3A6183:issuer', now(), now()),
        ('xroad.proxy-ui-api.dataspace.identity-token', 'eyJraWQiOiI3NGYzNDIyYjM3ZmM4Njg4ZTdmNWE3NDE2MjdmODg4OSIsInR5cCI6ImF0K2p3dCIsImFsZyI6IlJTMjU2In0.eyJpc3MiOiJ0ZXN0LWlzc3VlciIsImV4cCI6MjAwNDI2ODkwMCwiaWF0IjoxNzgzNTE2OTAwLCJqdGkiOiI3NDcyYmExN2ExMjE0MGI3YWVhNjNlNDM2ZWI1OTMxMSIsInNjb3BlIjoiaWRlbnRpdHktYXBpOmFkbWluIn0.LTjYT366IgFiI12rkxBatvzoIbtTzoYYVXRE9ytAJ23thT_cVid6Gv3m7XKe6bEphARXodhJqTwxeLYMtHAI_XIIC50xZ76e2mo9qLF9LX3JR2_Y5prMDb1BjmYpzedLupnu8SwB2W9n7POYeaMMTTXDlCZsqR2zffwZaCliXGWuj9VLdp0SUvNc8Xz9LMR1C0NNwL-HSH0oBHzMTn0E7kFSJ5HU0AZNa-h9ZNpYu6e4S_Yx7Lo4xRFtVMFRCW8sqfWfqjE861DVGTaQKgmBerbA0jfgaOWB4IU_8EwPBse68N2w8rCUJ4NU6MgRpd8uKEAbSBwNCmSpBvOOriqqAw', now(), now()),
