services:
  ssl-keystore-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -euo pipefail
        cd /keystore
        [ -f cacerts ] && exit 0
        cp /opt/java/openjdk/lib/security/cacerts cacerts
        chmod 0644 cacerts
    volumes:
      - ds-https-keystore:/keystore
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M

  configuration-client:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - DB_CONFIG_SOURCE_ENABLED=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    volumes:
      - ./container-files/etc/xroad/conf.d/local.yaml:/etc/xroad/conf.d/local.yaml
    depends_on:
      db-serverconf-confclient-config-seed:
        condition: service_completed_successfully

  signer:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - XROAD_SIGNER_OCSP_RESPONSE_RETRIEVAL_ACTIVE=true
      - QUARKUS_LOG_LEVEL=INFO
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d

  proxy:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml -Djavax.net.ssl.trustStore=/etc/xroad/ssl/cacerts -Djavax.net.ssl.trustStorePassword=changeit
      - DB_CONFIG_SOURCE_ENABLED=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - XROAD_PROXY_DSP_PARTICIPANT_CONTEXT_ID=ss0
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:5558/q/health" ]
    networks:
      xrd-ss-network:
        aliases:
          - ss0
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d
      - ./container-files/etc/xroad/messagelog:/etc/xroad/messagelog
    depends_on:
      testca:
        condition: service_healthy
      op-monitor:
        condition: service_healthy
      ssl-keystore-init:
        condition: service_completed_successfully
      db-serverconf-proxy-config-seed:
        condition: service_completed_successfully

  # Seeds the proxy's config overrides into configuration_properties so the proxy resolves them
  # via the DB-override layer (XRoadConfig.dbOverrides / DB ConfigSource), not local.yaml.
  # scope='proxy' matches the proxy's quarkus.application.name (DB filter: scope IS NULL OR scope=<app>).
  db-serverconf-proxy-config-seed:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, scope, created_at, updated_at) VALUES
             ('xroad.proxy.ssl-enabled', 'false', 'proxy', now(), now()),
             ('xroad.proxy.health-check-port', '5558', 'proxy', now(), now()),
             ('xroad.proxy.memory-usage-threshold', '77', 'proxy', now(), now()),
             ('xroad.proxy.message-log.timestamping-prioritization-strategy', 'PAID_FIRST', 'proxy', now(), now()),
             ('xroad.proxy.addon.op-monitor.enabled', 'true', 'proxy', now(), now()),
             ('xroad.proxy.addon.op-monitor.buffer.socket-timeout-seconds', '1', 'proxy', now(), now()),
             ('xroad.proxy.addon.op-monitor.connection.host', 'op-monitor', 'proxy', now(), now()),
             ('xroad.proxy.addon.op-monitor.connection.scheme', 'https', 'proxy', now(), now()),
             ('xroad.proxy.addon.op-monitor.connection.socket-timeout-seconds', '1', 'proxy', now(), now())
           ON CONFLICT DO NOTHING;"
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully

  # Seeds the configuration-client's config overrides into configuration_properties so the confclient
  # resolves them via the DB-override layer (XRoadConfig.dbOverrides / DB ConfigSource), not local.yaml.
  # scope='configuration-client' matches its quarkus.application.name (DB filter: scope IS NULL OR scope=<app>).
  db-serverconf-confclient-config-seed:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, scope, created_at, updated_at) VALUES
             ('xroad.configuration-client.update-interval', '3', 'configuration-client', now(), now()),
             ('xroad.configuration-client.global-conf-tls-cert-verification', 'false', 'configuration-client', now(), now()),
             ('xroad.configuration-client.global-conf-hostname-verification', 'false', 'configuration-client', now(), now())
           ON CONFLICT DO NOTHING;"
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully

  # Seeds the admin-service (proxy-ui-api) config overrides into configuration_properties so the UI
  # resolves them via the DB-override layer (XRoadConfig.dbOverrides / DB ConfigSource), not local.yaml/env.
  # scope='proxy-ui-api' matches its spring.application.name (DB filter: scope IS NULL OR scope=<app>).
  # authentication-provider/enforce-user-password-policy replace the application.yml '%containerized'
  # profile overrides, and proxy-server-url the XROAD_PROXY_UI_API_PROXY_SERVER_URL env, that the DSL
  # migration no longer reads (the SS runs the containerized profile and authenticates against the DB).
  db-serverconf-proxy-ui-api-config-seed:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, scope, created_at, updated_at) VALUES
             ('xroad.proxy-ui-api.authentication-provider', 'DATABASE', 'proxy-ui-api', now(), now()),
             ('xroad.proxy-ui-api.enforce-user-password-policy', 'true', 'proxy-ui-api', now(), now()),
             ('xroad.proxy-ui-api.rate-limit-requests-per-second', '10000', 'proxy-ui-api', now(), now()),
             ('xroad.proxy-ui-api.rate-limit-requests-per-minute', '30000', 'proxy-ui-api', now(), now()),
             ('xroad.proxy-ui-api.acme-challenge-port-enabled', 'true', 'proxy-ui-api', now(), now()),
             ('xroad.proxy-ui-api.automatic-activate-acme-sign-certificate', 'true', 'proxy-ui-api', now(), now()),
             ('xroad.proxy-ui-api.proxy-server-url', 'https://proxy:8443', 'proxy-ui-api', now(), now())
           ON CONFLICT DO NOTHING;"
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully

  ui:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - SERVER_SERVLET_SESSION_TIMEOUT=1m
      - XROAD_COMMON_RPC_CHANNEL_OP_MONITOR_HOST=op-monitor
      - XROAD_PROXY_UI_API_DATASPACE_ENABLED=true
      - XROAD_PROXY_UI_API_DATASPACE_IDENTITY_HUB_URL=https://ds-identity-hub:7182
      - XROAD_PROXY_UI_API_DATASPACE_PARTICIPANT_ID=ss0
      - XROAD_PROXY_UI_API_DATASPACE_MANAGEMENT_CONTEXT_ENABLED=true
      - XROAD_PROXY_UI_API_DATASPACE_ISSUER_DID=did:web:ds-issuer-service%3A6183:issuer
    ports:
      - "0:9999"
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d
    depends_on:
      testca:
        condition: service_healthy
      db-serverconf-proxy-ui-api-config-seed:
        condition: service_completed_successfully

  auxiliary-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
    ports:
      - "0:9999"
    volumes:
      - ./container-files/etc/xroad/conf.d/local.yaml:/etc/xroad/conf.d/local.yaml
      - ./container-files/etc/xroad/backup-keys:/etc/xroad/backup-keys

  db-opmonitor:
    image: ${POSTGRES_DEV_IMG}
    pull_policy: always
    environment:
      - POSTGRES_DB=op-monitor
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=opmonitor
    networks:
      - xrd-ss-network
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "pg_isready -U opmonitor -d op-monitor -h localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-opmonitor-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - JDBC_USER=opmonitor
      - JDBC_PASSWORD=secret
      - CHANGELOG=op-monitor
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=opmonitor
    depends_on:
      db-opmonitor:
        condition: service_healthy
    networks:
      - xrd-ss-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  op-monitor:
    image: ${OP_MONITOR_IMG}
    pull_policy: always
    environment:
      - QUARKUS_LOG_LEVEL=INFO
      - XROAD_HOST=op-monitor
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST=configuration-client
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_USERNAME=opmonitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_PASSWORD=secret
      - XROAD_OP_MONITOR_RECORDS_AVAILABLE_TIMESTAMP_OFFSET_SECONDS=1
      # op-monitor overrides (listen-address, scheme, tls cert-refresh, records offset) moved to the
      # configuration_properties DB-override layer (scope='op-monitor-daemon') - see seed service below.
      - DB_CONFIG_SOURCE_ENABLED=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xrd-ss-network
    depends_on:
      db-opmonitor-init:
        condition: service_completed_successfully
      db-serverconf-opmonitor-config-seed:
        condition: service_completed_successfully

  # Seeds the op-monitor daemon's config overrides into configuration_properties so it resolves them
  # via the DB-override layer (XRoadConfig.dbOverrides / DB ConfigSource), not env vars.
  # scope='op-monitor-daemon' matches its quarkus.application.name (DB filter: scope IS NULL OR scope=<app>).
  db-serverconf-opmonitor-config-seed:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, scope, created_at, updated_at) VALUES
             ('xroad.op-monitor.listen-address', '0.0.0.0', 'op-monitor-daemon', now(), now()),
             ('xroad.op-monitor.scheme', 'https', 'op-monitor-daemon', now(), now()),
             ('xroad.op-monitor.tls.client-certificate-refresh-interval', 'PT60S', 'op-monitor-daemon', now(), now()),
             ('xroad.op-monitor.records-available-timestamp-offset-seconds', '1', 'op-monitor-daemon', now(), now()),
             ('xroad.op-monitor.rpc.listen-address', '0.0.0.0', 'op-monitor-daemon', now(), now()),
             ('xroad.op-monitor.tls.certificate-provisioning.common-name', 'op-monitor', 'op-monitor-daemon', now(), now()),
             ('xroad.op-monitor.tls.certificate-provisioning.ip-subject-alt-names', '127.0.0.1', 'op-monitor-daemon', now(), now())
           ON CONFLICT DO NOTHING;"
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully

  testca:
    image: ${CA_IMG}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:8888/testca/certs/" ]
    networks:
      - xrd-ss-network

  testmailserver:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:587
      - MP_SMTP_REQUIRE_TLS=1
      - MP_SMTP_TLS_KEY=/tls/testmailserver_key.pem
      - MP_SMTP_TLS_CERT=/tls/testmailserver_cert.pem
      - MP_SMTP_AUTH_FILE=/tls/password_file
    networks:
      xrd-ss-network:
        aliases:
          - testmailserver
    volumes:
      - ./container-files/mail-server:/tls
    deploy:
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M

  nginx:
    image: nginx:latest
    networks:
      xrd-ss-network:
        aliases:
          - cs
          - mock-server
    volumes:
      - ./nginx-container-files/etc/nginx/conf.d:/etc/nginx/conf.d
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 256M
