        ('xroad.proxy.message-log.timestamping-prioritization-strategy', 'PAID_FIRST', now(), now()),
        ('xroad.proxy.addon.op-monitor.enabled', 'true', now(), now()),
        ('xroad.proxy.addon.op-monitor.buffer.socket-timeout-seconds', '1', now(), now()),
        ('xroad.proxy.addon.op-monitor.connection.host', 'op-monitor', now(), now()),
