services:
  ssl-keystore-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -euo pipefail
        cd /keystore
        [ -f cacerts ] && exit 0
        cp /opt/java/openjdk/lib/security/cacerts cacerts
        chmod 0644 cacerts
    volumes:
      - ds-https-keystore:/keystore
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M

  configuration-client:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    volumes:
      - ./container-files/etc/xroad/conf.d/local.yaml:/etc/xroad/conf.d/local.yaml
    depends_on:
      db-serverconf-config-seed:
        condition: service_completed_successfully

  signer:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml
      - QUARKUS_LOG_LEVEL=INFO
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d
    depends_on:
      db-serverconf-config-seed:
        condition: service_completed_successfully

  proxy:
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.config.locations=/etc/xroad/conf.d/local.yaml -Djavax.net.ssl.trustStore=/etc/xroad/ssl/cacerts -Djavax.net.ssl.trustStorePassword=changeit
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:5558/q/health" ]
    networks:
      xrd-ss-network:
        aliases:
          - ss0
    volumes:
      - ./container-files/etc/xroad/conf.d:/etc/xroad/conf.d
      - ./container-files/etc/xroad/messagelog:/etc/xroad/messagelog
    depends_on:
      testca:
        condition: service_healthy
      op-monitor:
        condition: service_healthy
      ssl-keystore-init:
        condition: service_completed_successfully
      db-serverconf-config-seed:
        condition: service_completed_successfully

  # Single place for all configuration_properties seeds. Rows are keyed by property_key alone (the consuming
  # app's quarkus/spring.application.name, or NULL for global); apps resolve these via the DB-override
  # layer (XRoadConfig.dbOverrides / DB ConfigSource), not local.yaml/env.
  db-serverconf-config-seed:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 <<'SQL'
        INSERT INTO configuration_properties (property_key, property_value, created_at, updated_at) VALUES
        ('xroad.proxy.ssl-enabled', 'false', now(), now()),
        ('xroad.proxy.health-check-port', '5558', now(), now()),
        ('xroad.proxy.memory-usage-threshold', '77', now(), now()),
