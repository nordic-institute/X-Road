        ('xroad.proxy.addon.op-monitor.enabled', 'true', 'proxy', now(), now()),
        ('xroad.proxy.addon.op-monitor.buffer.socket-timeout-seconds', '1', 'proxy', now(), now()),
        ('xroad.proxy.addon.op-monitor.connection.host', 'op-monitor', 'proxy', now(), now()),
        ('xroad.proxy.addon.op-monitor.connection.scheme', 'https', 'proxy', now(), now()),
        ('xroad.proxy.addon.op-monitor.connection.socket-timeout-seconds', '1', 'proxy', now(), now()),
        ('xroad.proxy.dsp.participant-context-id', 'ss0', 'proxy', now(), now()),
        ('xroad.configuration-client.update-interval', '3', 'configuration-client', now(), now()),
        ('xroad.configuration-client.global-conf-tls-cert-verification', 'false', 'configuration-client', now(), now()),
        ('xroad.configuration-client.global-conf-hostname-verification', 'false', 'configuration-client', now(), now()),
        ('xroad.signer.enforce-token-pin-policy', 'true', 'signer', now(), now()),
        ('xroad.signer.addon.hwtoken.enabled', 'true', 'signer', now(), now()),
        ('xroad.signer.ocsp-prioritization-strategy', 'ONLY_FREE', 'signer', now(), now()),
        ('xroad.signer.ocsp-response-retrieval-active', 'true', 'signer', now(), now()),
        ('xroad.proxy-ui-api.rate-limit-requests-per-second', '10000', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.rate-limit-requests-per-minute', '30000', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.acme-challenge-port-enabled', 'true', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.automatic-activate-acme-sign-certificate', 'true', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.proxy-server-url', 'https://proxy:8443', 'proxy-ui-api', now(), now()),

        ('xroad.proxy-ui-api.dataspace.enabled', 'true', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.identity-hub-url', 'https://ds-identity-hub:7182', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.control-plane-url', 'https://ds-control-plane:8182', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.participant-id', 'ss0', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.management-context-enabled', 'true', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.issuer-did', 'did:web:ds-issuer-service%3A6183:issuer', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.identity-token', 'eyJ0eXAiOiJhdCtqd3QiLCJhbGciOiJSUzI1NiIsImtpZCI6Ijc0ZjM0MjJiMzdmYzg2ODhlN2Y1YTc0MTYyN2Y4ODg5In0.eyJpc3MiOiJ0ZXN0LWlzc3VlciIsImV4cCI6MTk4OTg0MDk5NywiaWF0IjoxNzY4ODM3Mzk3LCJqdGkiOiI3ZDM1YTUwZGNmMmEyNTE2YTE1ZDgwYjJiNDFlZWRmYSIsInJvbGUiOiJhZG1pbiIsInNjb3BlIjoiaWRlbnRpdHktYXBpOndyaXRlIGlkZW50aXR5LWFwaTpyZWFkIn0.vKPkIJ47atCdUnH60TsGSihx54xqbpvmI-QYSIRZprkmY3Fb8zPZ4PYMrTUCu6mw-ISPyzV1fu54s5bYD4q5trjZN8hrocgWyYbPPkk-sZDqcKFwFfxcVWP7wPuRZOus_AxcxrSny0IQYzlTmmvhVqPq1MJjLSximHnY3Hg7yti_b0OZE5iBMKuoww8xlr6OXY4dpJHAvwK6vJhscoQa5Mm56GsSVto38Y4HHsKlNjJlYPpILdiiytfMS5x6AhCALRoY15_0upP-MWWe7eq_2sAv7TuEZJFIdpfpWKQG4-eMHBTNim17FZx76CG9xoYhlhrJ5WGSel_8xTJD3xSVzg', 'proxy-ui-api', now(), now()),
        ('xroad.proxy-ui-api.dataspace.control-plane-token', 'eyJ0eXAiOiJhdCtqd3QiLCJhbGciOiJSUzI1NiIsImtpZCI6Ijc0ZjM0MjJiMzdmYzg2ODhlN2Y1YTc0MTYyN2Y4ODg5In0.eyJpc3MiOiJ0ZXN0LWlzc3VlciIsImV4cCI6MTk4OTg0MDk5NywiaWF0IjoxNzY4ODM3Mzk3LCJqdGkiOiI3ZDM1YTUwZGNmMmEyNTE2YTE1ZDgwYjJiNDFlZWRmYSIsInJvbGUiOiJwcm92aXNpb25lciIsInNjb3BlIjoibWFuYWdlbWVudC1hcGk6d3JpdGUgbWFuYWdlbWVudC1hcGk6cmVhZCJ9.VtgeUBJXWdZSsemdWTtvSDqdCUa1eBaqMlxbBVAAPsSjyVOb8wiDmxpTqvyLKTw9WE2WznmaOUPpWh3s4nDTjHQ51-ke_H__5WHVkwK-E97AFvInue-1lPMdIC1rNGLyZKYmQQ8DtHwZDWkgl-F4zhiyTk8Z3OBzgZpDz3BcyyJT7WLvAHp6Pk0SdHmFhA5ctvXfra4-ZkfUUudXklOEe-8Jj42v2EjF0woUk9nHoNYA_ca2Gi3kHtJrpHhR4_3Ab7KU046-p0dF5bVLLhYh3HEg-71R0tO9eytzbHkMZMY353aKF0bUqK4UrKnstDT55yo5j5oLpP0xGA9KGai6Kg', 'proxy-ui-api', now(), now()),

        ('xroad.acme', '{"eab-credentials":{"certificate-authorities":{"Test CA":{"mac-key-base64-encoded":true,"members":{"DEV:COM:1234":{"auth-kid":"keyid_2","auth-mac-key":"addfdbb19965e85623c124a88d085eae50a7f7f4f570989e3a320a81c3119625","sign-kid":"keyid_3","sign-mac-key":"96d7380f5ea8de06912a4520d0adca616848b5e70cb3d0bd748af5b33507ddde"}}}}},"account-keystore-password":"testPassword123"}', 'proxy-ui-api', now(), now()),
