services:
  # Obtains a testca-signed DS TLS certificate and writes it into this stack's shared OpenBao at
  # tls/ds-https, before any ds-* service starts (see the depends_on gates below). The CA
  # designation (approvedDsTlsCa) that makes ds-* peers trust this chain lives in the static
  # globalconf nginx fixture (see PRD known-gap note: that fixture predates the v7 schema, so
  # outbound fail-closed trust cannot be exercised in this stack without fixture-generation work -
  # this container only covers serving, not cross-host trust).
  ds-tls-cert-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    environment:
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
    command:
      - |
        set -euo pipefail
        apk add --no-cache openssl curl sed >/dev/null
        workdir="$$(mktemp -d)"
        cd "$$workdir"
        openssl genrsa -out ds-https-key.pem 2048
        openssl req -new -key ds-https-key.pem -out ds-https.csr -subj "/CN=xrd-ds" \
          -addext "subjectAltName=DNS:ds-issuer-service,DNS:ds-identity-hub,DNS:ds-control-plane,DNS:localhost"
        curl -fsS -X POST -F "type=auth" -F "certreq=@ds-https.csr" "http://testca:8888/testca/sign" -o ds-https-cert.pem
        curl -fsS "http://testca:8888/testca/certs/ca.cert.pem" -o ds-https-ca.pem
        cert_content=$$(cat ds-https-cert.pem ds-https-ca.pem | sed ':a;N;$$!ba;s/\n/\\n/g')
        key_content=$$(sed ':a;N;$$!ba;s/\n/\\n/g' ds-https-key.pem)
        payload="{\"certificate\": \"$${cert_content}\", \"privateKey\": \"$${key_content}\"}"
        curl -fsS -X POST \
          -H "X-Vault-Token: $${XROAD_SECRET_STORE_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$$payload" \
          "http://openbao:8200/v1/xrd-secret/tls/ds-https"
    networks:
      - xrd-ss-network
    depends_on:
      testca:
        condition: service_healthy
      openbao:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M


  db-ds-control-plane:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_control_plane_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-control-plane
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-control-plane:
    image: ${DS_CONTROL_PLANE_IMG}
    pull_policy: always
    environment:
      - DEBUG=true
      - HOSTNAME=ds-control-plane
      - XROAD_HOST=ds-control-plane
      - XROAD_DSP_PARTICIPANT_CONTEXT_ID=ss0
      # Interpolated into edc.iam.trusted-issuer.issuer.id by the packaged application.yaml: the EDC
      # key is hyphenated, so an env var can only reach it through an X-Road key the yaml declares.
      - XROAD_EDC_IAM_TRUSTED_ISSUER_ISSUER_ID=did:web:ds-issuer-service%3A6183:issuer
      - XROAD_PROXY_DATAPLANE_URL=http://proxy:5590/full/api/v1/dataflows
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-control-plane:5432/ds-control-plane
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_PASSWORD=ds_control_plane_admin_secret
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME=serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD=secret
      - EDC_DSP_CALLBACK_ADDRESS=https://ds-control-plane:8183/api/dsp/%s
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xrd-ss-network
    ports:
      - "0:8181"
      - "0:8183"
      - "0:8184"
      - "0:9999"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 320M
    depends_on:
      db-ds-control-plane:
        condition: service_healthy
      configuration-client:
        condition: service_healthy
      ds-identity-hub:
        condition: service_healthy
      ds-tls-cert-init:
        condition: service_completed_successfully

  db-ds-identity-hub:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_identity_hub_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-identity-hub
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-identity-hub:
    image: ${DS_IDENTITY_HUB_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=ds-identity-hub
      - XROAD_HOST=ds-identity-hub
      - EDC_IH_DID_PUBLIC_HOSTNAME=ds-identity-hub
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-identity-hub:5432/ds-identity-hub
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_PASSWORD=ds_identity_hub_admin_secret
      - DEBUG=true
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-fk", "https://localhost:7181/api/check/health" ]
    networks:
      - xrd-ss-network
    ports:
      - "0:7183"
      - "0:7185"
      - "0:9999"
    depends_on:
      db-ds-identity-hub:
        condition: service_healthy
      ds-tls-cert-init:
        condition: service_completed_successfully

  db-ds-issuer-service:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_issuer_service_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-issuer-service
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-issuer-service:
    image: ${DS_ISSUER_SERVICE_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=ds-issuer-service
      - XROAD_HOST=ds-issuer-service
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-issuer-service:5432/ds-issuer-service
      - XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_PASSWORD=ds_issuer_service_admin_secret
      - EDC_STATUSLIST_CALLBACK_ADDRESS=https://ds-issuer-service:6187/statuslist
      - DEBUG=true
    healthcheck:
      start_period: 60s
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-fk", "https://localhost:6181/api/check/health" ]
    networks:
      - xrd-ss-network
    ports:
      - "0:6183"
      - "0:6185"
      - "0:6187"
      - "0:9999"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 320M
    depends_on:
      db-ds-issuer-service:
        condition: service_healthy
      ds-tls-cert-init:
        condition: service_completed_successfully
