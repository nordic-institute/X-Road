quarkus:
  log:
    level: INFO
    category:
      "org.niis.xroad.proxy.core.healthcheck":
        level: DEBUG
xroad:
  common-rpc:
    certificate-provisioning:
      # To ensure vault-powered mTLS certificate rotation
      ttl: 120S
      refresh-interval: 60S
  # xroad.configuration-client.* overrides moved to the DB-override layer (configuration_properties,
  # scope='configuration-client'), seeded by db-serverconf-confclient-config-seed in compose.systemtest.yaml.
  # ConfigurationClientProperties now resolves via XRoadConfig (DB overrides + DSL defaults), not local.yaml.
  # xroad.signer.* overrides (enforce-token-pin-policy, addon.hwtoken.enabled, ocsp-prioritization-strategy)
  # moved to the DB-override layer (configuration_properties, scope='signer'), seeded by the
  # db-serverconf-signer-config-seed service in compose.systemtest.yaml. SignerProperties now resolves
  # via XRoadConfig (DB overrides + DSL defaults), so local.yaml no longer affects them.
  # xroad.proxy.* overrides moved to the DB-override layer (configuration_properties, scope='proxy'),
  # seeded by the db-serverconf-proxy-config-seed service in compose.systemtest.yaml. ProxyProperties
  # now resolves via XRoadConfig (DB overrides + DSL defaults), so local.yaml no longer affects them.
  # xroad.proxy-ui-api.* overrides moved to the DB-override layer (configuration_properties,
  # scope='proxy-ui-api'), seeded by the db-serverconf-proxy-ui-api-config-seed service in
  # compose.systemtest.yaml. AdminServiceProperties now resolves via XRoadConfig (DB overrides + DSL
  # defaults), so local.yaml no longer affects them.
  # xroad.message-log-encryption.* overrides moved to the DB-override layer (configuration_properties,
  # scope=NULL/global, shared by proxy + message-log-archiver), seeded by the
  # db-serverconf-message-log-encryption-config-seed service in compose.systemtest.yaml. The DSL resolves
  # them via XRoadConfig (DB overrides + DSL defaults), so local.yaml no longer affects them.
  # xroad.op-monitor.* overrides (incl. scheme=https for vault-powered mTLS) are seeded into the
  # DB-override layer (configuration_properties, scope='op-monitor-daemon') by the
  # db-serverconf-opmonitor-config-seed service; the daemon resolves them via XRoadConfig, not local.yaml.
  # xroad.auxiliary-service.backup.* overrides moved to the DB-override layer (configuration_properties,
  # scope='auxiliary-service'), seeded by the db-serverconf-auxiliary-service-config-seed service in
  # compose.systemtest.yaml. BackupProperties now resolves via XRoadConfig (DB overrides + DSL defaults),
  # so local.yaml no longer affects them.
  # xroad.acme and xroad.mail-notification (full YAML documents) moved to the DB-override layer
  # (configuration_properties, scope='proxy-ui-api'), seeded as single-line JSON by the
  # db-serverconf-proxy-ui-api-config-seed service in compose.systemtest.yaml. AcmeCommonConfig and
  # MailConfig now resolve them via XRoadConfig (DB overrides + DSL defaults), not local.yaml.


