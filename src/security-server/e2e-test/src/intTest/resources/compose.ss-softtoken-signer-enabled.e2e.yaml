services:
  config-seed-softtoken:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 <<'SQL'
        INSERT INTO configuration_properties (property_key, property_value, created_at, updated_at) VALUES
        ('xroad.common-rpc.channel.softtoken-signer.enabled', 'true', now(), now())
        ON CONFLICT DO NOTHING;
        SQL
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M

  proxy:
    depends_on:
      config-seed-softtoken:
        condition: service_completed_successfully
  softtoken-signer:
    image: ${SOFTTOKEN_SIGNER_IMG}
    pull_policy: always
    networks:
      - xrd-ss-network
    environment:
      - DEBUG=true
      - XROAD_HOST=softtoken-signer
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
    ports:
      - "0:9999" # debug
