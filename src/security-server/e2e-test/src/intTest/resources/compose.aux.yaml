services:
  cs:
    image: ${CS_IMG}
    environment:
      - XROAD_HOST=cs
      # Additional SANs beyond XROAD_HOST (the CN) so the same certificate validates for every
      # hostname that dials this container's ds-issuer-service across the aux/ss0/ss1 stacks.
      - DS_TLS_SAN=DNS:cs,DNS:ds-issuer-service,DNS:ds-identity-hub,DNS:ds-control-plane,DNS:ss0-ds-identity-hub,DNS:ss1-ds-identity-hub,DNS:ss0-ds-control-plane,DNS:ss1-ds-control-plane,DNS:xrd-ss0,DNS:xrd-ss1,DNS:localhost
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 3072M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:4000" ]
    ports:
      - "0:4000" # Frontend
      - "0:9994" # Signer debug
      - "0:5432" # DB
      - "0:6183" # Issuer DID resolution
      - "0:6185" # Issuer issuance API
      - "0:6187" # Issuer statuslist API
    networks:
      - xroad-network
    depends_on:
      testca:
        condition: service_healthy
  testca:
    image: ${CA_IMG}
    pull_policy: always
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8888/testca/certs" ]
    networks:
      - xroad-network
    volumes:
      - ca-volume:/home/ca/certs
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./testmail:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_REQUIRE_STARTTLS: 1
      MP_SMTP_TLS_CERT: /data/mailpit_cert.pem
      MP_SMTP_TLS_KEY: /data/mailpit_key.pem
      MP_SMTP_AUTH_FILE: /data/password_file
    networks:
      - xroad-network
  isopenapi:
    image: "ghcr.io/nordic-institute/xrddev-example-restapi:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/v3/api-docs" ]
    networks:
      - xroad-network
  issoap:
    image: "niis/example-adapter:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/example-adapter/Endpoint?wsdl" ]
    networks:
      - xroad-network
    entrypoint: [ "java", "-Xms64m", "-Xmx256m", "-jar", "/example-adapter.war" ]
  isrest:
    image: wiremock/wiremock:latest
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/__admin/health" ]
    networks:
      - xroad-network
    volumes:
      - ./wiremock_mappings:/home/wiremock/mappings
  hurl:
    build:
        context: hurl
        dockerfile: ./Dockerfile
    command: >
      --insecure
      --variables-file /hurl-src/vars.env
      --variable ss0_host=${PROXY_UI_0}
      --variable ss1_host=${PROXY_UI_1}
      --variable ss0_proxy=${PROXY_0}
      --variable ss1_proxy=${PROXY_1}
      --variable is_host=cs
      --file-root /hurl-files
      /hurl-src/setup.hurl
      --very-verbose
      --retry 30
      --retry-interval 10000
    deploy:
      resources:
        reservations:
          memory: 24M
        limits:
          memory: 128M
    networks:
      - xroad-network
    volumes:
      - ca-volume:/hurl-files/ca
    depends_on:
      cs:
        condition: service_healthy
      testca:
        condition: service_healthy
      isopenapi:
        condition: service_healthy
      issoap:
        condition: service_healthy
      isrest:
        condition: service_healthy

  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    networks:
      - xroad-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

volumes:
  ca-volume:
networks:
  xroad-network:
    name: xroad-network
    external: true
