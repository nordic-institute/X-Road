services:
  cs:
    image: ${CS_IMG}
    environment:
      - XROAD_HOST=cs
      # Co-located Issuer Service: CS-init provisions it over loopback gRPC (the
      # default RPC host 127.0.0.1 matches the issuer server-cert IP SAN).
      # Publish the issuer DID under the `cs` host.
      - XROAD_DATASPACE_ISSUER_HOST=cs
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 3072M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:4000" ]
    ports:
      - "0:4000" # Frontend
      - "0:9994" # Signer debug
      - "0:5432" # DB
      - "0:6183" # Issuer DID resolution
      - "0:6185" # Issuer issuance API
      - "0:6187" # Issuer statuslist API
    networks:
      - xroad-network
    volumes:
      - ds-https-keystore:/etc/xroad/ds-ssl:ro
    depends_on:
      ds-https-keystore-init:
        condition: service_completed_successfully
  testca:
    image: ${CA_IMG}
    pull_policy: always
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8888/testca/certs" ]
    networks:
      - xroad-network
    volumes:
      - ca-volume:/home/ca/certs
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./testmail:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_REQUIRE_STARTTLS: 1
      MP_SMTP_TLS_CERT: /data/mailpit_cert.pem
      MP_SMTP_TLS_KEY: /data/mailpit_key.pem
      MP_SMTP_AUTH_FILE: /data/password_file
    networks:
      - xroad-network
  isopenapi:
    image: "ghcr.io/nordic-institute/xrddev-example-restapi:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/v3/api-docs" ]
    networks:
      - xroad-network
  issoap:
    image: "niis/example-adapter:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/example-adapter/Endpoint?wsdl" ]
    networks:
      - xroad-network
    entrypoint: [ "java", "-Xms64m", "-Xmx256m", "-jar", "/example-adapter.war" ]
  isrest:
    image: wiremock/wiremock:latest
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/__admin/health" ]
    networks:
      - xroad-network
    volumes:
      - ./wiremock_mappings:/home/wiremock/mappings
  ds-https-keystore-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -euo pipefail
        cd /keystore
        [ -f ds-https.p12 ] && [ -f cacerts ] && exit 0
        apk add --no-cache openssl
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout ds-https-key.pem -out ds-https-cert.pem \
          -subj "/CN=xrd-ds" \
          -addext "subjectAltName=DNS:cs,DNS:ds-issuer-service,DNS:ds-identity-hub,DNS:ds-control-plane,DNS:ss0-ds-identity-hub,DNS:ss1-ds-identity-hub,DNS:ss0-ds-control-plane,DNS:ss1-ds-control-plane,DNS:xrd-ss0,DNS:xrd-ss1,DNS:localhost"
        openssl pkcs12 -export -out ds-https.p12 -inkey ds-https-key.pem -in ds-https-cert.pem \
          -name ds-https -password pass:changeit
        cp /opt/java/openjdk/lib/security/cacerts cacerts
        chmod u+w cacerts
        keytool -import -trustcacerts -noprompt -alias ds-https -file ds-https-cert.pem \
          -keystore cacerts -storepass changeit
        chmod 0644 ds-https.p12 cacerts ds-https-cert.pem
    volumes:
      - ds-https-keystore:/keystore
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  hurl:
    build:
        context: hurl
        dockerfile: ./Dockerfile
    command: >
      --insecure
      --variables-file /hurl-src/vars.env
      --variable ss0_host=${PROXY_UI_0}
      --variable ss1_host=${PROXY_UI_1}
      --variable ss0_proxy=${PROXY_0}
      --variable ss1_proxy=${PROXY_1}
      --variable is_host=cs
      --file-root /hurl-files
      /hurl-src/setup.hurl
      --very-verbose
      --retry 30
      --retry-interval 10000
    deploy:
      resources:
        reservations:
          memory: 24M
        limits:
          memory: 128M
    networks:
      - xroad-network
    volumes:
      - ca-volume:/hurl-files/ca
    depends_on:
      cs:
        condition: service_healthy
      testca:
        condition: service_healthy
      isopenapi:
        condition: service_healthy
      issoap:
        condition: service_healthy
      isrest:
        condition: service_healthy

  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    networks:
      - xroad-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  mock-jwks-server:
    image: python:3.11-alpine
    command: >
      sh -c "
        mkdir -p  /tmp/jwks &&
        echo '{\"keys\":['$(cat /jwks/public_key.json)']}' > /tmp/jwks/jwks.json &&
        python3 -m http.server 8080 --directory /tmp/jwks
      "
    ports:
      - "0:8080"
    networks:
      - xroad-network
    healthcheck:
      interval: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/jwks.json"]
    volumes:
      - ./jwks/:/jwks

  # Downloads the configuration anchor from the Central Server for the
  # configuration-client. The download is fault tolerant: it retries until the
  # CS is initialised (login + signing keys) by setup.hurl in the hurl
  # container, then exits so configuration-client can fetch a signed global conf
  # for the issuer's X-Road membership-claim verification.
  anchor-init:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        set -e
        CS="https://cs:4000"
        JAR="$$(mktemp)"
        echo "anchor-init: waiting for Central Server.."
        until curl -sfk -o /dev/null "$$CS"; do sleep 3; done
        echo "anchor-init: downloading anchor, retrying until the CS is initialised by setup.hurl.."
        while true; do
          rm -f "$$JAR"
          curl -sk -c "$$JAR" -o /dev/null "$$CS" || { sleep 5; continue; }
          XSRF="$$(awk '/XSRF-TOKEN/{print $$7}' "$$JAR")"
          code="$$(curl -sk -b "$$JAR" -c "$$JAR" -o /dev/null -w '%{http_code}' \
            -X POST "$$CS/login" --data 'username=xrd' --data 'password=secret123!' \
            -H "X-XSRF-TOKEN: $$XSRF")"
          if [ "$$code" != "200" ]; then echo "anchor-init: login HTTP $$code, retrying.."; sleep 5; continue; fi
          XSRF="$$(awk '/XSRF-TOKEN/{print $$7}' "$$JAR")"
          code="$$(curl -sk -b "$$JAR" -c "$$JAR" -o /anchor/configuration-anchor.xml -w '%{http_code}' \
            "$$CS/api/v1/configuration-sources/INTERNAL/anchor/download" -H "X-XSRF-TOKEN: $$XSRF")"
          if [ "$$code" = "200" ] && [ -s /anchor/configuration-anchor.xml ]; then
            echo "anchor-init: anchor downloaded"; exit 0
          fi
          echo "anchor-init: anchor download HTTP $$code (CS not initialised yet), retrying.."
          sleep 5
        done
    networks:
      - xroad-network
    volumes:
      - ds-anchor:/anchor
    deploy:
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M

  configuration-client:
    image: ${CONFIGURATION_CLIENT_IMG}
    pull_policy: always
    environment:
      - DEBUG=true
      - XROAD_HOST=configuration-client
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_CONFIGURATION_CLIENT_CONFIGURATION_ANCHOR_STORAGE=FILE
      - XROAD_CONFIGURATION_CLIENT_CONFIGURATION_ANCHOR_FILE=/anchor/configuration-anchor.xml
      - QUARKUS_DATASOURCE_ACTIVE=false
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xroad-network
    volumes:
      - ds-anchor:/anchor
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 320M
    depends_on:
      openbao:
        condition: service_healthy
      anchor-init:
        condition: service_completed_successfully

volumes:
  ca-volume:
  ds-anchor:
  ds-https-keystore:
    external: true
    name: e2e-ds-https-keystore
networks:
  xroad-network:
    name: xroad-network
    external: true
