services:
  cs:
    image: ${CS_IMG}
    environment:
      - XROAD_HOST=cs
      # The DS TLS trust replaces JVM defaults on the shared EDC OkHttp client, which EDC's vault
      # client also uses -- OpenBao's self-signed cert (installed system-wide by the image's postinst)
      # must be handed to it explicitly. Read via plain System.getenv in VaultEndpointTrust, not
      # through EDC's @Setting resolution, so an env var is enough.
      - QUARKUS_VAULT_TLS_CA_CERT=/usr/local/share/ca-certificates/openbao.crt
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 3072M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:4000" ]
    ports:
      - "0:4000" # Frontend
      - "0:9994" # Signer debug
      - "0:5432" # DB
      - "0:6183" # Issuer DID resolution
      - "0:6185" # Issuer issuance API
      - "0:6187" # Issuer statuslist API
    networks:
      - xroad-network
    volumes:
      - ds-https-keystore:/etc/xroad/ds-ssl:ro
      - ./container-files/etc/xroad/db-config-seed/50-e2e.properties:/etc/xroad/db-config-seed/50-e2e.properties:ro
    depends_on:
      ds-https-keystore-init:
        condition: service_completed_successfully
  testca:
    image: ${CA_IMG}
    pull_policy: always
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8888/testca/certs" ]
    networks:
      - xroad-network
    volumes:
      - ca-volume:/home/ca/certs
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./testmail:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_REQUIRE_STARTTLS: 1
      MP_SMTP_TLS_CERT: /data/mailpit_cert.pem
      MP_SMTP_TLS_KEY: /data/mailpit_key.pem
      MP_SMTP_AUTH_FILE: /data/password_file
    networks:
      - xroad-network
  isopenapi:
    image: "ghcr.io/nordic-institute/xrddev-example-restapi:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/v3/api-docs" ]
    networks:
      - xroad-network
  issoap:
    image: "niis/example-adapter:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/example-adapter/Endpoint?wsdl" ]
    networks:
      - xroad-network
    entrypoint: [ "java", "-Xms64m", "-Xmx256m", "-jar", "/example-adapter.war" ]
  isrest:
    image: wiremock/wiremock:latest
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/__admin/health" ]
    networks:
      - xroad-network
    volumes:
      - ./wiremock_mappings:/home/wiremock/mappings
  ds-https-keystore-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -euo pipefail
        cd /keystore
        if [ -f ds-https.p12 ] && [ -f cacerts ]; then
          echo "ds-https keystore files already present"
        else
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout ds-https-key.pem -out ds-https-cert.pem \
            -subj "/CN=xrd-ds" \
            -addext "subjectAltName=DNS:cs,DNS:ds-issuer-service,DNS:ds-identity-hub,DNS:ds-control-plane,DNS:ss0-ds-identity-hub,DNS:ss1-ds-identity-hub,DNS:ss0-ds-control-plane,DNS:ss1-ds-control-plane,DNS:xrd-ss0,DNS:xrd-ss1,DNS:localhost"
          openssl pkcs12 -export -out ds-https.p12 -inkey ds-https-key.pem -in ds-https-cert.pem \
            -name ds-https -password pass:changeit
          cp /opt/java/openjdk/lib/security/cacerts cacerts
          chmod u+w cacerts
          keytool -import -trustcacerts -noprompt -alias ds-https -file ds-https-cert.pem \
            -keystore cacerts -storepass changeit
        fi
        # Outside the reuse guard: the shared volume can hold key files written
        # root-0600 by older init runs, unreadable by the xroad user in the cs container.
        chmod 0644 ds-https.p12 cacerts ds-https-cert.pem ds-https-key.pem
        # Stopgap until real DS TLS certificate provisioning covers this stack: the owned
        # Jetty module reads the DS TLS certificate from OpenBao, not from these files —
        # seed the same key/cert generated above into tls/ds-https so ds-* services (and
        # the co-located Issuer Service in the cs container) don't fail closed.
        apk add --no-cache curl jq
        PAYLOAD=$$(jq -n --rawfile cert ds-https-cert.pem --rawfile key ds-https-key.pem \
          '{certificate: $$cert, privateKey: $$key}')
        curl -fsS -X POST \
          -H "X-Vault-Token: ${XROAD_SECRET_STORE_TOKEN}" \
          -H "Content-Type: application/json" \
          --data "$$PAYLOAD" \
          "http://openbao:8200/v1/xrd-secret/tls/ds-https" >/dev/null
        echo "Wrote ds-https certificate to OpenBao at tls/ds-https"
    environment:
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
    networks:
      - xroad-network
    volumes:
      - ds-https-keystore:/keystore
    depends_on:
      openbao:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  hurl:
    build:
        context: hurl
        dockerfile: ./Dockerfile
    command: >
      --insecure
      --variables-file /hurl-src/vars.env
      --variable ss0_host=${PROXY_UI_0}
      --variable ss1_host=${PROXY_UI_1}
      --variable ss0_proxy=${PROXY_0}
      --variable ss1_proxy=${PROXY_1}
      --variable is_host=cs
      --variable ds_tls_ca_file=ds/ds-https-cert.pem
      --file-root /hurl-files
      /hurl-src/setup.hurl
      --very-verbose
      --retry 30
      --retry-interval 10000
    deploy:
      resources:
        reservations:
          memory: 24M
        limits:
          memory: 128M
    networks:
      - xroad-network
    volumes:
      - ca-volume:/hurl-files/ca
      # Same self-signed cert ds-https-keystore-init generates and every ds-* container serves (there
      # is no separate issuing CA in this environment): registered as its own DS TLS CA trust anchor.
      - ds-https-keystore:/hurl-files/ds:ro
    depends_on:
      cs:
        condition: service_healthy
      testca:
        condition: service_healthy
      isopenapi:
        condition: service_healthy
      issoap:
        condition: service_healthy
      isrest:
        condition: service_healthy
      ds-https-keystore-init:
        condition: service_completed_successfully

  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    networks:
      - xroad-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

volumes:
  ca-volume:
  ds-https-keystore:
    external: true
    name: e2e-ds-https-keystore
networks:
  xroad-network:
    name: xroad-network
    external: true
