services:
  cs:
    image: ${CS_IMG}
    environment:
      - XROAD_HOST=cs
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 2560M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:4000" ]
    ports:
      - "0:4000" # Frontend
      - "0:9994" # Signer debug
      - "0:5432" # DB
    networks:
      - xroad-network
  testca:
    image: ${CA_IMG}
    pull_policy: always
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8888/testca/certs" ]
    networks:
      - xroad-network
    volumes:
      - ca-volume:/home/ca/certs
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./testmail:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_REQUIRE_STARTTLS: 1
      MP_SMTP_TLS_CERT: /data/mailpit_cert.pem
      MP_SMTP_TLS_KEY: /data/mailpit_key.pem
      MP_SMTP_AUTH_FILE: /data/password_file
    networks:
      - xroad-network
  isopenapi:
    image: "ghcr.io/nordic-institute/xrddev-example-restapi:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/v3/api-docs" ]
    networks:
      - xroad-network
  issoap:
    image: "niis/example-adapter:latest"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/example-adapter/Endpoint?wsdl" ]
    networks:
      - xroad-network
    entrypoint: [ "java", "-Xms64m", "-Xmx256m", "-jar", "/example-adapter.war" ]
  isrest:
    image: wiremock/wiremock:latest
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:8080/__admin/health" ]
    networks:
      - xroad-network
    volumes:
      - ./wiremock_mappings:/home/wiremock/mappings
  hurl:
    build:
        context: hurl
        dockerfile: ./Dockerfile
    command: >
      --insecure
      --variables-file /hurl-src/vars.env
      --variable ss0_host=${PROXY_UI_0}
      --variable ss1_host=${PROXY_UI_1}
      --variable ss0_proxy=${PROXY_0}
      --variable ss1_proxy=${PROXY_1}
      --file-root /hurl-files
      /hurl-src/setup.hurl
      --very-verbose
      --retry 12
      --retry-interval 10000
    deploy:
      resources:
        reservations:
          memory: 24M
        limits:
          memory: 128M
    networks:
      - xroad-network
    volumes:
      - ca-volume:/hurl-files/ca
    depends_on:
      cs:
        condition: service_healthy
      testca:
        condition: service_healthy
      isopenapi:
        condition: service_healthy
      issoap:
        condition: service_healthy
      isrest:
        condition: service_healthy

  db-ds-issuer-service:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_issuer_service_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-issuer-service
    networks:
      - xroad-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-issuer-service:
    image: ${DS_ISSUER_SERVICE_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=ds-issuer-service
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST=configuration-client
      # admin permissions required to create schema on startup
      - XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-issuer-service:5432/ds-issuer-service
      - XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_PASSWORD=ds_issuer_service_admin_secret
      - EDC_IAM_OAUTH2_JWKS_URL=http://mock-jwks-server:8080/jwks.json
      - EDC_IAM_DID_WEB_USE_HTTPS=false # Identity hub hosts DID over http
      - EDC_ENCRYPTION_STRICT=false
      - DEBUG=true
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:6181/api/check/health" ]
    networks:
      - xroad-network
    ports:
      - "0:6182" # identity API
      - "0:6183" # DID resolution
      - "0:6185" # issuance API
      - "0:6186" # admin API
      - "0:6187" # statuslist API
      - "0:9999" # debug port
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 320M
    depends_on:
      db-ds-issuer-service:
        condition: service_healthy
      mock-jwks-server:
        condition: service_healthy
      openbao:
        condition: service_healthy
      configuration-client:
        condition: service_healthy

  mock-jwks-server:
    image: python:3.11-alpine
    command: >
      sh -c "
        mkdir -p  /tmp/jwks &&
        echo '{\"keys\":['$(cat /jwks/public_key.json)']}' > /tmp/jwks/jwks.json &&
        python3 -m http.server 8080 --directory /tmp/jwks
      "
    ports:
      - "0:8080"
    networks:
      - xroad-network
    healthcheck:
      interval: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/jwks.json"]
    volumes:
      - ./jwks/:/jwks

### BEGIN consider reusing cs's configuration-client once containerized deployment is supported
  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    networks:
      - xroad-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  anchor-init:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        set -e
        CS="https://cs:4000"
        JAR="$$(mktemp)"
        echo "anchor-init: waiting for Central Server.."
        until curl -sfk -o /dev/null "$$CS"; do sleep 3; done
        for i in $$(seq 1 60); do
          rm -f "$$JAR"
          curl -sk -c "$$JAR" -o /dev/null "$$CS" || { sleep 5; continue; }
          XSRF="$$(awk '/XSRF-TOKEN/{print $$7}' "$$JAR")"
          code="$$(curl -sk -b "$$JAR" -c "$$JAR" -o /dev/null -w '%{http_code}' \
            -X POST "$$CS/login" --data 'username=xrd' --data 'password=secret123!' \
            -H "X-XSRF-TOKEN: $$XSRF")"
          if [ "$$code" != "200" ]; then echo "anchor-init: login HTTP $$code, retrying.."; sleep 5; continue; fi
          XSRF="$$(awk '/XSRF-TOKEN/{print $$7}' "$$JAR")"
          code="$$(curl -sk -b "$$JAR" -c "$$JAR" -o /anchor/configuration-anchor.xml -w '%{http_code}' \
            "$$CS/api/v1/configuration-sources/INTERNAL/anchor/download" -H "X-XSRF-TOKEN: $$XSRF")"
          if [ "$$code" = "200" ] && [ -s /anchor/configuration-anchor.xml ]; then
            echo "anchor-init: anchor downloaded"; exit 0
          fi
          echo "anchor-init: anchor download HTTP $$code (signing key may not exist yet), retrying.."
          sleep 5
        done
        echo "anchor-init: FAILED to download configuration anchor"; exit 1
    networks:
      - xroad-network
    volumes:
      - ds-anchor:/anchor
    deploy:
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M

  configuration-client:
    image: ${CONFIGURATION_CLIENT_IMG}
    pull_policy: always
    environment:
      - DEBUG=true
      - XROAD_HOST=configuration-client
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_CONFIGURATION_CLIENT_CONFIGURATION_ANCHOR_STORAGE=FILE
      - XROAD_CONFIGURATION_CLIENT_CONFIGURATION_ANCHOR_FILE=/anchor/configuration-anchor.xml
      - QUARKUS_DATASOURCE_ACTIVE=false
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xroad-network
    volumes:
      - ds-anchor:/anchor
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 320M
    depends_on:
      openbao:
        condition: service_healthy
      anchor-init:
        condition: service_completed_successfully
### END consider reusing cs's configuration-client once containerized deployment is supported
volumes:
  ca-volume:
  ds-anchor:
networks:
  xroad-network:
    name: xroad-network
    external: true
