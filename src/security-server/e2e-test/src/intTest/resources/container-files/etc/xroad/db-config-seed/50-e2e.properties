# Publish the co-located Issuer Service DID under the `cs` host so security
# servers on the compose network can resolve it (default is localhost).
xroad.dataspace.issuer.host=cs
# Management requests from all security servers reach the CS through ss0's IP;
# the default 10/minute budget throttles scenarios that register and clean up
# several clients in a row.
xroad.management-service.rate-limit-requests-per-minute=1000
