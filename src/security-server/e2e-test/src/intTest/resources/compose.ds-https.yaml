services:
  ds-https-keystore-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -euo pipefail
        cd /keystore
        [ -f ds-https.p12 ] && [ -f cacerts ] && exit 0
        apk add --no-cache openssl
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout ds-https-key.pem -out ds-https-cert.pem \
          -subj "/CN=xrd-ds" \
          -addext "subjectAltName=DNS:ds-issuer-service,DNS:ds-identity-hub,DNS:ds-control-plane,DNS:ss0-ds-identity-hub,DNS:ss1-ds-identity-hub,DNS:ss0-ds-control-plane,DNS:ss1-ds-control-plane,DNS:xrd-ss0,DNS:xrd-ss1,DNS:localhost"
        openssl pkcs12 -export -out ds-https.p12 -inkey ds-https-key.pem -in ds-https-cert.pem \
          -name ds-https -password pass:changeit
        cp /opt/java/openjdk/lib/security/cacerts cacerts
        chmod u+w cacerts
        keytool -import -trustcacerts -noprompt -alias ds-https -file ds-https-cert.pem \
          -keystore cacerts -storepass changeit
        chmod 0644 ds-https.p12 cacerts ds-https-cert.pem
    volumes:
      - ds-https-keystore:/keystore
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

volumes:
  ds-https-keystore:
    external: true
    name: e2e-ds-https-keystore
