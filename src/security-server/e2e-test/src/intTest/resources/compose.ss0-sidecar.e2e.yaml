services:
  sidecar:
    image: ${SIDECAR_IMG:-xroad-security-server-sidecar:8.0.0}
    environment:
      - XROAD_ADMIN_USER=xrd
      - XROAD_ADMIN_PASSWORD=secret123!
      # e2e-config.sh (mounted below) derives xroad.proxy.dsp.serverproxy-endpoint's host from this.
      - XROAD_DSP_SERVERPROXY_HOSTNAME=${XROAD_DSP_SERVERPROXY_HOSTNAME:-xrd-ss0}
      # The admin-service's data space participant-context provisioning worker needs this on every
      # scheduled tick, not only for DSP-specific scenarios: identity-hub-url has no built-in default,
      # so leaving it unset fails every tick with a NullPointerException instead of just leaving data
      # space credentials unprovisioned. The identity-hub URL points at the identity hub's DID
      # resolution port (7183), which in the sidecar is served by this container under its own
      # ds-identity-hub network alias.
      - XROAD_DATASPACE_IDENTITY_HUB_URL=https://${SS_NAME:-ss0}-ds-identity-hub:7183
    volumes:
      - ./container-files/etc/xroad/entrypoint.d:/etc/xroad/entrypoint.d:ro
    deploy:
      resources:
        reservations:
          memory: 1536M
        limits:
          memory: 6144M
    # Declared statically here (container creation time), not attached afterwards via the Docker API,
    # so every alias resolves as soon as the container exists rather than only once the sidecar's slow
    # cold start finishes. The one container answers to every alias the multi-container stack spreads
    # across its ui, proxy, signer, configuration-client, ds-control-plane and ds-identity-hub services,
    # plus the xrd-<name> alias counterparties reach it on, which is also its registered address.
    networks:
      xroad-network:
        aliases:
          - ${SS_NAME:-ss0}-ui
          - ${SS_NAME:-ss0}-proxy
          - ${SS_NAME:-ss0}-signer
          - ${SS_NAME:-ss0}-configuration-client
          - ${SS_NAME:-ss0}-ds-control-plane
          - ${SS_NAME:-ss0}-ds-identity-hub
          - xrd-${SS_NAME:-ss0}

networks:
  xroad-network:
    name: xroad-network
    external: true
