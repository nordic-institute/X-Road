services:
  config-seed-opmonitor:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 <<'SQL'
        INSERT INTO configuration_properties (property_key, property_value, created_at, updated_at) VALUES
        ('xroad.proxy.addon.op-monitor.enabled', 'true', now(), now()),
        ('xroad.proxy.addon.op-monitor.connection.scheme', 'https', now(), now()),
        ('xroad.op-monitor.records-available-timestamp-offset-seconds', '1', now(), now()),
        ('xroad.op-monitor.scheme', 'https', now(), now()),
        ('xroad.op-monitor.tls.client-certificate-refresh-interval', '60S', now(), now())
        ON CONFLICT DO NOTHING;
        SQL
    networks:
      - xrd-ss-network
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M

  proxy:
    depends_on:
      config-seed-opmonitor:
        condition: service_completed_successfully
      op-monitor:
        condition: service_healthy

  db-opmonitor:
    image: ${POSTGRES_DEV_IMG}
    pull_policy: always
    environment:
      - POSTGRES_DB=op-monitor
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=opmonitor
    networks:
      - xrd-ss-network
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "pg_isready -U opmonitor -d op-monitor -h localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-opmonitor-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - JDBC_USER=opmonitor
      - JDBC_PASSWORD=secret
      - CHANGELOG=op-monitor
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=opmonitor
    depends_on:
      db-opmonitor:
        condition: service_healthy
    networks:
      - xrd-ss-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  op-monitor:
    image: ${OP_MONITOR_IMG}
    pull_policy: always
    environment:
      - QUARKUS_LOG_LEVEL=INFO
      - XROAD_HOST=op-monitor
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_USERNAME=opmonitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xrd-ss-network
    depends_on:
      db-opmonitor-init:
        condition: service_completed_successfully
      config-seed-opmonitor:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 96M
        limits:
          memory: 512M
