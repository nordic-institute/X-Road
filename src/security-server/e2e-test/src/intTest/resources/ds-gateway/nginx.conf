# L4 front for the Security Server's GlobalConf-registered address (the xrd-ssN alias
# this container owns on xroad-network): counterparties derive every port of this server
# from that one address, but the backends live in separate containers.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # X-Road message exchange (server proxy + OCSP), previously served by the proxy
    # container holding the alias itself.
    server {
        listen 5500;
        proxy_pass proxy:5500;
    }
    server {
        listen 5577;
        proxy_pass proxy:5577;
    }
    # DSP surface derived from the registered address (XRDADR-41): DID resolution and
    # the control-plane DSP endpoint. TLS passes through; the ds-* containers terminate.
    server {
        listen 7183;
        proxy_pass ds-identity-hub:7183;
    }
    server {
        listen 8183;
        proxy_pass ds-control-plane:8183;
    }
}
