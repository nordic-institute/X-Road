# L4 front for the Security Server's GlobalConf-registered address (the xrd-ssN alias
# this container owns on xroad-network): counterparties derive every port of this server
# from that one address, but the backends live in separate containers.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Upstreams ride variables (stream has no `set`, hence `map`) so nginx re-resolves them
    # through Docker's embedded DNS at proxy time instead of once at startup — a restarted
    # backend container with a new IP keeps working.
    resolver 127.0.0.11 valid=10s;
    map "" $upstream_proxy_5500        { default proxy:5500; }
    map "" $upstream_proxy_5577        { default proxy:5577; }
    map "" $upstream_identity_hub_7183 { default ds-identity-hub:7183; }
    map "" $upstream_control_plane_8183 { default ds-control-plane:8183; }

    # X-Road message exchange (server proxy + OCSP), previously served by the proxy
    # container holding the alias itself.
    server {
        listen 5500;
        proxy_pass $upstream_proxy_5500;
    }
    server {
        listen 5577;
        proxy_pass $upstream_proxy_5577;
    }
    # DSP surface derived from the registered address (XRDADR-41): DID resolution and
    # the control-plane DSP endpoint. TLS passes through; the ds-* containers terminate.
    server {
        listen 7183;
        proxy_pass $upstream_identity_hub_7183;
    }
    server {
        listen 8183;
        proxy_pass $upstream_control_plane_8183;
    }
}
