services:
  db-ds-control-plane:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_control_plane_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-control-plane
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U postgres -h localhost; do
          echo 'Waiting for PostgreSQL to be ready...'
          sleep 1
        done;

        psql -U postgres -d ds-control-plane -c \"
          DO \\\$\$
          BEGIN
            IF NOT EXISTS (
              SELECT FROM pg_catalog.pg_roles WHERE rolname = 'ds_control_plane'
            ) THEN
              CREATE ROLE ds_control_plane LOGIN PASSWORD 'secret';
            END IF;
          END
          \\\$\$;
        \"
        wait
      "
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost && psql -U postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='ds_control_plane'\" | grep -q 1" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-ds-identity-hub:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_identity_hub_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-identity-hub
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U postgres -h localhost; do
          echo 'Waiting for PostgreSQL to be ready...'
          sleep 1
        done;

        psql -U postgres -d ds-identity-hub -c \"
          DO \\\$\$
          BEGIN
            IF NOT EXISTS (
              SELECT FROM pg_catalog.pg_roles WHERE rolname = 'ds_identity_hub'
            ) THEN
              CREATE ROLE ds_identity_hub LOGIN PASSWORD 'secret';
            END IF;
          END
          \\\$\$;
        \"
        wait
      "
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost && psql -U postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='ds_identity_hub'\" | grep -q 1" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-ds-control-plane-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-ds-control-plane:5432/ds-control-plane
      - JDBC_USER=postgres
      - JDBC_PASSWORD=ds_control_plane_admin_secret
      - CHANGELOG=ds-control-plane
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=ds_control_plane
    depends_on:
      db-ds-control-plane:
        condition: service_healthy
    networks:
      - xrd-ss-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  db-ds-identity-hub-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-ds-identity-hub:5432/ds-identity-hub
      - JDBC_USER=postgres
      - JDBC_PASSWORD=ds_identity_hub_admin_secret
      - CHANGELOG=ds-identity-hub
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=ds_identity_hub
    depends_on:
      db-ds-identity-hub:
        condition: service_healthy
    networks:
      - xrd-ss-network
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  # The ds-* services read their serving certificate from OpenBao's tls/ds-https slot,
  # populated by setup.hurl through this stack's admin API after all stacks are up. Until
  # then they run with their HTTPS endpoints closed and report not-ready, and nothing
  # health-gates on them before the hurl provisioning runs.
  ds-control-plane:
    image: ${DS_CONTROL_PLANE_IMG}
    pull_policy: always
    environment:
      - DEBUG=true
      - HOSTNAME=${ENV_PREFIX:-}ds-control-plane
      - XROAD_HOST=ds-control-plane
      - XROAD_PROXY_DATAPLANE_URL=http://proxy:5590/full/api/v1/dataflows
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-control-plane:5432/ds-control-plane
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_USERNAME=ds_control_plane
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_PASSWORD=secret
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME=serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD=secret
      # Validity in ms (EDC default 900000); 1 ms ~= no cache, so revocation is seen immediately in the test.
      - EDC_IAM_CREDENTIAL_REVOCATION_CACHE_VALIDITY=1
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:4099/q/health" ]
    networks:
      xrd-ss-network: {}
      xroad-network:
        aliases:
          - ${ENV_PREFIX:-}ds-control-plane
    ports:
      - "0:8183" # protocol, /api/dsp
      - "0:9999" # debug port
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    depends_on:
      db-ds-control-plane-init:
        condition: service_completed_successfully
      configuration-client:
        condition: service_healthy
      config-seed-e2e:
        condition: service_completed_successfully

  ds-identity-hub:
    image: ${DS_IDENTITY_HUB_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=${ENV_PREFIX:-}ds-identity-hub
      - XROAD_HOST=ds-identity-hub
      - EDC_IH_DID_PUBLIC_HOSTNAME=${SS_ADDRESS:-xrd-ss}
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-identity-hub:5432/ds-identity-hub
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_USERNAME=ds_identity_hub
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_PASSWORD=secret
      - DEBUG=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-fk", "https://localhost:7181/api/check/health" ]
    networks:
      xrd-ss-network: {}
      xroad-network:
        aliases:
          - ${ENV_PREFIX:-}ds-identity-hub
    ports:
      - "0:7183" # DID resolution
      - "0:7185" # credentials API
      - "0:9999" # debug port
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    depends_on:
      db-ds-identity-hub-init:
        condition: service_completed_successfully
      config-seed-e2e:
        condition: service_completed_successfully

  # Owns this Security Server's GlobalConf-registered address (xrd-ssN) on the shared
  # network and fans its ports out per backend: 5500/5577 to the proxy, 7183 to the
  # identity hub (DID resolution), 8183 to the control plane (DSP). Counterparties derive
  # all of these from the one registered address (XRDADR-41), so they must be served there.
  ds-gateway:
    image: ${DS_GATEWAY_IMG}
    environment:
      - DS_GATEWAY_PROXY_HOST=proxy
      - DS_GATEWAY_RESOLVER=127.0.0.11
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5500"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      xrd-ss-network: {}
      xroad-network:
        aliases:
          - ${SS_ADDRESS:-xrd-ss}
    deploy:
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M
    # service_started (not healthy): nginx only needs the backends' DNS entries to exist
    # when it resolves upstreams at startup.
    depends_on:
      proxy:
        condition: service_started
      ds-control-plane:
        condition: service_started
      ds-identity-hub:
        condition: service_started

networks:
  xroad-network:
    name: xroad-network
    external: true
