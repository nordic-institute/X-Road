services:
  # Obtains a testca-signed DS TLS certificate and writes it into this SS stack's own OpenBao
  # (the same one ds-control-plane / ds-identity-hub read via XROAD_SECRET_STORE_HOST=openbao
  # below), before either service starts. testca itself lives in the aux stack (a separate
  # compose project); it's reachable here only through the shared external xroad-network, hence
  # this service joining both networks like ds-control-plane / ds-identity-hub already do.
  ds-tls-cert-init:
    image: eclipse-temurin:21-jre-alpine
    entrypoint: [ "sh", "-c" ]
    environment:
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
    command:
      - |
        set -euo pipefail
        apk add --no-cache openssl curl sed >/dev/null
        workdir="$$(mktemp -d)"
        cd "$$workdir"
        openssl genrsa -out ds-https-key.pem 2048
        openssl req -new -key ds-https-key.pem -out ds-https.csr -subj "/CN=xrd-ds" \
          -addext "subjectAltName=DNS:ds-issuer-service,DNS:ds-identity-hub,DNS:ds-control-plane,DNS:${ENV_PREFIX:-}ds-identity-hub,DNS:${ENV_PREFIX:-}ds-control-plane,DNS:localhost"
        curl -fsS -X POST -F "type=auth" -F "certreq=@ds-https.csr" "http://testca:8888/testca/sign" -o ds-https-cert.pem
        curl -fsS "http://testca:8888/testca/certs/ca.cert.pem" -o ds-https-ca.pem
        cert_content=$$(cat ds-https-cert.pem ds-https-ca.pem | sed ':a;N;$$!ba;s/\n/\\n/g')
        key_content=$$(sed ':a;N;$$!ba;s/\n/\\n/g' ds-https-key.pem)
        payload="{\"certificate\": \"$${cert_content}\", \"privateKey\": \"$${key_content}\"}"
        curl -fsS -X POST \
          -H "X-Vault-Token: $${XROAD_SECRET_STORE_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$$payload" \
          "http://openbao:8200/v1/xrd-secret/tls/ds-https"
    networks:
      xrd-ss-network: {}
      xroad-network: {}
    depends_on:
      openbao:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M


  db-ds-control-plane:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_control_plane_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-control-plane
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-ds-identity-hub:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_identity_hub_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-identity-hub
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-control-plane:
    image: ${DS_CONTROL_PLANE_IMG}
    pull_policy: always
    environment:
      - DEBUG=true
      - HOSTNAME=${ENV_PREFIX:-}ds-control-plane
      - XROAD_HOST=ds-control-plane
      - XROAD_DSP_PARTICIPANT_CONTEXT_ID=${DSP_PARTICIPANT_ID:-xrd-ss}
      # Interpolated into edc.iam.trusted-issuer.issuer.id by the packaged application.yaml: the EDC
      # key is hyphenated, so an env var can only reach it through an X-Road key the yaml declares.
      - XROAD_EDC_IAM_TRUSTED_ISSUER_ISSUER_ID=did:web:cs%3A6183:issuer
      - XROAD_PROXY_DATAPLANE_URL=http://proxy:5590/full/api/v1/dataflows
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      # admin permissions required to create schema on startup
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-control-plane:5432/ds-control-plane
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_PASSWORD=ds_control_plane_admin_secret
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME=serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD=secret
      - EDC_DSP_CALLBACK_ADDRESS=https://${ENV_PREFIX:-}ds-control-plane:8183/api/dsp/%s
      # Validity in ms (EDC default 900000); 1 ms ~= no cache, so revocation is seen immediately in the test.
      - EDC_IAM_CREDENTIAL_REVOCATION_CACHE_VALIDITY=1
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:4099/q/health" ]
    networks:
      xrd-ss-network: {}
      xroad-network:
        aliases:
          - ${ENV_PREFIX:-}ds-control-plane
    ports:
      - "0:8181"
      - "0:8183" # protocol, /api/dsp
      - "0:8184" # control, /api/control
      - "0:9999" # debug port
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    depends_on:
      db-ds-control-plane:
        condition: service_healthy
      configuration-client:
        condition: service_healthy
      ds-tls-cert-init:
        condition: service_completed_successfully

  ds-identity-hub:
    image: ${DS_IDENTITY_HUB_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=${ENV_PREFIX:-}ds-identity-hub
      - XROAD_HOST=ds-identity-hub
      - EDC_IH_DID_PUBLIC_HOSTNAME=${ENV_PREFIX:-}ds-identity-hub
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      # admin permissions required to create schema on startup
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-identity-hub:5432/ds-identity-hub
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_PASSWORD=ds_identity_hub_admin_secret
      - DEBUG=true
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-fk", "https://localhost:7181/api/check/health" ]
    networks:
      xrd-ss-network: {}
      xroad-network:
        aliases:
          - ${ENV_PREFIX:-}ds-identity-hub
    ports:
      - "0:7183" # DID resolution
      - "0:7185" # credentials API
      - "0:9999" # debug port
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    depends_on:
      db-ds-identity-hub:
        condition: service_healthy
      ds-tls-cert-init:
        condition: service_completed_successfully

networks:
  xroad-network:
    name: xroad-network
    external: true
