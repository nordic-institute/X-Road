services:
  proxy:
    environment:
      - XROAD_PROXY_MESSAGE_LOG_TIMESTAMPER_TIMESTAMP_IMMEDIATELY=true
      - XROAD_PROXY_DSP_SERVERPROXY_ENDPOINT=https://${DSP_PARTICIPANT_ID:-xrd-ss}:5500
      - XROAD_COMMON_GLOBAL_CONF_REFRESH_RATE=10S
  configuration-client:
    environment:
      - XROAD_CONFIGURATION_CLIENT_UPDATE_INTERVAL=10
  ui:
    environment:
      - XROAD_PROXY_UI_API_DATASPACE_ENABLED=true
      - XROAD_PROXY_UI_API_DATASPACE_IDENTITY_HUB_URL=https://${ENV_PREFIX:-}ds-identity-hub:7182
      - XROAD_PROXY_UI_API_DATASPACE_PARTICIPANT_ID=${DSP_PARTICIPANT_ID:-xrd-ss}
      - XROAD_PROXY_UI_API_DATASPACE_MANAGEMENT_CONTEXT_ENABLED=${DSP_MGMT_CONTEXT:-false}
      - XROAD_PROXY_UI_API_DATASPACE_ISSUER_DID=did:web:cs%3A6183:issuer
  db-messagelog:
    ports:
      - "0:5432"
