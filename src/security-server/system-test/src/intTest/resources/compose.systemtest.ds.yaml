services:
  db-ds-control-plane:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_control_plane_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-control-plane
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-control-plane:
    image: ${DS_CONTROL_PLANE_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=ds-control-plane
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST=configuration-client
      # admin permissions required to create schema on startup
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-control-plane:5432/ds-control-plane
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_PASSWORD=ds_control_plane_admin_secret
      - EDC_IAM_OAUTH2_JWKS_URL=http://mock-jwks-server:8080/jwks.json
      - EDC_PARTICIPANT_ID=did:web:ds-identity-hub%3A10100
      - EDC_IAM_ISSUER_ID=did:web:ds-identity-hub%3A10100
      - EDC_IAM_STS_OAUTH_CLIENT_ID=did:web:ds-identity-hub%3A10100
      - EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS=did:web:ds-identity-hub%3A10100-sts-client-secret
      - EDC_IAM_DID_WEB_USE_HTTPS=false # Identity hub hosts DID over http
      - DEBUG=true
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    networks:
      - xrd-ss-network
    ports:
        - "0:8181"
        - "0:8182" # management, /api/mgmt
        - "0:8183" # protocol, /api/dsp
        - "0:8184" # control, /api/control
        - "0:9999" # debug port
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 320M
    depends_on:
      db-ds-control-plane:
        condition: service_healthy
      configuration-client:
        condition: service_healthy
      mock-jwks-server:
        condition: service_healthy
      ds-identity-hub:
        condition: service_healthy

  db-ds-identity-hub:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    environment:
      - POSTGRES_PASSWORD=ds_identity_hub_admin_secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ds-identity-hub
    networks:
      - xrd-ss-network
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  ds-identity-hub:
    image: ${DS_IDENTITY_HUB_IMG}
    pull_policy: always
    environment:
      - HOSTNAME=ds-identity-hub
      - EDC_IH_DID_PUBLIC_HOSTNAME=ds-identity-hub
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      # admin permissions required to create schema on startup
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-ds-identity-hub:5432/ds-identity-hub
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_USERNAME=postgres
      - XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_PASSWORD=ds_identity_hub_admin_secret
      - EDC_IAM_OAUTH2_JWKS_URL=http://mock-jwks-server:8080/jwks.json
      - EDC_IAM_DID_WEB_USE_HTTPS=false # Identity hub hosts DID over http
      - EDC_ENCRYPTION_STRICT=false # implicitly enabled - requires extra overhead of having AES key present in OpenBao
      - DEBUG=true
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:8181/api/check/health" ]
    ports:
      - "0:9999" # debug port
      - "0:8182" # identity hub management API
    depends_on:
      db-ds-identity-hub:
        condition: service_healthy
      mock-jwks-server:
        condition: service_healthy

  mock-jwks-server:
    image: python:3.11-alpine
    command: >
      sh -c "
        mkdir -p  /tmp/jwks &&
        echo '{\"keys\":['$(cat /jwks/public_key.json)']}' > /tmp/jwks/jwks.json &&
        python3 -m http.server 8080 --directory /tmp/jwks
      "
    ports:
      - "0:8080"
    networks:
      - xrd-ss-network
    healthcheck:
      interval: 5s
      retries: 3
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/jwks.json"]
    volumes:
      - ./container-files/jwks/:/jwks
