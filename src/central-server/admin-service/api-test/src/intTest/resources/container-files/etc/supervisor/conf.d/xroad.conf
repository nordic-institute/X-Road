[supervisord]
user=root

[program:postgres]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main -c config_file=/etc/postgresql/18/main/postgresql.conf
user=postgres
stopsignal=INT
stopwaitsecs=30
autorestart=unexpected
priority=100

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=unexpected
priority=100

[program:openbao]
command=/usr/bin/bao server -config=/etc/openbao/openbao.hcl
user=openbao
autorestart=true
stopsignal=INT
stopwaitsecs=30
priority=120

[program:xroad-secret-store-local]
command=/usr/share/xroad/scripts/secret-store-init.sh
autorestart=false
exitcodes=0
priority=150

[program:xroad-center]
command=/usr/share/xroad/scripts/wait-for-secret-store.sh /usr/share/xroad/bin/xroad-centralserver-admin-service
user=xroad
autorestart=true
priority=300

; No xroad-ds-issuer-service on this stack: the admin-service's vault here is MockServer
; (application-int-test.yml), so a DS TLS upload through the API can never reach the
; issuer's real in-pod OpenBao — the slot it serves from would stay empty forever, and
; nothing in this suite consumes the issuer's endpoints. The DS TLS API tests drive the
; mocked slot directly.
