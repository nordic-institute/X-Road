xroad.admin-service.rate-limit-requests-per-second=100
xroad.admin-service.rate-limit-requests-per-minute=1000
xroad.admin-service.global-configuration-generation-rate-in-seconds=99999
xroad.admin-service.key-management-api-whitelist=0.0.0.0/0, ::/0
xroad.admin-service.cache-api-key-ttl=1
# 'cs-admin-service' (the compose service name), not 'localhost': the DS TLS ACME worker's HTTP-01 challenge
# must be reachable by the testca container through the real public nginx, which only resolves other
# containers by their compose service name.
xroad.dataspace.issuer.host=cs-admin-service
xroad.admin-service.acme-challenge-port-enabled=true
# the default (3600s) leaves the DS TLS ACME renewal worker idle for up to an hour once it settles into
# normal cadence after its first cycle, which no test can wait out.
xroad.admin-service.acme-renewal-interval=15
# the DS TLS ACME account (CentralServerDsTlsAcmeHostContext.DS_TLS_ACME_ALIAS) supplies no contact - the
# test CA's [Account] contact_check_disable is set for exactly this reason (see development/acme2certifier).
# EAB credentials are keyed by the CA's own globalconf-independent name, so "Test DS TLS CA" here only needs
# to match the name used when designating the CA through the admin API in the test itself.
xroad.admin-service.acme={"eab-credentials":{"certificate-authorities":{"Test DS TLS CA":{"mac-key-base64-encoded":true,"members":{"dataspace-tls":{"kid":"keyid_4","mac-key":"d1e4f9c6a8b53d2e7f0c1a4b8d3e6f9c2a5b8d1e4f7a0c3b6d9e2f5a8b1c4d7e"}}}}}}
