services:
  cs-admin-service:
    build:
      context: ./container-files/
      args:
        - CS_IMG=${CS_IMG}
      dockerfile: Dockerfile
    pull_policy: always
    environment:
      - XROAD_HOST=localhost
      - XROAD_COMMON_RPC_USE_TLS=false
    ports:
      - "0:4000"
      - "0:5432"
      - "0:6183"
      - "0:6185"
      - "0:6187"
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4000" ]
    deploy:
      resources:
        reservations:
          memory: 768M
        limits:
          memory: 3072M

  mock-server:
    image: mockserver/mockserver:mockserver-7.4.0
    ports:
      - "0:1080"
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
