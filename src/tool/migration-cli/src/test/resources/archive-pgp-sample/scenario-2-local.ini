# Scenario 2: Member-level grouping
# Each member has dedicated encryption key

[message-log]
archive-encryption-enabled = true
archive-grouping = member
archive-gpg-home-directory = src/test/resources/archive-pgp-sample/scenario-2-member-grouping/gpghome
archive-default-encryption-key = FBA2E67AD8988E02
archive-encryption-keys-config = src/test/resources/archive-pgp-sample/scenario-2-mapping.ini
timestamping-prioritization-strategy = paid_first
message-body-logging = false
clean-transaction-batch = 5000

# Note: The archive-encryption-keys-config should point to the mapping file
# In production, copy scenario-2-mapping.ini to the configured location
# For testing, use the relative path or adjust to your test setup

[proxy-ui-api]
authentication-key-algorithm = ec
signing-key-algorithm = rsa

[signer]
ocsp-prioritization-strategy = only_free
client-timeout = 50000
