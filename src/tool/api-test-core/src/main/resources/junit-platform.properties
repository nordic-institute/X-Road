# Randomized class + method ordering is the suite default so test order can never matter:
# any inter-test ordering coupling surfaces as a failure instead of passing by accident.
# The seed is printed to the run log; pin junit.jupiter.execution.order.random.seed to reproduce a shuffle.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random

# Parallel execution for the main API pool (intTest task).
# Destructive tests opt out individually via @Execution(SAME_THREAD) on SsDestructiveTest.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
