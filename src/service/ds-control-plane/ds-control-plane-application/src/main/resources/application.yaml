quarkus:
  application:
    name: ds-control-plane
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
  log:
    level: INFO
    category:
      "EDC-MONITOR":
        level: DEBUG

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/conf.d/local-ds-control-plane.yaml
        - /etc/xroad/db.properties
    log:
      console:
        enabled: false
      file:
        enabled: true
        path: /var/log/xroad/ds-control-plane.log

web:
  http:
    port: 8181
    protocol:
      port: ${xroad.dsp.dsp-port}
      path: /api/dsp
      virtual: true
    signaling:
      port: 8185

xroad:
  edc:
    boot:
      # Upstream DataPlaneSignalingApiExtension also mounts a data-plane registration REST controller;
      # XRoadDataPlaneSignalingApiExtension replaces it with the transfer API only. The
      # DataPlaneInstanceStore (XRoadDataPlaneStoreExtension) is computed from the xroad.cp.dataplane
      # configuration and has no write path, so a registration endpoint would have nothing to write to.
      # JettyExtension is also excluded: its jetty-core artifact is excluded from the runtime classpath
      # entirely (see xroad.edc-owned-jetty-conventions), so this setting is defense in depth, not the
      # only thing standing between it and boot.
      excluded-service-extensions: >-
        org.eclipse.edc.signaling.DataPlaneSignalingApiExtension,
        org.eclipse.edc.web.jetty.JettyExtension
  ds:
    rpc:
      host: "0.0.0.0"
      port: 5461
  db:
    serverconf:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}
  cp:
    dataplane:
      proxy:
        id: "xroad-proxy"
        url: "${XROAD_PROXY_DATAPLANE_URL:http://127.0.0.1:5590/full/api/v1/dataflows}"
        enabled: true
        allowed-source-types: http,https
        allowed-transfer-types: Xrd-PULL

edc:
  hostname: ${HOSTNAME:localhost}
  dataspace:
    enable:
      profiles:
        # Every participant context served by this runtime may use every registered
        # profile (X-Road registers a single default profile). EDC virtual DSP
        # controllers otherwise require a per-participant edc.dataspace.profiles
        # association and reject DSP requests with 404.
        all: true
  vault:
    hashicorp:
      url: "${XROAD_SECRET_STORE_SCHEME:https}://${XROAD_SECRET_STORE_HOST:127.0.0.1}:${XROAD_SECRET_STORE_PORT:8200}"
      token: "${XROAD_SECRET_STORE_TOKEN}"
      # EDC HashicorpVaultClient hardcodes a "data" segment between secretPath
      # and folderPath/key (KV v2 semantics). The KV v2 mount path therefore
      # IS the secretPath value; per-service partitioning lives under folder.
      # New mount xrd-ds-secret/ is provisioned as KV v2 by secret-store-init.sh,
      # separate from the KV v1 xrd-secret/ mount used by Quarkus services.
      folder: ds
      api:
        secret:
          path: /v1/xrd-ds-secret
  # A send retry limit of L gives L+1 attempts. TaskPollExecutor drops a task after 4 attempts,
  # so the limit must stay at 3 or below for EDC to end a failed negotiation or transfer first.
  negotiation:
    send:
      retry:
        limit: 1
  transfer:
    send:
      retry:
        limit: 1
  component:
    id: DSP-compatibility-test
  datasource:
    default:
      url: ${xroad.db.ds-control-plane.hibernate.connection.url}
      user: ${xroad.db.ds-control-plane.hibernate.connection.username}
      password: ${xroad.db.ds-control-plane.hibernate.connection.password}
  sql:
    schema:
      autocreate: true
  iam:
    dcp:
      scopes:
        membership:
          id: "membership-scope"
          type: "DEFAULT"
          value: "org.eclipse.dspace.dcp.vc.type:XRoadMembershipCredential:read"
