quarkus:
  application:
    name: ds-control-plane
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
  log:
    level: INFO
    category:
      "EDC":
        level: DEBUG

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties
    log:
      console:
        enabled: false
      file:
        enabled: true
        path: /var/log/xroad/ds-control-plane.log

web:
  http:
    port: 8181
    management:
      port: 8182
    protocol:
      port: 8183
      path: /api/dsp
    control:
      port: 8184

edc:
  hostname: ${HOSTNAME:localhost}
  vault:
    hashicorp:
      url: "${XROAD_SECRET_STORE_SCHEME:https}://${XROAD_SECRET_STORE_HOST:127.0.0.1}:${XROAD_SECRET_STORE_PORT:8200}"
      token: "${XROAD_SECRET_STORE_TOKEN}"
      api:
        secret:
          path: /v1/xrd-secret/ds
  component:
    id: DSP-compatibility-test
  transfer:
    proxy:
      token:
        signer:
          privatekey:
            alias: private-key
        verifier:
          publickey:
            alias: public-key
  datasource:
    default:
      url: ${xroad.db.ds-control-plane.hibernate.connection.url}
      user: ${xroad.db.ds-control-plane.hibernate.connection.username}
      password: ${xroad.db.ds-control-plane.hibernate.connection.password}
  sql:
    schema:
      autocreate: true
  iam:
    issuer:
      id: "did:web:${HOSTNAME:localhost}%3A7183"
    sts:
      oauth:
        token:
          url: "http://ds-identity-hub:7184/api/sts/token"
        client:
          id: "did:web:${HOSTNAME:localhost}%3A7183"
          secret:
            alias: "did:web:${HOSTNAME:localhost}%3A7183-sts-client-secret"
    oauth2:
      jwks:
        url: https://example.com/jwks
      issuer: test-issuer
    dcp:
      scopes:
        membership:
          id: "membership-scope"
          type: "DEFAULT"
          value: "org.eclipse.edc.vc.type:MembershipCredential:read"
