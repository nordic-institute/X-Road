syntax = "proto3";

package org.niis.xroad.edc.assetaccess.proto;

import "error_handling.proto";

option java_multiple_files = true;

service AssetAccessService {
  rpc Acquire(AcquireAssetAccessReq) returns (AcquireAssetAccessResp);
}

message AcquireAssetAccessReq {
  string participant_context_id = 1;
  string asset_id = 2;
  string counter_party_id = 3;
  string counter_party_address = 4;
  string protocol = 5;
}

message AcquireAssetAccessResp {
  string endpoint = 1;
  optional string authorization = 2;
  optional int64 expires_at_epoch_seconds = 3;
}
