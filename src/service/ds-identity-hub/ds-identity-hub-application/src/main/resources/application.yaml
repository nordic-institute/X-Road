quarkus:
  application:
    name: ds-identity-hub
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
  log:
    level: INFO
    category:
      "EDC":
        level: DEBUG

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties
    log:
      console:
        enabled: false
      file:
        enabled: true
        path: /var/log/xroad/ds-identity-hub.log

web:
  http:
    port: 8181
    path: /api
    identity:
      port: 8182
      path: /api/identity
    credentials:
      port: 10001
      path: /api/credentials
    did:
      port: 10100
      path: /
    sts:
      port: 9292
      path: /api/sts

edc:
  hostname: ${HOSTNAME:localhost}
  vault:
    hashicorp:
      url: "${XROAD_SECRET_STORE_SCHEME:https}://${XROAD_SECRET_STORE_HOST:127.0.0.1}:${XROAD_SECRET_STORE_PORT:8200}"
      token: "${XROAD_SECRET_STORE_TOKEN}"
      api:
        secret:
          path: /v1/xrd-secret/ds
  datasource:
    default:
      url: ${xroad.db.ds-identity-hub.hibernate.connection.url}
      user: ${xroad.db.ds-identity-hub.hibernate.connection.username}
      password: ${xroad.db.ds-identity-hub.hibernate.connection.password}
  sql:
    schema:
      autocreate: true
  iam:
    oauth2:
      jwks:
        url: https://example.com/jwks
      issuer: test-issuer
