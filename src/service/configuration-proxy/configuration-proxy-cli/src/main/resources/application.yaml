quarkus:
  application:
    name: Configuration Proxy CLI util

  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml

  log:
    console:
      enabled: false
    file:
      enabled: true
      path: /var/log/xroad/confproxy.log
    syslog:
      enabled: true
      app-name: configuration-proxy-cli
      format: "%-5p [X-Road Configuration Proxy CLI] %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} - %m"

xroad:
  config:
    # only the shared common defaults are published into this app's config tree;
    # confproxy maps xroad.configuration-client.* itself via @ConfigMapping defaults
    defaults-scopes: xroad.common
  db:
    confproxy:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties

"%containerized":
  quarkus:
    http:
      host-enabled: false

"%test":
  quarkus:
    log:
      file:
        enabled: false
