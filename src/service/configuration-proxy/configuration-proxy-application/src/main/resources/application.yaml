quarkus:
  application:
    name: configuration-proxy
  http:
    host-enabled: true
    ssl:
      protocols: TLSv1.3,TLSv1.2
    ssl-port: 4000
  tls:
    cipher-suites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

  rest:
    path: /api
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
      - /etc/xroad/conf.d/local.yaml
  scheduler:
    start-mode: forced
    enabled: true
  log:
    category:
      "io.grpc":
        level: "INFO"

xroad:
  config:
    # only the shared common defaults are published into this app's config tree;
    # confproxy maps xroad.configuration-client.* itself via @ConfigMapping defaults
    defaults-scopes: xroad.common
  configuration-proxy:
    tls:
      certificate-provisioning:
        common-name: ${XROAD_HOST:localhost}
        ip-subject-alt-names:
          - 127.0.0.1
  db:
    confproxy:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}

"%containerized":
  xroad:
    signer:
      rpc:
        listen-address: 0.0.0.0

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties
    log:
      file:
        enabled: true
        path: /var/log/xroad/confproxy.log

"%test":
  xroad:
    configuration-proxy:
      tls:
        enabled: false
    signer:
      rpc:
        enabled: false
  quarkus:
    http:
      port: 4001
      insecure-requests: enabled
    log:
      file:
        enabled: false
