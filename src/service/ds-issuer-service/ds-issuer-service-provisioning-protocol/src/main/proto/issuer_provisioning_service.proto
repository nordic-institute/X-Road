syntax = "proto3";

package org.niis.xroad.edc.issuer.provisioning.proto;

option java_multiple_files = true;

service IssuerProvisioningService {
  rpc CreateParticipantContext(CreateParticipantContextReq) returns (CreateParticipantContextResp);
  rpc CreateAttestationDefinition(CreateAttestationDefinitionReq) returns (CreateAttestationDefinitionResp);
  rpc CreateCredentialDefinition(CreateCredentialDefinitionReq) returns (CreateCredentialDefinitionResp);
  rpc RevokeCredential(RevokeCredentialReq) returns (RevokeCredentialResp);
}

message CreateParticipantContextReq {
  string participant_context_id = 1;
  string did = 2;
  string issuer_service_url = 3;
  string key_id = 4;
  string private_key_alias = 5;
}

message CreateParticipantContextResp {
}

message CreateAttestationDefinitionReq {
  string participant_context_id = 1;
  string attestation_definition_id = 2;
  string attestation_type = 3;
}

message CreateAttestationDefinitionResp {
}

message CredentialMapping {
  string input = 1;
  string output = 2;
  bool required = 3;
}

message CreateCredentialDefinitionReq {
  string participant_context_id = 1;
  string credential_definition_id = 2;
  string credential_type = 3;
  string format = 4;
  string json_schema = 5;
  string json_schema_url = 6;
  int64 validity_seconds = 7;
  repeated string attestations = 8;
  repeated CredentialMapping mappings = 9;
}

message CreateCredentialDefinitionResp {
}

message RevokeCredentialReq {
  string participant_context_id = 1;
  string xroad_instance = 2;
  string member_class = 3;
  string member_code = 4;
}

message RevokeCredentialResp {
  bool revoked = 1;
}
