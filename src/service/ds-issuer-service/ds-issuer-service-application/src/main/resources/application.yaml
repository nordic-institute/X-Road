quarkus:
  application:
    name: ds-issuer-service
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
  log:
    level: INFO
    category:
      "EDC-MONITOR":
        level: TRACE
  arc:
    unremovable-types:
      - org.niis.xroad.globalconf.GlobalConfProvider

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/conf.d/local-ds-issuer-service.yaml
        - /etc/xroad/db.properties
    log:
      console:
        enabled: false
      file:
        enabled: true
        path: /var/log/xroad/ds-issuer-service.log

web:
  http:
    port: 6181
    path: /api
    identity:
      port: 6182
      path: /api/identity
    did:
      port: 6183
      path: /
    sts:
      port: 6184
      path: /api/sts
    issuance:
      port: 6185
      path: /api/issuance
    issueradmin:
      port: 6186
      path: /api/admin
    statuslist:
      port: 6187
      path: /statuslist

edc:
  hostname: ${HOSTNAME}
  issuance:
    anonymous:
      allowed: true # Bypass mandatory creation of a holder as X-Road credential issuance trust model doesn't require it
  vault:
    hashicorp:
      url: "${XROAD_SECRET_STORE_SCHEME:https}://${XROAD_SECRET_STORE_HOST:127.0.0.1}:${XROAD_SECRET_STORE_PORT:8200}"
      token: "${XROAD_SECRET_STORE_TOKEN}"
      # KV v2 mount xrd-ds-secret; provisioned by secret-store-init.sh.
      # See ds-control-plane application.yaml for path-construction rationale.
      folder: ds
      health:
        check:
          standby:
            ok: true
      api:
        secret:
          path: /v1/xrd-ds-secret
  datasource:
    default:
      url: ${xroad.db.ds-issuer-service.hibernate.connection.url}
      user: ${xroad.db.ds-issuer-service.hibernate.connection.username}
      password: ${xroad.db.ds-issuer-service.hibernate.connection.password}
  sql:
    schema:
      autocreate: true
