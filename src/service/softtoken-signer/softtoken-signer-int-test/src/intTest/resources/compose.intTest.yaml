services:
  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-serverconf:
    image: postgres:18
    environment:
      - POSTGRES_DB=serverconf
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=serverconf
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "serverconf", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-serverconf-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - JDBC_USER=serverconf
      - JDBC_PASSWORD=secret
      - CHANGELOG=serverconf
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=serverconf
    depends_on:
      db-serverconf:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  db-serverconf-config-seed:
    image: postgres:18
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U serverconf; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, created_at, updated_at) VALUES
             ('xroad.common-rpc.use-tls', 'false', now(), now()),
             ('xroad.common-global-conf.source', 'FILESYSTEM', now(), now()),
             ('xroad.common-rpc.channel.signer.deadline-after', '2000', now(), now()),
             ('xroad.softtoken-signer.keys.sync-rate', 'PT2S', now(), now()),
             ('xroad.softtoken-signer.health-check.key-sync.max-sync-age', 'PT10S', now(), now()),
             ('xroad.softtoken-signer.health-check.key-sync.max-consecutive-failures', '3', now(), now())
           ON CONFLICT DO NOTHING;"
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M

  signer:
    image: ${SIGNER_IMG}
    pull_policy: always
    environment:
      - XROAD_HOST=signer
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME=serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD=secret
      - QUARKUS_LOG_LEVEL=INFO
      - QUARKUS_LOG_CATEGORY__ORG_NIIS_XROAD_SIGNER__LEVEL=DEBUG
    ports:
      - "0:9999"  # debug port
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health/live" ]
    depends_on:
      db-serverconf-config-seed:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 96M
        limits:
          memory: 512M
    volumes:
      - ./signer-container-files/etc/xroad/globalconf:/etc/xroad/globalconf

  softtoken-signer:
    image: ${SOFTTOKEN_SIGNER_IMG}
    pull_policy: always
    environment:
      - XROAD_HOST=softtoken-signer
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - QUARKUS_LOG_LEVEL=INFO
      - QUARKUS_LOG_CATEGORY__ORG_NIIS_XROAD_SIGNER_SOFTTOKEN__LEVEL=DEBUG
    ports:
      - "0:9999"  # debug port
      - "0:4099"  # health endpoint
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:4099/q/health/live" ]
    depends_on:
      signer:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
