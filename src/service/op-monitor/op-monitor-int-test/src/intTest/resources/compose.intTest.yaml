services:
  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
  op-monitor:
    image: ${OP_MONITOR_IMG}
    pull_policy: always
    environment:
      - XROAD_HOST=op-monitor
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_COMMON_RPC_USE_TLS=false
      - XROAD_COMMON_GLOBAL_CONF_SOURCE=FILESYSTEM
      - XROAD_OP_MONITOR_RPC_LISTEN_ADDRESS=0.0.0.0
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_USERNAME=opmonitor
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_PASSWORD=secret
      - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
    ports:
      - "0:9999" # debug port
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health" ]
    depends_on:
      db-opmonitor-test-data-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 96M
        limits:
          memory: 512M
    volumes:
      - ./container-files/etc/xroad:/etc/xroad
  db-opmonitor:
    image: postgres:17
    environment:
      - POSTGRES_DB=op-monitor
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=opmonitor
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "pg_isready -U opmonitor -d op-monitor -h localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
  db-opmonitor-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - DB_USER=opmonitor
      - DB_PASSWORD=secret
      - DB_SCHEMA=op-monitor
      - DEFAULT_SCHEMA_NAME=public
      - db_user=opmonitor
    depends_on:
      db-opmonitor:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
  db-opmonitor-test-data-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    entrypoint:
      - java
      - -jar
      - /app/liquibase-executor.jar
      - --changelog=/liquibase/changelog/test-data/op-monitor-int-test-changelog.xml
      - --url=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - --username=opmonitor
      - --password=secret
      - --defaultSchemaName=public
      - --prop-db-user=opmonitor
      - --contexts=int-test
      - update
    volumes:
      - ./test-data:/liquibase/changelog/test-data
    depends_on:
      db-opmonitor-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
