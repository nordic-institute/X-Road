x-op-monitor: &op-monitor
  image: ${OP_MONITOR_IMG}
  pull_policy: always
  environment:
    - XROAD_HOST=op-monitor
    - XROAD_SECRET_STORE_HOST=openbao
    - XROAD_SECRET_STORE_SCHEME=http
    - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
    - DB_CONFIG_SOURCE_USERNAME=serverconf
    - DB_CONFIG_SOURCE_PASSWORD=secret
    - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
    - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_USERNAME=opmonitor
    - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_PASSWORD=secret
    - XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
  depends_on:
    db-opmonitor-init:
      condition: service_completed_successfully
    db-serverconf-config-seed:
      condition: service_completed_successfully
    openbao-trap:
      condition: service_started
  deploy:
    resources:
      reservations:
        memory: 96M
      limits:
        memory: 512M

services:
  openbao-trap:
    image: alpine/socat:1.7.4.3-r0
    command: [ "-d", "-d", "TCP-LISTEN:8200,fork,reuseaddr", "SYSTEM:true" ]
    networks:
      default:
        aliases:
          - openbao
    deploy:
      resources:
        reservations:
          memory: 8M
        limits:
          memory: 32M

  db-serverconf:
    image: postgres:18
    environment:
      - POSTGRES_DB=serverconf
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=serverconf
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "serverconf", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-serverconf-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - JDBC_USER=serverconf
      - JDBC_PASSWORD=secret
      - CHANGELOG=serverconf
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=serverconf
    depends_on:
      db-serverconf:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M

  db-serverconf-config-seed:
    image: postgres:18
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U serverconf; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, created_at, updated_at) VALUES
             ('xroad.common-rpc.use-tls', 'true', now(), now()),
             ('xroad.common-rpc.identity-source', 'file', now(), now()),
             ('xroad.common-rpc.file-identity.private-key-path', '/identity/server.key', now(), now()),
             ('xroad.common-rpc.file-identity.certificate-path', '/identity/server.crt', now(), now()),
             ('xroad.common-rpc.file-identity.trusted-ca-path', '/identity/trusted-ca.crt', now(), now()),
             ('xroad.op-monitor.rpc.listen-address', '0.0.0.0', now(), now())
           ON CONFLICT DO NOTHING;"
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M

  op-monitor:
    <<: *op-monitor
    volumes:
      - ${IDENTITY_DIR}:/identity:ro
    ports:
      - "0:9999" # debug port
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health/live" ]

  op-monitor-mismatched-key:
    <<: *op-monitor
    restart: "no"
    volumes:
      - ${MISMATCHED_KEY_IDENTITY_DIR}:/identity:ro

  op-monitor-missing-certificate:
    <<: *op-monitor
    restart: "no"
    volumes:
      - ${MISSING_CERTIFICATE_IDENTITY_DIR}:/identity:ro

  op-monitor-two-trusted-cas:
    <<: *op-monitor
    restart: "no"
    volumes:
      - ${TWO_TRUSTED_CAS_IDENTITY_DIR}:/identity:ro

  db-opmonitor:
    image: postgres:18
    environment:
      - POSTGRES_DB=op-monitor
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=opmonitor
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "pg_isready -U opmonitor -d op-monitor -h localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  db-opmonitor-init:
    build:
      context: .
      dockerfile: db-init.dockerfile
      args:
        - DB_INIT_IMG=${DB_INIT_IMG}
    environment:
      - JDBC_URL=jdbc:postgresql://db-opmonitor:5432/op-monitor
      - JDBC_USER=opmonitor
      - JDBC_PASSWORD=secret
      - CHANGELOG=op-monitor-int-test
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=opmonitor
      - LIQUIBASE_CONTEXTS=int-test
    depends_on:
      db-opmonitor:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
