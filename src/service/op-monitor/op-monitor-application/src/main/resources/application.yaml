quarkus:
  application:
    name: op-monitor-daemon
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
  scheduler:
    start-mode: forced
    enabled: true
  vault:
    authentication:
      client-token: "${XROAD_SECRET_STORE_TOKEN:}"

xroad:
  db:
    op-monitor:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties
    log:
      file:
        enabled: true
        path: /var/log/xroad/op-monitor.log

"%containerized":
  xroad:
    op-monitor:
      rpc:
        listen-address: 0.0.0.0
