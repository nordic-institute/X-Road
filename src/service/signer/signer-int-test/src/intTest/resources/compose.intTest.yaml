services:
  openbao:
    image: ${OPENBAO_DEV_IMG}
    pull_policy: always
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - BAO_TOKEN=${XROAD_SECRET_STORE_ROOT_TOKEN}
      - XROAD_SECRET_STORE_TOKEN_OVERRIDE=${XROAD_SECRET_STORE_TOKEN:-}
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "sh", "-c", "bao secrets list -format=json | jq 'has(\"xrd-pki/\")' | grep -q true" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
  signer:
    build:
      context: ./signer-container-files/
      args:
        - SIGNER_IMG=${SIGNER_IMG}
      dockerfile: Dockerfile
    pull_policy: always
    environment:
      - XROAD_HOST=signer
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_COMMON_RPC_USE_TLS=false
      - XROAD_COMMON_GLOBAL_CONF_SOURCE=FILESYSTEM
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME=serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD=secret
      - DB_CONFIG_SOURCE_ENABLED=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - XROAD_SIGNER_RPC_LISTEN_ADDRESS=0.0.0.0
      - XROAD_SIGNER_AUTOLOGIN_TOKENS__0__PIN=4321
      - QUARKUS_LOG_LEVEL=INFO
      - QUARKUS_LOG_CATEGORY__ORG_NIIS_XROAD_SIGNER__LEVEL=DEBUG
    ports:
      - "0:9999" # debug port
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health/live" ]
    depends_on:
      db-serverconf-signer-config-seed:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 96M
        limits:
          memory: 512M
    volumes:
      - ./signer-container-files/etc/xroad/globalconf:/etc/xroad/globalconf
      - softhsm-tokens:/var/lib/softhsm/tokens/
  signer-secondary:
    build:
      context: ./signer-container-files/
      args:
        - SIGNER_IMG=${SIGNER_IMG}
      dockerfile: Dockerfile
    pull_policy: always
    environment:
      - XROAD_HOST=signer-secondary
      - XROAD_SECRET_STORE_HOST=openbao
      - XROAD_SECRET_STORE_TOKEN=${XROAD_SECRET_STORE_TOKEN}
      - XROAD_SECRET_STORE_SCHEME=http
      - XROAD_COMMON_RPC_USE_TLS=false
      - XROAD_COMMON_GLOBAL_CONF_SOURCE=FILESYSTEM
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS=org.postgresql.Driver
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME=serverconf
      - XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD=secret
      - DB_CONFIG_SOURCE_ENABLED=true
      - DB_CONFIG_SOURCE_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - DB_CONFIG_SOURCE_USERNAME=serverconf
      - DB_CONFIG_SOURCE_PASSWORD=secret
      - XROAD_NODE_TYPE=secondary
      - XROAD_SIGNER_RPC_LISTEN_ADDRESS=0.0.0.0
      - QUARKUS_LOG_LEVEL=INFO
      - QUARKUS_LOG_CATEGORY__ORG_NIIS_XROAD_SIGNER__LEVEL=DEBUG
    ports:
      - "0:9999" # debug port
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "-k", "http://localhost:4099/q/health/live" ]
    depends_on:
      db-serverconf-signer-config-seed:
        condition: service_completed_successfully
      signer:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 96M
        limits:
          memory: 512M
    volumes:
      - ./signer-container-files/etc/xroad/globalconf:/etc/xroad/globalconf
      - softhsm-tokens:/var/lib/softhsm/tokens/
  db-serverconf-signer-config-seed:
    image: ${POSTGRES_DEV_IMG:-postgres-dev}
    pull_policy: always
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        until pg_isready -h db-serverconf -U postgres; do sleep 1; done
        PGPASSWORD=secret psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c \
          "INSERT INTO configuration_properties (property_key, property_value, scope, created_at, updated_at) VALUES
             ('xroad.common-rpc.use-tls', 'false', 'signer', now(), now()),
             ('xroad.common-global-conf.source', 'FILESYSTEM', 'signer', now(), now()),
             ('xroad.signer.addon.hwtoken.enabled', 'true', 'signer', now(), now()),
             ('xroad.signer.addon.hwtoken.session-pool-enabled', 'true', 'signer', now(), now()),
             ('xroad.signer.addon.hwtoken.session-pool-max-total', '3', 'signer', now(), now()),
             ('xroad.signer.addon.hwtoken.session-pool-max-idle', '2', 'signer', now(), now()),
             ('xroad.signer.addon.hwtoken.session-pool-min-idle', '1', 'signer', now(), now()),
             ('xroad.signer.addon.hwtoken.session-acquire-timeout', 'PT5S', 'signer', now(), now()),
             ('xroad.signer.autologin.enabled', 'true', 'signer', now(), now()),
             ('xroad.signer.autologin.retry.retry-max-attempts', '0', 'signer', now(), now()),
             ('xroad.signer.ocsp-response-retrieval-active', 'true', 'signer', now(), now()),
             ('xroad.signer.modules', '{\"softhsm2\":{\"library\":\"/usr/lib/softhsm/libsofthsm2.so\",\"os-locking-ok\":true,\"library-cant-create-os-threads\":true}}', 'signer', now(), now())
           ON CONFLICT DO NOTHING;"
    networks:
      - default
    depends_on:
      db-serverconf-init:
        condition: service_completed_successfully

  db-serverconf:
    image: postgres:18
    environment:
      - POSTGRES_DB=serverconf
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=serverconf
    ports:
      - "0:5432"
    healthcheck:
      start_period: 5s
      interval: 5s
      retries: 40
      test: [ "CMD", "pg_isready", "-U", "serverconf", "-h", "localhost" ]
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
  db-serverconf-init:
    image: ${DB_INIT_IMG}
    pull_policy: always
    environment:
      - JDBC_URL=jdbc:postgresql://db-serverconf:5432/serverconf
      - JDBC_USER=serverconf
      - JDBC_PASSWORD=secret
      - CHANGELOG=serverconf
      - DEFAULT_SCHEMA_NAME=public
      - PROP_DB_USER=serverconf
    depends_on:
      db-serverconf:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
  testca:
    image: ${CA_IMG}
    pull_policy: always
    healthcheck:
      interval: 5s
      retries: 40
      test: [ "CMD", "curl", "-f", "http://localhost:8888/testca/certs/" ]

volumes:
  softhsm-tokens:
