quarkus:
  application:
    name: message-log-archiver
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties
    log:
      console:
        enabled: false
      file:
        enabled: true
        path: /var/log/xroad/message-log-archiver.log

"%test":
  quarkus:
    log:
      file:
        enabled: false

xroad:
  db:
    messagelog:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}

