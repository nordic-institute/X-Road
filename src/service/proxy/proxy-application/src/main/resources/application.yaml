quarkus:
  application:
    name: proxy
  arc:
    exclude-types: org.niis.xroad.common.healthcheck.HeapMemoryLivenessCheck
  config:
    locations:
      - xroad-common.yaml
      - xroad-logging.yaml
  http:
    host: ${xroad.proxy.health-check-interface:0.0.0.0}
    host-enabled: ${xroad.proxy.health-check-enabled:false}
    port: ${xroad.proxy.health-check-port:5588}

"%containerized":
  quarkus:
    http:
      host: ${xroad.proxy.health-check-interface:0.0.0.0}
      host-enabled: ${xroad.proxy.health-check-enabled:true}
      port: ${xroad.proxy.health-check-port:5588}
  xroad:
    proxy:
      rpc:
        listen-address: 0.0.0.0

"%native":
  quarkus:
    config:
      locations:
        - xroad-common.yaml
        - xroad-logging.yaml
        - /etc/xroad/conf.d/local-tls.yaml
        - /etc/xroad/conf.d/local.yaml
        - /etc/xroad/db.properties
    log:
      console:
        enabled: false
      file:
        enabled: true
        path: /var/log/xroad/proxy.log
      category:
        "org.niis.xroad.proxy.core.clientproxy.RequestLog":
          level: INFO
          handlers: [ clientproxy-access-log ]
          use-parent-handlers: false
        "org.niis.xroad.proxy.core.serverproxy.RequestLog":
          level: INFO
          handlers: [ serverproxy-access-log ]
          use-parent-handlers: false
      handler:
        file:
          "clientproxy-access-log":
            enabled: true
            path: /var/log/xroad/clientproxy_access.log
            format: "%s%e%n"
            encoding: utf-8
            rotation:
              max-file-size: 100m
              file-suffix: .yyyy-MM-dd.zip
              rotate-on-boot: false
          "serverproxy-access-log":
            enabled: true
            path: /var/log/xroad/serverproxy_access.log
            format: "%s%e%n"
            encoding: utf-8
            rotation:
              max-file-size: 100m
              file-suffix: .yyyy-MM-dd.zip
              rotate-on-boot: false

xroad:
  db:
    serverconf:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}
    messagelog:
      hibernate:
        hikari.dataSource.ApplicationName: ${quarkus.application.name}
  proxy:
    tls:
      certificate-provisioning:
        common-name: ${XROAD_HOST:localhost}
        ip-subject-alt-names:
          - 127.0.0.1
