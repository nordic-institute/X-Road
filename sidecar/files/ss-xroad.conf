[supervisord]
user=root

[program:postgres]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main -c config_file=/etc/postgresql/18/main/postgresql.conf
user=postgres
stopsignal=INT
stopwaitsecs=30
autostart=true
autorestart=unexpected
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:openbao]
command=/usr/bin/bao server -config=/etc/openbao/openbao.hcl
user=openbao
stopsignal=INT
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-secret-store-gate]
command=/usr/share/xroad/scripts/sidecar/xroad-secret-store-gate.sh
user=root
autostart=true
autorestart=unexpected
priority=60
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-proxy-ui-api]
command=/usr/share/xroad/bin/xroad-proxy-ui-api
user=xroad
environment=HOME="/var/lib/xroad"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-signer]
command=/usr/share/xroad/bin/xroad-signer
user=xroad
environment=HOME="/var/lib/xroad"
autostart=false
autorestart=true
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-confclient]
command=/usr/share/xroad/bin/xroad-confclient
user=xroad
environment=HOME="/var/lib/xroad"
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-proxy]
user=xroad
environment=HOME="/var/lib/xroad"
command=/usr/share/xroad/bin/xroad-proxy
autostart=false
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-monitor]
command=/usr/share/xroad/bin/xroad-monitor
user=xroad
environment=HOME="/var/lib/xroad"
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-auxiliary-service]
command=/usr/share/xroad/bin/xroad-auxiliary-service
user=xroad
environment=HOME="/var/lib/xroad"
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-ds-control-plane]
command=/usr/share/xroad/bin/xroad-ds-control-plane
user=xroad
environment=HOME="/var/lib/xroad"
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xroad-ds-identity-hub]
command=/usr/share/xroad/bin/xroad-ds-identity-hub
user=xroad
environment=HOME="/var/lib/xroad"
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[group:xroad-services]
programs=xroad-signer,xroad-confclient,xroad-proxy,xroad-monitor,xroad-auxiliary-service,xroad-ds-control-plane,xroad-ds-identity-hub

[program:xroad-opmonitor]
command=/usr/share/xroad/bin/xroad-opmonitor
user=xroad
environment=HOME="/var/lib/xroad"
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/cron -f
user=root
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
