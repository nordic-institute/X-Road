#!/bin/bash

# Sourced unconditionally by /etc/xroad/services/global.conf. The
# xroad-secret-store-remote package installed in this image ships no
# equivalent file, so the sidecar provides its own: defaults point at the
# embedded OpenBao, and every value yields to an operator-supplied
# XROAD_SECRET_STORE_* environment variable (external secret store).

export XROAD_SECRET_STORE_HOST="${XROAD_SECRET_STORE_HOST:-127.0.0.1}"
export XROAD_SECRET_STORE_PORT="${XROAD_SECRET_STORE_PORT:-8200}"
export XROAD_SECRET_STORE_SCHEME="${XROAD_SECRET_STORE_SCHEME:-https}"

if [ -z "$XROAD_SECRET_STORE_TOKEN" ] && [ -f /etc/xroad/secret-store-client-token ]; then
  export XROAD_SECRET_STORE_TOKEN="$(cat /etc/xroad/secret-store-client-token)"
fi
