# X-Road Security Server Sidecar - External Database Deployment
#
# This manifest deploys the Security Server Sidecar with an external PostgreSQL
# database (e.g., AWS RDS, Azure Database for PostgreSQL, Google Cloud SQL).
#
# Prerequisites:
# - External PostgreSQL 14+ accessible from the cluster
# - Kubernetes Secret "sidecar-db-credentials" with database credentials
# - Kubernetes Secret "sidecar-admin-credentials" with admin and token credentials
#
# See external-secrets-example.yaml for automated secret management with
# AWS Secrets Manager, Azure Key Vault, or Google Secret Manager.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sidecar-config-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: security-server-sidecar
  labels:
    run: security-server-sidecar
spec:
  type: LoadBalancer
  selector:
    run: security-server-sidecar
  ports:
    - port: 5500
      targetPort: 5500
      protocol: TCP
      name: messaging
    - port: 5577
      targetPort: 5577
      protocol: TCP
      name: ocsp
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: consumer-http
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: consumer-https
---
apiVersion: v1
kind: Service
metadata:
  name: security-server-sidecar-admin
  labels:
    run: security-server-sidecar
  annotations:
    # For AWS EKS: use internal NLB for admin UI
    # service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # service.beta.kubernetes.io/aws-load-balancer-scheme: internal
spec:
  type: ClusterIP
  selector:
    run: security-server-sidecar
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: admin-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-server-sidecar
spec:
  selector:
    matchLabels:
      run: security-server-sidecar
  replicas: 1
  template:
    metadata:
      labels:
        run: security-server-sidecar
    spec:
      volumes:
        - name: sidecar-config-volume
          persistentVolumeClaim:
            claimName: sidecar-config-claim
      containers:
        - name: security-server-sidecar
          image: niis/xroad-security-server-sidecar:7.8.0
          imagePullPolicy: Always
          volumeMounts:
            - name: sidecar-config-volume
              mountPath: /etc/xroad/
          securityContext:
            capabilities:
              drop: ["NET_RAW"]
          env:
            # --- Token PIN (from secret) ---
            - name: XROAD_TOKEN_PIN
              valueFrom:
                secretKeyRef:
                  name: sidecar-admin-credentials
                  key: token-pin
            # --- Admin user credentials (from secret) ---
            - name: XROAD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: sidecar-admin-credentials
                  key: admin-user
            - name: XROAD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sidecar-admin-credentials
                  key: admin-password
            # --- External database configuration ---
            - name: XROAD_DB_HOST
              value: "your-db-host.region.rds.amazonaws.com"
            - name: XROAD_DB_PORT
              value: "5432"
            - name: XROAD_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: sidecar-db-credentials
                  key: password
            - name: XROAD_DATABASE_NAME
              value: "serverconf"
            # --- Optional: log level ---
            - name: XROAD_LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 4000
            - containerPort: 5500
            - containerPort: 5577
            - containerPort: 8080
            - containerPort: 8443
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /
              port: 4000
              scheme: HTTPS
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 4000
              scheme: HTTPS
            initialDelaySeconds: 200
            periodSeconds: 30
            failureThreshold: 10
