version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/src"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      java-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nordic-institute/xrd-developers"
  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      javascript-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nordic-institute/xrd-developers"
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nordic-institute/xrd-developers"
