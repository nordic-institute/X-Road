name: Security Server System Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      sha:
        description: 'Git SHA for the build'
        required: true
        type: string
      image_registry:
        description: 'Image registry URL'
        required: true
        type: string
      service_image_tag:
        description: 'Service image tag to use'
        required: true
        type: string

jobs:
  test-ss-system:
    name: ss-system-test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@9fcdc7c7225cc2cbeead14d114a61a461bd37e66 # v5.2
        with:
          task: start-measurement
          label: 'ss-system-test'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Download ss-system-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ss-system-test-jar

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@9fcdc7c7225cc2cbeead14d114a61a461bd37e66 # v5.2
        with:
          task: get-measurement
          label: 'ss-system-test setup'

      - name: Run ss-system-test
        run: java -jar security-server-system-test-1.0.jar

      - name: Log storage
        if: always()
        uses: ./.github/actions/log-storage
        with:
          label: 'ss-system-test storage'
          show-docker-images: 'true'

      - name: Test measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@9fcdc7c7225cc2cbeead14d114a61a461bd37e66 # v5.2
        with:
          task: get-measurement
          label: 'ss-system-test'

      - name: Test report
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: ss-system-test
          path: test-framework-working-dir/test-results/TEST-*.xml
          reporter: java-junit

      - name: Upload ss-system-test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ss-system-test-report-${{ github.run_number }}
          path: |
            test-framework-working-dir/allure-report/index.html
            test-framework-working-dir/container-logs/
            test-framework-working-dir/test-automation-exec.log
            test-framework-working-dir/selenide-failures/*.png

      - name: Show Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@9fcdc7c7225cc2cbeead14d114a61a461bd37e66 # v5.2
        with:
          task: display-results
          display-badge: false
          display-table: true
          pr-comment: false
