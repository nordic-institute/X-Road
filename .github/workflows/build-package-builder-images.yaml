name: Build Package Builder Images

on:
  # Build on changes to package builder Dockerfiles or preparation script
  push:
    branches:
      - develop
    paths:
      - 'deployment/native-packages/docker/**/Dockerfile'
      - 'scripts/images/build-builder.sh'
      - 'src/gradle.properties'
      - 'deployment/.scripts/**'
      - 'scripts/lib/base-script.sh'
      - 'scripts/lib/test-helpers.sh'
      - 'scripts/images/test-mirror-layer-leak.sh'
      - 'scripts/images/test-mirror-layer-leak-control.sh'
      - '.github/actions/setup-mirrors/**'
      - '.github/workflows/build-package-builder-images.yaml'
  # Allow manual trigger
  workflow_dispatch:
  # Nightly build
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RELEASES: deb-noble deb-resolute rpm-el9 rpm-el10

jobs:
  build:
    name: Build ${{ matrix.arch }} images
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mirrors
        id: mirrors
        uses: ./.github/actions/setup-mirrors
        with:
          token: ${{ secrets.XROAD_MIRROR_TOKEN }}

      - name: Read version from gradle.properties
        id: version
        working-directory: ./src
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          XROAD_VERSION=$(grep "^xroadVersion=" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          XROAD_BUILD_TYPE=$(grep "^xroadBuildType=" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          IMAGE_TAG="${XROAD_VERSION}-${XROAD_BUILD_TYPE}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}-${ARCH}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder images
        working-directory: ./scripts/images
        env:
          BUILD_PLATFORMS: linux/${{ matrix.arch }}
          FORCE: ${{ github.event_name != 'schedule' && 'true' || '' }}
        run: ./build-builder.sh ${FORCE:+"-f"} --no-push all

      - name: Scan builder images for mirror credentials
        if: steps.mirrors.outputs.enabled == 'true'
        working-directory: ./scripts/images
        run: |
          images=()
          for release in ${RELEASES}; do
            images+=("${IMAGE_REGISTRY}/package-builder-${release}:${IMAGE_TAG}")
          done
          ./test-mirror-layer-leak.sh "${images[@]}"

      - name: Push builder images
        run: |
          for release in ${RELEASES}; do
            docker push "${IMAGE_REGISTRY}/package-builder-${release}:${IMAGE_TAG}"
          done

      - name: Log out of the mirror Docker host
        if: always() && steps.mirrors.outputs.enabled == 'true'
        run: |
          docker_host="${XROAD_MIRROR_DOCKER_URL#*://}"
          docker_host="${docker_host%%/*}"
          if [[ -n "${docker_host}" ]]; then
            docker logout "${docker_host}"
          fi

  create-manifests:
    name: Create multi-arch manifests
    runs-on: ubuntu-24.04
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          REGISTRY_PATH="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          for image in ${RELEASES}; do
            echo "Creating manifest for package-builder-${image}:${TAG}"

            docker buildx imagetools create \
              --tag "${REGISTRY_PATH}/package-builder-${image}:${TAG}" \
              --tag "${REGISTRY_PATH}/package-builder-${image}:latest" \
              "${REGISTRY_PATH}/package-builder-${image}:${TAG}-amd64" \
              "${REGISTRY_PATH}/package-builder-${image}:${TAG}-arm64"

            echo "✅ Created manifest for ${image}"
          done

  summary:
    name: Build summary
    runs-on: ubuntu-24.04
    needs: [build, create-manifests]
    if: always()

    steps:
      - name: Add build summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUILD_STATUS: ${{ needs.build.result }}
          MANIFEST_STATUS: ${{ needs.create-manifests.result }}
        run: |
          REPO_LOWERCASE="${GITHUB_REPOSITORY,,}"

          if [[ "$BUILD_STATUS" == "success" ]]; then BUILD_ICON="✅"; else BUILD_ICON="❌"; fi
          if [[ "$MANIFEST_STATUS" == "success" ]]; then MANIFEST_ICON="✅"; else MANIFEST_ICON="❌"; fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Package Builder Images Build

          **Trigger:** ${{ github.event_name }}
          **Branch/Tag:** ${{ github.ref_name }}
          **Version Tag:** \`${TAG}\`
          **Registry:** \`${REGISTRY}/${REPO_LOWERCASE}\`

          ## Build Status
          - ${BUILD_ICON} **Builds** (amd64, arm64): $BUILD_STATUS
          - ${MANIFEST_ICON} **Multi-arch manifests**: $MANIFEST_STATUS

          ## Built Images
          Each image is available for both amd64 and arm64:
          - \`package-builder-deb-noble:${TAG}\`
          - \`package-builder-deb-resolute:${TAG}\`
          - \`package-builder-rpm-el9:${TAG}\`
          - \`package-builder-rpm-el10:${TAG}\`

          ### Architecture-Specific Tags (for debugging)
          - \`package-builder-deb-resolute:${TAG}-amd64\`
          - \`package-builder-deb-resolute:${TAG}-arm64\`
          - (same pattern for all images)
          EOF
