name: Publish test CA image
on: 
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/publish_testca.yaml'
      - 'development/docker/testca/**'
      - 'development/ansible/roles/xroad-ca/**'
env:
  REGISTRY: ghcr.io
  XROAD_HOME: ${{ github.workspace }}
jobs:
  PublishCA:
    name: Publish test CA image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize docker setup
        working-directory: ./development/docker/testca
        run: ./init_context.sh
      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ github.workspace }}/development/docker/testca
          push: true
          tags: ghcr.io/nordic-institute/xrddev-testca:latest
      - name: Clean old CA images
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          image-names: xrddev-testca
          cut-off: 1w
          timestamp-to-use: created_at
          account: nordic-institute
          keep-n-most-recent: 1
          token: ${{ secrets.GITHUB_TOKEN }}
