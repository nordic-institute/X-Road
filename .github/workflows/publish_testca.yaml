name: Publish test CA image
on: 
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/publish_testca.yaml'
      - '.github/actions/setup-mirrors/**'
      - 'development/docker/testca/**'
      - 'development/ansible/roles/xroad-ca/**'
      - 'deployment/.scripts/**'
      - 'scripts/lib/base-script.sh'
      - 'scripts/lib/test-helpers.sh'
      - 'scripts/images/test-mirror-layer-leak.sh'
      - 'scripts/images/test-mirror-layer-leak-control.sh'
env:
  REGISTRY: ghcr.io
  XROAD_HOME: ${{ github.workspace }}
  TESTCA_IMAGE: ghcr.io/nordic-institute/xrddev-testca:latest
jobs:
  PublishCA:
    name: Publish test CA image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mirrors
        id: mirrors
        uses: ./.github/actions/setup-mirrors
        with:
          token: ${{ secrets.XROAD_MIRROR_TOKEN }}
          username: ${{ vars.XROAD_MIRROR_USERNAME }}
          maven-url: ${{ vars.XROAD_MIRROR_MAVEN_URL }}
          plugins-url: ${{ vars.XROAD_MIRROR_PLUGINS_URL }}
          npm-url: ${{ vars.XROAD_MIRROR_NPM_URL }}
          ubuntu-url: ${{ vars.XROAD_MIRROR_UBUNTU_URL }}
          docker-url: ${{ vars.XROAD_MIRROR_DOCKER_URL }}
          github-url: ${{ vars.XROAD_MIRROR_GITHUB_URL }}
          k8s-url: ${{ vars.XROAD_MIRROR_K8S_URL }}
          disabled: ${{ vars.XROAD_MIRRORS_DISABLED }}
      - name: Initialize docker setup
        working-directory: ./development/docker/testca
        run: ./init_context.sh
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          source scripts/lib/base-script.sh
          build_mirror_args "${XROAD_HOME}" "false"
          docker buildx build --progress=plain \
            "${MIRROR_BUILD_ARGS[@]}" \
            --tag "${TESTCA_IMAGE}" \
            --load \
            development/docker/testca
      - name: Scan image for mirror credentials
        if: steps.mirrors.outputs.enabled == 'true'
        run: |
          ./scripts/images/test-mirror-layer-leak.sh "${TESTCA_IMAGE}"
      - name: Push Docker image
        run: docker push "${TESTCA_IMAGE}"
      - name: Clean old CA images
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          image-names: xrddev-testca
          cut-off: 1w
          timestamp-to-use: created_at
          account: nordic-institute
          keep-n-most-recent: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log out of the mirror Docker host
        if: always() && steps.mirrors.outputs.enabled == 'true'
        run: |
          docker_host="${XROAD_MIRROR_DOCKER_URL#*://}"
          docker_host="${docker_host%%/*}"
          if [[ -n "${docker_host}" ]]; then
            docker logout "${docker_host}"
          fi
