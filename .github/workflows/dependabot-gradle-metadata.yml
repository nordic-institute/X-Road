name: Update Gradle Metadata (Dependabot)

# Triggered when Dependabot pushes a Gradle dependency-update branch.
# Regenerates verification-metadata.xml so that the main build workflow
# passes strict dependency verification.
# Uses push (not pull_request) so the GITHUB_TOKEN always has write access.
on:
  push:
    branches:
      - 'dependabot/gradle/**'

permissions:
  contents: write

jobs:
  update-gradle-metadata:
    name: Regenerate verification metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2  # enough for --amend; avoids shallow push issues

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin

      # Minimal Gradle setup: no dependency-graph and no build-scan-publish to
      # avoid the Develocity / dependency-graph init scripts that would themselves
      # fail verification on a fresh runner.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@18f1c6724d5bcb313b5c5ef536430a31e5c5b455 # v4.4.0

      - name: Regenerate verification metadata
        run: |
          bash development/docs/regenerate-verification-metadata.sh \
            build -x test \
            --dependency-verification=off \
            --no-daemon \
            --parallel \
            -q

      # Always amend + force-push (even when metadata unchanged) so the PR
      # head moves, pull_request.synchronize fires, and the Build workflow
      # runs exactly once on a known-good commit. The Build workflow is
      # configured to skip the initial `opened` event on dependabot/gradle/*
      # branches — it relies on this sync to run.
      - name: Amend Dependabot commit and force-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gradle/verification-metadata.xml
          git commit --amend --no-edit --allow-empty
          git push --force-with-lease
