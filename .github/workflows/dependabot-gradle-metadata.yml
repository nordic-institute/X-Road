name: Update Gradle Metadata (Dependabot)

# Triggered when Dependabot pushes a Gradle dependency-update branch.
# Regenerates verification-metadata.xml so that the main
# build workflow passes strict dependency verification.
on:
  push:
    paths:
      - 'src/gradle/libs.versions.toml'

permissions:
  contents: write

jobs:
  update-gradle-metadata:
    name: Regenerate verification metadata (multi-arch)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-amd64
          - os: macos-latest
            arch: macos-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Update verification metadata
        working-directory: src
        run: |
          ./gradlew \
            --write-verification-metadata sha256 \
            --dependency-verification=off \
            --no-daemon \
            --parallel \
            -q dependencies

      - name: Upload verification metadata artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: verification-metadata-${{ matrix.arch }}
          path: |
            src/gradle/verification-metadata.xml

  merge-and-commit:
    name: Merge verification metadata and commit
    runs-on: ubuntu-24.04
    needs: update-gradle-metadata
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Download verification metadata artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Merge verification-metadata.xml files
        run: |
          python3 .github/scripts/merge-verification-metadata.py \
            artifacts/verification-metadata-linux-amd64/verification-metadata.xml \
            artifacts/verification-metadata-macos-arm64/verification-metadata.xml \
            src/gradle/verification-metadata.xml

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gradle/verification-metadata.xml
          if git diff --staged --quiet; then
            echo "No changes - verification metadata is already up to date."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: merge Gradle verification metadata for all architectures [skip ci]"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi
