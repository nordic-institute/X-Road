name: Refresh Gradle verification metadata

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**/*.gradle"
      - "src/**/*.gradle.kts"
      - "src/gradle/libs.versions.toml"
      - "src/settings-gradle.lockfile"

permissions:
  contents: write

jobs:
  refresh-verification-metadata:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@18f1c6724d5bcb313b5c5ef536430a31e5c5b455 # v4.4.0
        with:
          cache-read-only: true
          dependency-graph: disabled

      - name: Regenerate verification metadata
        working-directory: ./src
        run: >
          ./gradlew --no-configuration-cache --no-parallel -PxroadBuildType=RELEASE
          --write-verification-metadata sha256 build -x test -x intTest

      - name: Commit metadata update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "No verification metadata changes to commit"
            exit 0
          fi
          git commit -m "chore(deps): refresh Gradle verification metadata"
          git push

