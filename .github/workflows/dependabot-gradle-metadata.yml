name: Update Gradle Metadata (Dependabot)

# Triggered when Dependabot pushes a Gradle dependency-update branch.
# Regenerates verification-metadata.xml so that the main build workflow
# passes strict dependency verification.
# Uses push (not pull_request) so the GITHUB_TOKEN always has write access.
on:
  push:
    branches:
      - 'dependabot/gradle/**'

permissions:
  contents: write

jobs:
  update-gradle-metadata:
    name: Regenerate verification metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: temurin

      # Minimal Gradle setup: no dependency-graph and no build-scan-publish to
      # avoid the Develocity / dependency-graph init scripts that would themselves
      # fail verification on a fresh runner.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Regenerate verification metadata
        run: |
          bash development/docs/regenerate-verification-metadata.sh \
            dependencies \
            --dependency-verification=off \
            --no-daemon \
            --parallel \
            -q

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gradle/verification-metadata.xml
          if git diff --staged --quiet; then
            echo "No changes - verification metadata is already up to date."
          else
            git commit -m "chore: update Gradle verification metadata [skip ci]"
            git push
          fi
