name: E2E Tests

# One definition for every E2E lane. The caller invokes this once with a matrix over
# `variant`, so the Actions UI shows a single "e2e" group with one leg per substrate.
#
# The suite itself is identical in all lanes -- the same fat jar, the same scenario
# classes -- and `test-framework.env-mode` selects the substrate. What differs is the
# setup each substrate needs before the jar can attach, which is expressed as
# variant-guarded steps. Everything from "Setup Java" onward is shared.
#
# The caller has no `needs: build-and-package` edge, so every leg starts with the
# pipeline instead of waiting on that job to finish. Each leg runs its
# package-independent prep (variant-guarded, see below) immediately -- this is what
# overlaps with build-and-package -- then a uniform wait step polls for a readiness
# marker artifact before downloading anything build-and-package produced. lxd and
# compose wait on `artifacts-ready` (packages + e2e-test-jar); k8s waits on
# `images-ready` (all image pushes), since it deploys images that land later in that
# job. The marker also carries the image registry/tag: without the `needs` edge,
# `needs.build-and-package.outputs.*` is not available to read them from.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      sha:
        description: 'Git SHA for the build'
        required: true
        type: string
      variant:
        description: 'E2E substrate: compose | lxd | k8s'
        required: true
        type: string
      runs_on:
        description: 'Runner label for this lane'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout for this lane'
        required: true
        type: number

jobs:
  e2e:
    name: ${{ inputs.variant }}
    # The lxd lane stays on pull_request and manual dispatch only; compose also gates
    # pushes to develop. Guarding here rather than in the caller keeps the three lanes
    # in one matrix -- an excluded lane shows as a skipped leg instead of vanishing.
    if: >
      inputs.variant != 'lxd'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      ANSIBLE_CONFIG: config/ansible.cfg
    steps:
      - name: Start Measurement
        if: inputs.variant == 'compose'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          label: 'e2e-test'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # ---------------------------------------------------------------- lxd setup

      - name: Install Ansible and LXD tooling
        if: inputs.variant == 'lxd'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible jq
          ansible-galaxy collection install community.general ansible.posix
          # LXD ships preinstalled via snap on ubuntu-24.04 runners; ensure it is ready.
          sudo snap install lxd 2>/dev/null || true
          sudo lxd waitready --timeout 60

      # lxdbr0 must sit on 10.10.10.1/24 — that is the dnsmasq address the
      # native-lxd-stack networking scripts and *.lxd resolution assume.
      - name: Initialize LXD
        if: inputs.variant == 'lxd'
        run: |
          start=$(date +%s)
          cat <<'EOF' | sudo lxd init --preseed
          config: {}
          networks:
          - name: lxdbr0
            type: bridge
            config:
              ipv4.address: 10.10.10.1/24
              ipv4.nat: "true"
              ipv6.address: none
          storage_pools:
          - name: default
            driver: dir
          profiles:
          - name: default
            devices:
              eth0:
                name: eth0
                network: lxdbr0
                type: nic
              root:
                path: /
                pool: default
                type: disk
          EOF
          sudo usermod -aG lxd "$USER"
          echo "INIT_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Docker on the hosted runner sets the iptables FORWARD policy to DROP,
      # which kills all egress from lxdbr0 containers (DHCP/DNS still work —
      # they are host INPUT, not forwarded). Let bridge traffic through.
      - name: Allow LXD egress past Docker's FORWARD DROP policy
        if: inputs.variant == 'lxd'
        run: |
          sudo iptables -S FORWARD | head -3
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT \
            && sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT \
            || sudo iptables -P FORWARD ACCEPT

      - name: Configure *.lxd host DNS
        if: inputs.variant == 'lxd'
        working-directory: ./scripts/env-lxd
        run: sg lxd -c "./scripts/setup-linux-net.sh apply"

      - name: Pre-provision supporting containers
        if: inputs.variant == 'lxd'
        working-directory: ./scripts/env-lxd
        run: |
          start=$(date +%s)
          sg lxd -c "ansible-playbook -i config/ci-localhost.txt ../../development/ansible/xroad_cache_images.yml --forks 2 -e onMacOs=no -e cache_targets=xroad-is,xroad-ca,xroad-repo"
          echo "CACHE_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- k8s setup

      # Helm is pinned to the same version the chart-lint job uses; helm 4 cannot parse
      # templates/services/all.yaml (see _test-charts.yml).
      - name: Setup Helm
        if: inputs.variant == 'k8s'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      # Ansible deliberately is not installed here: start-env.sh's bootstrap builds a venv
      # from development/k8s/requirements.txt (ansible-core, kubernetes, the pinned
      # kubernetes.core collection) and activates it, so an apt-installed ansible would only
      # shadow the versions the roles are pinned against. Only kind is missing on the runner.
      - name: Install kind
        if: inputs.variant == 'k8s'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind \
            https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo chmod +x /usr/local/bin/kind
          sudo apt-get update
          sudo apt-get install -y python3-venv
          kind --version
          kubectl version --client
          helm version --short

      - name: Login to GHCR (k8s)
        if: inputs.variant == 'k8s'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------ compose setup

      - name: Login to GHCR
        if: inputs.variant == 'compose'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create compose network
        if: inputs.variant == 'compose'
        run: docker network create xroad-network

      # --------------------------------------------------------- wait for build

      # Everything above this point is package-independent prep and runs immediately,
      # overlapping build-and-package. lxd and compose need only the packages +
      # e2e-test-jar, ready at the `artifacts-ready` marker; k8s deploys images that
      # land later in that job, at the `images-ready` marker.
      - name: Determine readiness marker
        id: marker
        run: |
          if [[ "${{ inputs.variant }}" == "k8s" ]]; then
            echo "name=images-ready" >> "$GITHUB_OUTPUT"
          else
            echo "name=artifacts-ready" >> "$GITHUB_OUTPUT"
          fi

      # Polls the run's own artifact list for the marker AND build-and-package's job
      # status each cycle via `gh api`, so a failed or cancelled build fails this leg
      # within minutes instead of idling to the deadline. The deadline is a backstop
      # only, set above build-and-package's 60-min job timeout. The artifact-list
      # query paginates and matches a name line rather than counting results, so a
      # multi-page list cannot break the check.
      - name: Wait for build-and-package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          marker="${{ steps.marker.outputs.name }}"
          start=$(date +%s)
          deadline=$(( start + 70 * 60 ))
          while true; do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --paginate -X GET -f per_page=100 \
                 --jq ".artifacts[] | select(.name == \"$marker\") | .name" \
                 | grep -qx "$marker"; then
              break
            fi

            # The reusable build-and-package job appears as "<caller job name> / <its
            # own job name>" in the run's job list; match on the caller name's prefix
            # so a rename of the inner job name cannot silently break this check.
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --paginate -X GET -f per_page=100 \
              --jq '[.jobs[] | select(.name | startswith("build & package"))][0].conclusion // ""')
            case "$conclusion" in
              failure|cancelled|skipped|timed_out)
                echo "::error::build-and-package ${conclusion}; giving up waiting for marker '$marker'." >&2
                exit 1
                ;;
            esac

            now=$(date +%s)
            if (( now >= deadline )); then
              echo "::error::Timed out after 70m waiting for marker artifact '$marker' from build-and-package." >&2
              exit 1
            fi
            sleep 25
          done
          echo "WAIT_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Download readiness marker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ci-markers

      - name: Load image registry/tag from marker
        run: cat "ci-markers/${{ steps.marker.outputs.name }}.env" >> "$GITHUB_ENV"

      # ------------------------------------------------------- lxd provisioning

      - name: Download resolute (Ubuntu 26.04) packages
        if: inputs.variant == 'lxd'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lxd-packages-ubuntu26.04
          path: deployment/native-packages/build/ubuntu26.04

      - name: Download noble (Ubuntu 24.04) packages
        if: inputs.variant == 'lxd'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lxd-packages-ubuntu24.04
          path: deployment/native-packages/build/ubuntu24.04

      - name: Download RHEL 9 packages
        if: inputs.variant == 'lxd'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lxd-packages-rhel9
          path: deployment/native-packages/build/rhel/9

      - name: Provision containers
        if: inputs.variant == 'lxd'
        working-directory: ./scripts/env-lxd
        run: |
          start=$(date +%s)
          sg lxd -c "ansible-playbook -i config/ci-localhost.txt ../../development/ansible/xroad_dev.yml --forks 5 --skip-tags compile,build-packages -e onMacOs=no -e enable_netdata=false"
          echo "PROVISION_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Initialize X-Road (hurl)
        if: inputs.variant == 'lxd'
        working-directory: ./scripts/env-lxd
        run: |
          start=$(date +%s)
          sg lxd -c "lxc exec xrd-hurl -- bash -c 'cd /opt/hurl && ./run-hurl.sh'"
          sg lxd -c "./wait-xroad-ready.sh"
          echo "HURL_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # ------------------------------------------------------- k8s provisioning

      # Provisioning is the same path a developer runs locally -- same charts, same roles,
      # same playbook -- differing only in where the images come from. --skip-images is
      # correct here because build-and-package already built and pushed them; the registry
      # coordinates and the pull credentials are passed through as extra-vars rather than
      # forked into a CI-only inventory, so the two environments cannot drift.
      - name: Provision the k8s E2E topology
        if: inputs.variant == 'k8s'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./scripts/env-k8s/start-env.sh --env=e2e --recreate --skip-images \
            -e "xroad_image_registry=${{ env.IMAGE_REGISTRY }}" \
            -e "xroad_image_tag=${{ env.SERVICE_IMAGE_TAG }}" \
            -e "serverconf_init_image=${{ env.IMAGE_REGISTRY }}/ss-db-init:${{ env.SERVICE_IMAGE_TAG }}" \
            -e "xroad_image_pull_secret=ghcr-pull-secret" \
            -e "xroad_image_pull_registry=ghcr.io" \
            -e "xroad_image_pull_username=${GHCR_USERNAME}" \
            -e "xroad_image_pull_password=${GHCR_PASSWORD}" \
            -e '{"xroad_image_pull_secret_namespaces": ["cs", "ss0", "ss1"]}'
          echo "PROVISION_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------- shared

      - name: Download e2e-test JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-test-jar

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup measurement
        if: inputs.variant == 'compose'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: 'e2e-test setup'

      - name: Run e2e tests (compose)
        if: inputs.variant == 'compose'
        run: java -jar e2e-test-1.0.jar

      # sg lxd: the suite's LXD-mode transports (messagelog SQL, archiver trigger,
      # archive download) shell out to lxc, which needs the lxd group's socket access.
      - name: Run e2e tests (lxd)
        if: inputs.variant == 'lxd'
        run: |
          start=$(date +%s)
          sg lxd -c 'java -Dtest-framework.env-mode=lxd -jar e2e-test-1.0.jar'
          echo "E2E_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Run e2e tests (k8s)
        if: inputs.variant == 'k8s'
        run: |
          start=$(date +%s)
          java -Dtest-framework.env-mode=k8s -jar e2e-test-1.0.jar
          echo "E2E_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Log storage
        if: always() && inputs.variant == 'compose'
        uses: ./.github/actions/log-storage
        with:
          label: 'e2e-test storage'
          show-docker-images: 'true'

      - name: Test measurement
        if: inputs.variant == 'compose'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: 'e2e-test'

      - name: Test report
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: e2e-test-${{ inputs.variant }}
          path: test-framework-working-dir/test-results/TEST-*.xml
          reporter: java-junit

      - name: Upload e2e-test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-test-${{ inputs.variant }}-report-${{ github.run_number }}
          path: |
            test-framework-working-dir/allure-report/index.html
            test-framework-working-dir/container-logs/
            test-framework-working-dir/test-automation-exec.log
          if-no-files-found: warn

      # ------------------------------------------------------- k8s diagnostics

      # A red k8s lane has to be root-causable from the run alone -- there is no cluster to
      # attach to afterwards. Cluster-wide state first, then every container's log including
      # previous incarnations of restarted ones, which is where a crash-loop's real error is.
      - name: Collect cluster state and pod logs
        if: always() && inputs.variant == 'k8s'
        run: |
          set +e
          out=k8s-logs
          mkdir -p "$out"
          kubectl get pods -A -o wide            > "$out/pods.txt" 2>&1
          kubectl get events -A --sort-by=.metadata.creationTimestamp > "$out/events.txt" 2>&1
          kubectl get svc,ep,pvc,jobs -A         > "$out/resources.txt" 2>&1
          kubectl describe pods -A               > "$out/describe-pods.txt" 2>&1
          helm list -A                           > "$out/helm-releases.txt" 2>&1
          kubectl get pods -A --no-headers -o custom-columns=NS:.metadata.namespace,N:.metadata.name \
          | while read -r ns name; do
              kubectl logs -n "$ns" "$name" --all-containers --tail=-1 > "$out/$ns.$name.log" 2>&1
              kubectl logs -n "$ns" "$name" --all-containers --previous --tail=-1 \
                > "$out/$ns.$name.previous.log" 2>/dev/null
              [ -s "$out/$ns.$name.previous.log" ] || rm -f "$out/$ns.$name.previous.log"
            done
          exit 0

      - name: Upload k8s logs
        if: always() && inputs.variant == 'k8s'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-k8s-cluster-logs-${{ github.run_number }}
          path: k8s-logs/
          if-no-files-found: ignore

      - name: k8s timing summary
        if: always() && inputs.variant == 'k8s'
        run: |
          {
            echo "# k8s e2e timing"
            echo ""
            echo "| Phase | Duration |"
            echo "|-------|----------|"
            echo "| Wait for build-and-package | ${WAIT_SECS:-n/a}s |"
            echo "| Provision (kind + charts + hurl) | ${PROVISION_SECS:-n/a}s |"
            echo "| e2e suite (k8s mode) | ${E2E_SECS:-n/a}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down kind cluster
        if: always() && inputs.variant == 'k8s'
        run: ./scripts/env-k8s/delete-env.sh --env=e2e || true

      # ------------------------------------------------------- lxd diagnostics

      - name: Timing summary
        if: always() && inputs.variant == 'lxd'
        run: |
          {
            echo "# LXD e2e timing"
            echo ""
            echo "| Phase | Duration |"
            echo "|-------|----------|"
            echo "| LXD init | ${INIT_SECS:-n/a}s |"
            echo "| Pre-provision supporting containers | ${CACHE_SECS:-n/a}s |"
            echo "| Wait for build-and-package | ${WAIT_SECS:-n/a}s |"
            echo "| Provision containers | ${PROVISION_SECS:-n/a}s |"
            echo "| Federation init (hurl) | ${HURL_SECS:-n/a}s |"
            echo "| e2e suite (LXD mode) | ${E2E_SECS:-n/a}s |"
            total=$(( ${INIT_SECS:-0} + ${CACHE_SECS:-0} + ${WAIT_SECS:-0} + ${PROVISION_SECS:-0} + ${HURL_SECS:-0} + ${E2E_SECS:-0} ))
            echo "| **Total** | **${total}s** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container state
        if: always() && inputs.variant == 'lxd'
        run: sg lxd -c "lxc list" || true

      - name: Collect container logs
        if: always() && inputs.variant == 'lxd'
        run: |
          mkdir -p lxd-logs
          for c in $(sg lxd -c "lxc list -c n --format csv" 2>/dev/null); do
            sg lxd -c "lxc exec $c -- journalctl --no-pager" > "lxd-logs/$c.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always() && inputs.variant == 'lxd'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lxd-provision-logs-${{ github.run_number }}
          path: lxd-logs/
          if-no-files-found: ignore

      - name: Show Energy Results
        if: inputs.variant == 'compose'
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: display-results
          display-badge: false
          display-table: true
          pr-comment: false
