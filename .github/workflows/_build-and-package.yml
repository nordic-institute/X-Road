name: Build and Package

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      sha:
        description: 'Git SHA for the build'
        required: true
        type: string
    outputs:
      image_registry:
        description: 'Image registry URL used for builds'
        value: ${{ jobs.build-and-package.outputs.image_registry }}
      service_image_tag:
        description: 'Service image tag used for builds'
        value: ${{ jobs.build-and-package.outputs.service_image_tag }}

jobs:
  build-and-package:
    name: Build, test and package code
    timeout-minutes: 60
    runs-on:
      labels: xrd-runner-8c
    outputs:
      image_registry: ${{ steps.build-config.outputs.image_registry }}
      service_image_tag: ${{ steps.build-config.outputs.service_image_tag }}
    steps:
      - name: Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement
          label: 'Build, unit tests and packaging'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # SonarCloud: Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          gradle-cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          setup-docker-buildx: true
          setup-packaging-tools: false
          free-disk-space: false

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and package code setup measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: 'Build environment setup'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup build configuration
        id: build-config
        working-directory: ./src
        run: |
          # Setup GHCR registry URL (unified for both base images and application images)
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REGISTRY="ghcr.io/${REPO_LOWERCASE}"
          
          # Read version and build type from gradle.properties for service image tagging
          XROAD_VERSION=$(grep "^xroadVersion=" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          XROAD_BUILD_TYPE=$(grep "^xroadBuildType=" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          
          # Function to get branch name for service image tagging
          get_branch_name() {
            local branch_name=""
            # For pull requests, prioritize head_ref (actual source branch) over ref_name (merge branch)
            if [[ -n "${{ github.head_ref }}" ]]; then
              branch_name="${{ github.head_ref }}"
              echo "🔍 Using PR source branch: ${branch_name}" >&2
            elif [[ -n "${{ github.ref_name }}" ]]; then
              branch_name="${{ github.ref_name }}"
              echo "🔍 Using ref branch: ${branch_name}" >&2
            else
              branch_name="unknown"
              echo "⚠️ No branch name found, using: ${branch_name}" >&2
            fi
            # Clean up branch name for Docker tag compatibility
            echo "$branch_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g'
          }
          
          # Determine service image suffix for branch-aware tagging
          BRANCH_NAME=$(get_branch_name)
          
          # Use GitHub run number for build uniqueness (handles re-runs of same commit)
          BUILD_NUMBER="${{ github.run_number }}"
          
          if [[ "${{ github.ref_type }}" == "tag" || "$XROAD_BUILD_TYPE" == "RELEASE" ]]; then
            # For releases, use simple version
            SERVICE_IMAGE_TAG="${XROAD_VERSION}"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            # For develop branch, include build number for uniqueness
            SERVICE_IMAGE_TAG="${XROAD_VERSION}-SNAPSHOT-${BUILD_NUMBER}"
          else
            # For feature branches, include branch name and build number
            SERVICE_IMAGE_TAG="${XROAD_VERSION}-SNAPSHOT-${BRANCH_NAME}-${BUILD_NUMBER}"
          fi
          
          # Export to GITHUB_ENV for subsequent steps
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY}" >> $GITHUB_ENV
          echo "SERVICE_IMAGE_TAG=${SERVICE_IMAGE_TAG}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          echo "XROAD_VERSION=${XROAD_VERSION}" >> $GITHUB_ENV
          echo "XROAD_BUILD_TYPE=${XROAD_BUILD_TYPE}" >> $GITHUB_ENV
          echo "PACKAGE_BUILDER_IMAGE_TAG=${XROAD_VERSION}-${XROAD_BUILD_TYPE}" >> $GITHUB_ENV
          
          # Export to GITHUB_OUTPUT for job outputs
          echo "image_registry=${IMAGE_REGISTRY}" >> $GITHUB_OUTPUT
          echo "service_image_tag=${SERVICE_IMAGE_TAG}" >> $GITHUB_OUTPUT
          
          echo "🏗️ Build configuration:"
          echo "  Registry: ${IMAGE_REGISTRY}"
          echo "  Service Image Tag: ${SERVICE_IMAGE_TAG}"
          echo "  Package Builder Image Tag: ${PACKAGE_BUILDER_IMAGE_TAG}"
          echo "  Branch: ${BRANCH_NAME}"
          echo "  X-Road Version: ${XROAD_VERSION}"
          echo "  Build Type: ${XROAD_BUILD_TYPE}"
          echo "  Build Number: ${BUILD_NUMBER}"
          echo "  Commit SHA: ${{ inputs.sha }}"

      - name: Build and test source
        working-directory: ./src
        run: |
          ./gradlew -Dorg.gradle.jvmargs=-Xmx6g build --parallel -Dorg.gradle.workers.max=6 \
          -PxroadImageRegistry=${{ env.IMAGE_REGISTRY }} \
          -PxroadImageTag=${{ env.SERVICE_IMAGE_TAG }}

      - name: Build RHEL9 packages
        working-directory: ./scripts
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ env.PACKAGE_BUILDER_IMAGE_TAG }}
        run: ./build-native-packages.sh -d -r rpm-el9 --package-only

      - name: Upload RHEL9 packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lxd-packages-rhel9
          path: deployment/native-packages/build/rhel/9
          compression-level: '0'

      - name: Free RHEL9 packages
        run: rm -rf ${{ github.workspace }}/deployment/native-packages/build/rhel/9

      - name: Build Ubuntu 24.04 (Noble) packages
        working-directory: ./scripts
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ env.PACKAGE_BUILDER_IMAGE_TAG }}
        run: ./build-native-packages.sh -d -r noble --package-only

      - name: Upload Ubuntu 24.04 (Noble) packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lxd-packages-ubuntu24.04
          path: deployment/native-packages/build/ubuntu24.04
          compression-level: '0'

      - name: Free Ubuntu 24.04 (Noble) packages
        run: rm -rf ${{ github.workspace }}/deployment/native-packages/build/ubuntu24.04

      - name: Build Ubuntu 26.04 (Resolute) packages
        working-directory: ./scripts
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ env.PACKAGE_BUILDER_IMAGE_TAG }}
        run: ./build-native-packages.sh -d -r resolute --package-only

      - name: Upload Ubuntu 26.04 (Resolute) packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lxd-packages-ubuntu26.04
          path: deployment/native-packages/build/ubuntu26.04
          compression-level: '0'

      - name: Upload e2e-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-jar
          path: src/security-server/e2e-test/build/libs/e2e-test-1.0.jar
          compression-level: '0'

      - name: Create lxd-artifacts-ready marker
        run: echo "ready" > lxd-artifacts-ready.txt

      - name: Upload lxd-artifacts-ready marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lxd-artifacts-ready
          path: lxd-artifacts-ready.txt
          compression-level: '0'

      - name: Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: ./src
        run: |
          ./gradlew -Dorg.gradle.jvmargs=-Xmx6g -PsonarqubeHost=https://sonarcloud.io -PsonarqubeProjectKey=nordic-institute_X-Road \
          -PsonarqubeOrganization=nordic-institute jacocoAggregatedReport sonar

      - name: Build Security Server images
        working-directory: ./scripts/images
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ env.SERVICE_IMAGE_TAG }}
        run: |
          ./build-security-server.sh --platforms linux/amd64,linux/arm64 --push

      - name: Upload signer-int-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signer-int-test-jar
          path: src/service/signer/signer-int-test/build/libs/signer-int-test-1.0.jar
          compression-level: '0'

      - name: Upload confproxy-int-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: confproxy-int-test-jar
          path: src/service/configuration-proxy/configuration-proxy-int-test/build/libs/confproxy-int-test-1.0.jar
          compression-level: '0'

      - name: Upload softtoken-signer-int-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: softtoken-signer-int-test-jar
          path: src/service/softtoken-signer/softtoken-signer-int-test/build/libs/softtoken-signer-int-test-1.0.jar
          compression-level: '0'

      - name: Upload opmonitor-int-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opmonitor-int-test-jar
          path: src/service/op-monitor/op-monitor-int-test/build/libs/opmonitor-int-test-1.0.jar
          compression-level: '0'

      - name: Upload cs-management-int-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cs-management-int-test-jar
          path: src/central-server/management-service/int-test/build/libs/central-server-management-int-test-1.0.jar
          compression-level: '0'

      - name: Upload ss-api-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ss-api-test-jar
          path: src/security-server/api-test/build/libs/security-server-api-test-1.0.jar
          compression-level: '0'

      - name: Upload cs-api-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cs-api-test-jar
          path: src/central-server/admin-service/api-test/build/libs/central-server-api-test-1.0.jar
          compression-level: '0'

      - name: Log storage after build
        if: always()
        uses: ./.github/actions/log-storage
        with:
          label: 'Storage After Build'
          show-build-dirs: 'true'

      - name: Test report
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Unit and integration tests
          path: src/**/build/test-results/**/TEST-*.xml
          reporter: java-junit
          list-suites: 'failed'
          list-tests: 'failed'

      - name: Build, test and package code execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: 'Build, unit tests and packaging'

      - name: Build RHEL10 packages
        working-directory: ./scripts
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ env.PACKAGE_BUILDER_IMAGE_TAG }}
        run: |
          ./build-native-packages.sh -d -r rpm-el10 --package-only
          echo "Packages built successfully, removing packages.."
          rm -rf ${{ github.workspace }}/deployment/native-packages/build/rhel/10

      - name: Build and push Central Server dev image
        working-directory: ./scripts/images
        run: |
          echo "🏗️ Building Central Server dev image:"
          echo "  Registry: ${IMAGE_REGISTRY}"
          echo "  Version: ${SERVICE_IMAGE_TAG}"
          echo "  Branch: ${BRANCH_NAME}"

          ./build-central-server.sh \
            --environment ci \
            --registry ${{ env.IMAGE_REGISTRY }} \
            --version ${{ env.SERVICE_IMAGE_TAG }} \
            --packages-path ${{ github.workspace }}/deployment/native-packages/build/ubuntu26.04 \
            --platforms linux/amd64

      - name: Build development images
        working-directory: ./scripts/images
        run: |
          IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }} \
          IMAGE_TAG=${{ env.SERVICE_IMAGE_TAG }} \
            ./build-dev-infra.sh --push

      - name: Log storage after all packaging
        if: always()
        uses: ./.github/actions/log-storage
        with:
          label: 'Storage After All Packaging'
          show-packages: 'true'

      - name: Packaging and upload artifacts measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: 'Packaging and upload artifacts'

      - name: Show Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: display-results
          display-badge: false
          display-table: true
          pr-comment: false

      - name: Log final storage
        if: always()
        uses: ./.github/actions/log-storage
        with:
          label: 'Final Storage Utilization'
