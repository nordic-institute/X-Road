name: Dependency Security Audit

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: "Audit: ${{ matrix.branch }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch:
          - develop
          - release-7.6
          - release-7.7
          - release-7.8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.branch }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          gradle-cache-read-only: true
          setup-docker-buildx: false
          setup-packaging-tools: false
          free-disk-space: false

      - name: Frontend audit
        id: frontend
        working-directory: ./src
        continue-on-error: true
        run: |
          # Use pnpm script directly — works on all branches regardless of Gradle task naming
          mkdir -p build/reports
          pnpm dlx audit-ci@^7 --config shared-ui/audit-ci-shared.json --registry https://registry.npmjs.org 2>&1 | tee build/reports/frontend-audit.txt

      - name: Check backend audit availability
        id: check-backend
        working-directory: ./src
        run: |
          if grep -q 'owaspDependencyCheck' gradle/libs.versions.toml 2>/dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "OWASP dependency-check plugin not configured on this branch — skipping backend audit"
          fi

      - name: Backend audit
        id: backend
        if: steps.check-backend.outputs.available == 'true'
        working-directory: ./src
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: audit-reports-${{ matrix.branch }}
          path: |
            src/build/reports/dependency-check-report.*
            src/build/reports/frontend-audit.txt

      - name: Create issue on failure
        if: steps.frontend.outcome == 'failure' || steps.backend.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ matrix.branch }}"
          DATE=$(date -u +%Y-%m-%d)
          TITLE="[Security Audit] Vulnerabilities found on ${BRANCH}"

          FRONTEND_STATUS="${{ steps.frontend.outcome }}"
          BACKEND_STATUS="${{ steps.backend.outcome }}"
          BACKEND_AVAILABLE="${{ steps.check-backend.outputs.available }}"

          BODY=$(cat <<EOF
          ## Dependency Security Audit — \`${BRANCH}\`

          **Date:** ${DATE}
          **Frontend audit:** ${FRONTEND_STATUS}
          **Backend audit:** $([ "$BACKEND_AVAILABLE" = "true" ] && echo "$BACKEND_STATUS" || echo "skipped (plugin not configured)")

          ### Details

          Download the full reports from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ### Next Steps

          1. Review the audit reports in the workflow artifacts
          2. Update vulnerable dependencies or add suppressions
          3. Test locally: \`cd core/src && ./gradlew dependencyAudit\`
          EOF
          )

          # Check for existing open issue to avoid duplicates
          EXISTING=$(gh issue list --label security,audit --state open --search "in:title [Security Audit] ${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #${EXISTING}"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating new issue"
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "security,audit"
          fi
