name: Build and Test
on:
  # Capture this event so that gradle caches are updated when a PR is merged to develop
  # More information on why: https://github.com/gradle/gradle-build-action#using-the-caches-read-only
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - '.github/**'
      - 'deployment/**'
      - 'development/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'src/**'
      - '.github/**'
      - 'deployment/**'
      - 'development/**'

permissions:
  contents: write # Required for https://github.com/gradle/actions/tree/main/setup-gradle#github-dependency-graph-support
  pull-requests: write # https://github.com/gradle/actions/tree/main/setup-gradle#adding-job-summary-as-a-pull-request-comment
  actions: read # Required for https://github.com/dorny/test-reporter
  checks: write # Required for https://github.com/dorny/test-reporter
  packages: write # Required to pull base images from GHCR and push application images

# Cancels previous workflow run on PR if a new one is started (does not affect push to develop).
# This is because github.head_ref is empty on push events so defaults to the unique github.run_id.
# More info: https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Skip Build on dependabot/gradle/* branches for any event sent by
  # Dependabot itself (open, recreate, rebase — all fire pull_request with
  # sender.login == 'dependabot[bot]'). The dependabot-gradle-metadata.yml
  # workflow regenerates verification-metadata.xml and force-pushes as
  # github-actions[bot]; that sync event has sender.login ==
  # 'github-actions[bot]' and runs Build on the fixed commit.
  # See gradle-dependency-verification.md.
  build-and-package:
    name: build & package
    if: >
      !(startsWith(github.head_ref, 'dependabot/gradle/')
        && github.event.sender.login == 'dependabot[bot]')
    uses: ./.github/workflows/_build-and-package.yml
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}

  test-central-server:
    name: cs-tests
    needs: build-and-package
    uses: ./.github/workflows/_test-central-server.yml
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      image_registry: ${{ needs.build-and-package.outputs.image_registry }}
      service_image_tag: ${{ needs.build-and-package.outputs.service_image_tag }}

  test-security-server:
    name: ss-tests
    needs: build-and-package
    uses: ./.github/workflows/_test-security-server.yml
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      image_registry: ${{ needs.build-and-package.outputs.image_registry }}
      service_image_tag: ${{ needs.build-and-package.outputs.service_image_tag }}

  test-e2e:
    name: e2e-tests
    needs: build-and-package
    uses: ./.github/workflows/_test-e2e.yml
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      image_registry: ${{ needs.build-and-package.outputs.image_registry }}
      service_image_tag: ${{ needs.build-and-package.outputs.service_image_tag }}

  test-services:
    name: service-int-tests
    needs: build-and-package
    uses: ./.github/workflows/_test-services.yml
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      image_registry: ${{ needs.build-and-package.outputs.image_registry }}
      service_image_tag: ${{ needs.build-and-package.outputs.service_image_tag }}

  build-summary:
    name: Build Summary
    needs: [build-and-package, test-central-server, test-security-server, test-e2e, test-services]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Generate build summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Build and Test Summary
          
          | Job | Status | Duration |
          |-----|--------|----------|
          | Build and Package | ${{ needs.build-and-package.result == 'success' && '✅ Success' || needs.build-and-package.result == 'failure' && '❌ Failed' || needs.build-and-package.result == 'cancelled' && '⏹️ Cancelled' || '⏳ Skipped' }} | - |
          | Central Server Tests | ${{ needs.test-central-server.result == 'success' && '✅ Success' || needs.test-central-server.result == 'failure' && '❌ Failed' || needs.test-central-server.result == 'cancelled' && '⏹️ Cancelled' || '⏳ Skipped' }} | - |
          | Security Server Tests | ${{ needs.test-security-server.result == 'success' && '✅ Success' || needs.test-security-server.result == 'failure' && '❌ Failed' || needs.test-security-server.result == 'cancelled' && '⏹️ Cancelled' || '⏳ Skipped' }} | - |
          | E2E Tests | ${{ needs.test-e2e.result == 'success' && '✅ Success' || needs.test-e2e.result == 'failure' && '❌ Failed' || needs.test-e2e.result == 'cancelled' && '⏹️ Cancelled' || '⏳ Skipped' }} | - |
          | Service Integration Tests | ${{ needs.test-services.result == 'success' && '✅ Success' || needs.test-services.result == 'failure' && '❌ Failed' || needs.test-services.result == 'cancelled' && '⏹️ Cancelled' || '⏳ Skipped' }} | - |
          
          ## Overall Result
          
          ${{ (needs.build-and-package.result == 'success' && needs.test-central-server.result == 'success' && needs.test-security-server.result == 'success' && needs.test-e2e.result == 'success' && needs.test-services.result == 'success') && '🎉 All tests passed!' || '⚠️ Some tests failed or were skipped' }}
          
          ## Quick Actions
          
          - 🔄 [Re-run failed jobs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - 🐛 [View detailed logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - 📊 [Build trends](https://github.com/${{ github.repository }}/actions)
          EOF
