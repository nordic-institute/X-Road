name: 'Setup Mirrors'
description: 'Use the Artifactory mirrors for the rest of the job when the mirror token, user name and base URL are present and the off switch is not set. Reads the repository variables XROAD_MIRROR_BASE_URL, XROAD_MIRROR_USERNAME and XROAD_MIRRORS_DISABLED itself'
inputs:
  token:
    description: 'Mirror access token (repository secret XROAD_MIRROR_TOKEN). A composite action cannot read secrets, so the caller passes it'
    required: false
    default: ''
outputs:
  enabled:
    description: '"true" when the mirrors are enabled for the job, otherwise "false"'
    value: ${{ steps.setup.outputs.enabled }}

runs:
  using: 'composite'
  steps:
    - name: Setup mirrors
      id: setup
      shell: bash
      env:
        MIRROR_TOKEN: ${{ inputs.token }}
        MIRROR_URL: ${{ vars.XROAD_MIRROR_BASE_URL }}
        MIRROR_USERNAME: ${{ vars.XROAD_MIRROR_USERNAME }}
        MIRRORS_DISABLED: ${{ vars.XROAD_MIRRORS_DISABLED }}
      run: bash "${{ github.action_path }}/setup-mirrors.sh"
