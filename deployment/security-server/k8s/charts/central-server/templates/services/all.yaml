{{- range $service, $config := .Values.services }}

{{- /*
Skip services with replicas: 0 — same "off" switch convention as the
Security Server chart. There's only one entry today (central-server); this
loop shape is what lets a future decomposed CS add more entries without
touching the templates.
*/}}
{{- $replicas := 1 -}}
{{- if hasKey $config "replicas" }}{{ $replicas = $config.replicas | int }}{{ end }}
{{- if gt $replicas 0 }}
---
{{- include "xroad.serviceaccount" (dict "root" $ "service" $service "config" $config) }}
---
{{- include "xroad.configmap.env" (dict "root" $ "service" $service "config" $config) }}
---
{{- include "xroad.service" (dict "root" $ "service" $service "config" $config) }}
---
{{- include "xroad.deployment" (dict "root" $ "service" $service "config" $config) }}
{{- end }}

{{- end }}
