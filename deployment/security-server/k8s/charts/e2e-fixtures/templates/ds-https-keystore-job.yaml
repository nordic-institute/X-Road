{{/*
DS-HTTPS keystore init Job — the k8s analogue of compose's
ds-https-keystore-init service. Generates a self-signed cert (not
CA-anchored — this is the fully in-cluster, no-external-CA flavor, distinct
from the ansible xroad-cs/xroad-ss ds-https-keystore.yml roles used by the
k8s-ss2 hybrid, which sign via an external LXD test CA instead) whose SAN
set covers the in-cluster DS/CS/SS service names, and publishes it as the
`ds-https-keystore` Secret consumed by the security-server chart's DSP
`ds_tls` mode (EDC_WEB_HTTPS_KEYSTORE_PATH=/etc/xroad/ssl/ds-https.p12,
JAVA_TOOL_OPTIONS trustStore=/etc/xroad/ssl/cacerts.p12 — see
development/k8s/roles/security_server/templates/security-server-values.yaml.j2).

Explicit XRDADR-42 stop-gap: file-based keystore until ACME-from-OpenBao
lands. See README section 3 for the SAN-set rationale.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.dsHttpsKeystore.serviceAccount.name }}
  labels:
    {{- include "xroad.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.dsHttpsKeystore.serviceAccount.name }}-role
  labels:
    {{- include "xroad.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.dsHttpsKeystore.serviceAccount.name }}-rolebinding
  labels:
    {{- include "xroad.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.dsHttpsKeystore.serviceAccount.name }}-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.dsHttpsKeystore.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ds-https-keystore-init
  labels:
    {{- include "xroad.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "xroad.labels" . | nindent 8 }}
        app: ds-https-keystore-init
    spec:
      serviceAccountName: {{ .Values.dsHttpsKeystore.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: ds-https-keystore-init
          image: {{ .Values.dsHttpsKeystore.image }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              NAMESPACE="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc
              SECRET_NAME="{{ .Values.dsHttpsKeystore.secretName }}"

              apk add --no-cache openssl curl >/dev/null

              STATUS=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$CACERT" \
                -H "Authorization: Bearer $TOKEN" \
                "$API/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME")
              if [ "$STATUS" = "200" ]; then
                echo "Secret $SECRET_NAME already exists in $NAMESPACE, skipping"
                exit 0
              fi

              cd /tmp
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -keyout ds-https-key.pem -out ds-https-cert.pem \
                -subj "/CN={{ .Values.dsHttpsKeystore.commonName }}" \
                -addext "subjectAltName={{ include "e2eFixtures.dsHttpsSanList" . }}"

              openssl pkcs12 -export -out ds-https.p12 \
                -inkey ds-https-key.pem -in ds-https-cert.pem \
                -name ds-https -password pass:{{ .Values.dsHttpsKeystore.keystorePassword }}

              # Mirrors compose's ds-https-keystore-init recipe: copy the
              # JRE's own cacerts and import the self-signed cert into it,
              # rather than exporting a standalone PKCS12 truststore.
              cp /opt/java/openjdk/lib/security/cacerts cacerts
              chmod u+w cacerts
              keytool -import -trustcacerts -noprompt -alias ds-https \
                -file ds-https-cert.pem -keystore cacerts -storepass changeit

              DS_HTTPS_B64=$(base64 -w0 ds-https.p12)
              CACERTS_B64=$(base64 -w0 cacerts)

              PAYLOAD=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s"},"data":{"ds-https.p12":"%s","cacerts":"%s"}}' \
                "$SECRET_NAME" "$DS_HTTPS_B64" "$CACERTS_B64")

              curl -sf --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -X POST -d "$PAYLOAD" \
                "$API/api/v1/namespaces/$NAMESPACE/secrets"
          resources:
            {{- toYaml .Values.dsHttpsKeystore.resources | nindent 12 }}
