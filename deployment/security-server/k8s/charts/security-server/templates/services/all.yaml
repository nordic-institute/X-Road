{{- range $service, $config := .Values.services }}

{{- /*
Skip services with replicas: 0 — this is the chart's "off" switch.
Rendering a Deployment with replicas=0 is pointless and, for services
whose imageName/waits depend on other values being set (e.g. DSP
ds-*), produces manifests with empty image references that fail k8s
API validation. Services intentionally paused should be removed from
values, not zeroed.
*/}}
{{- $replicas := 1 -}}
{{- if hasKey $config "replicas" }}{{ $replicas = $config.replicas | int }}{{ end }}
{{- if and (gt $replicas 0) (or (ne $service "op-monitor") $config.enabled) }}
{{- $cfg := $config }}
{{- /*
Render any wait specs declared on the service (values-driven, no
service-name hardcoding here — see `xroad.dsp.wait.dispatch`).
Each spec becomes one initContainer YAML string appended to
`.config.initContainers`, the contract consumed by `xroad.deployment`.
*/}}
{{- with $config.waits }}
  {{- $waits := list }}
  {{- range $spec := . }}
    {{- $waits = append $waits (include "xroad.dsp.wait.dispatch" (dict "root" $ "spec" $spec)) }}
  {{- end }}
  {{- $cfg = merge (dict "initContainers" $waits) $config }}
{{- end }}
{{- /*
OpenBao (secret store) TLS trust (secretStore.tls). A rule, not a
per-service list: XROAD_SECRET_STORE_HOST in a service's env marks it a
secret-store client and injects the CA mount plus trust env (Quarkus var;
the Spring pair for proxy-ui-api). Volumes/mounts are concatenated, not
replaced, so the service's own extraVolumes/extraVolumeMounts survive.
*/}}
{{- if and $.Values.secretStore.tls.caSecretName (hasKey ($cfg.env | default dict) "XROAD_SECRET_STORE_HOST") }}
{{- $trustVolumeName := printf "%s-openbao-tls-certificate" $service }}
{{- $trustEnv := dict "QUARKUS_VAULT_TLS_CA_CERT" "/etc/xroad/ssl/openbao.crt" }}
{{- if eq $service "proxy-ui-api" }}
{{- $trustEnv = dict
      "SPRING_CLOUD_VAULT_SSL_TRUST_STORE" "file:/etc/xroad/ssl/openbao.crt"
      "SPRING_CLOUD_VAULT_SSL_TRUST_STORE_TYPE" "PEM"
    }}
{{- end }}
{{- $cfg = merge (dict
      "env" (merge $trustEnv ($cfg.env | default dict))
      "extraVolumes" (concat ($cfg.extraVolumes | default list) (list (dict
        "name" $trustVolumeName
        "secret" (dict
          "secretName" $.Values.secretStore.tls.caSecretName
          "items" (list (dict "key" $.Values.secretStore.tls.caSecretKey "path" "openbao.crt"))
        )
      )))
      "extraVolumeMounts" (concat ($cfg.extraVolumeMounts | default list) (list (dict
        "mountPath" "/etc/xroad/ssl/openbao.crt"
        "subPath" "openbao.crt"
        "name" $trustVolumeName
      )))
    ) $cfg }}
{{- end }}
---
{{- include "xroad.serviceaccount" (dict "root" $ "service" $service "config" $cfg) }}
---
{{- include "xroad.configmap.env" (dict "root" $ "service" $service "config" $cfg) }}
---
{{- include "xroad.service" (dict "root" $ "service" $service "config" $cfg) }}
---
{{- include "xroad.deployment" (dict "root" $ "service" $service "config" $cfg) }}
{{- end }}

{{- end }}
