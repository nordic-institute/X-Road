{{/*
Seeds the trusted-issuer `configuration_properties` row into the existing
core-SS `db-serverconf` database so that `ds-control-plane` finds its
required serverconf config on first install.

Mirrors compose `db-serverconf-ds-control-plane-config-seed` one-shot
(compose.systemtest.ds.yaml lines 2–17) verbatim:
  - same target DB / user / SQL / PGPASSWORD source
  - same `ON CONFLICT DO NOTHING` idempotency primitive (FR14)

Helm hook strategy (AC #4, Dev Notes):
  - `post-install,post-upgrade` — fires AFTER all resources are applied,
    giving `db-serverconf` time to become Ready.
  - `hook-weight: "10"` — runs after any other post-install hooks at a
    lower numeric weight (unweighted hooks default to 0).
  - `before-hook-creation,hook-succeeded` delete policy — deletes the
    previous Job before re-creating (sidesteps `Job.spec.template`
    immutability on `helm upgrade`) AND cleans up successful Jobs;
    failed Jobs stick around for debugging (differs deliberately from
    `_init_db.tpl` which uses `before-hook-creation` only).

ALTERNATIVE CONSIDERED / REJECTED: a plain (non-hook) Job would be
attempted by Helm at install time concurrently with other resources —
it would likely fail because `db-serverconf` isn't ready yet AND the
seed would race the `ds-control-plane` Pod start. It would also fail
on `helm upgrade` because `Job.spec.template` is immutable. A hook is
the correct primitive.

Rendered unconditionally. The Job seeds the trusted-issuer row
into db-serverconf; it runs as a post-install/post-upgrade hook.

TODO(post-MVP): consider exposing dsp.seed.property.{key,value,scope}
for operators who need a different trusted-issuer. Keep additive
(NFR21). Out of scope for Story 1.4 — compose is source of truth
(NFR14) and the seed SQL is hard-coded verbatim.
*/}}
{{- if include "xroad.dsp.enabled" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-db-serverconf-ds-control-plane-config-seed" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "xroad.dsp.labels" . | nindent 4 }}
    app: xroad-db-serverconf-ds-control-plane-config-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # Hard wall-clock cap on the Job — `backoffLimit` only counts failed Pods,
  # not a single stuck/hung Pod. 300s = 4min wait helper cap + 1min psql
  # buffer (Finding F5).
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "xroad.dsp.labels" . | nindent 8 }}
        app: xroad-db-serverconf-ds-control-plane-config-seed
    spec:
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      # Schema-readiness gate (not just `pg_isready`) — Liquibase in the
      # core-SS `serverconf-db-init` Job must have created the
      # `configuration_properties` table before the seed INSERT runs.
      # See Finding F3.
      initContainers:
        {{- include "xroad.dsp.wait.serverconfQuery" (dict
              "root" $
              "name" "wait-db-serverconf"
              "sql" "SELECT 1 FROM configuration_properties LIMIT 1"
              "requireNonEmpty" false
              "timeoutMsg" "configuration_properties table not present in db-serverconf (Liquibase likely not finished)."
              "timeoutHint" "kubectl logs job/serverconf-db-init") | nindent 8 }}
      containers:
        - name: seed
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-serverconf
                  key: password
          # Shell-expansion hardening (Finding F7): outer psql `-c` arg uses
          # SINGLE quotes so any future `$var` in the SQL body is NOT
          # expanded by the shell before psql sees it. SQL literals use
          # PostgreSQL `$tag$…$tag$` dollar-quoting so they survive
          # through single-quoted shell context without `'\''` escapes.
          #
          # Schema qualification (Finding F4): `SET search_path` makes the
          # unqualified `configuration_properties` reference resolve
          # against `.Values.init.serverconf.schema` even if the operator
          # overrode the core-SS schema from the default `public`.
          command: ["sh", "-c"]
          args:
            - |
              psql -h db-serverconf -U serverconf -d serverconf -v ON_ERROR_STOP=1 -c 'SET search_path TO {{ .Values.init.serverconf.schema | default "public" }}, public; INSERT INTO configuration_properties (property_key, property_value, scope, created_at, updated_at) VALUES ($seed$edc.iam.trusted-issuer.issuer.id$seed$, $seed${{ .Values.dsp.seed.trustedIssuerDid }}$seed$, $seed$ds-control-plane$seed$, now(), now()) ON CONFLICT DO NOTHING; UPDATE configuration_properties SET property_value = $seed${{ .Values.dsp.seed.trustedIssuerDid }}$seed$, updated_at = now() WHERE property_key = $seed$edc.iam.trusted-issuer.issuer.id$seed$ AND scope = $seed$ds-control-plane$seed$;'
          resources:
            {{- toYaml .Values.waitGate.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
{{- end }}
