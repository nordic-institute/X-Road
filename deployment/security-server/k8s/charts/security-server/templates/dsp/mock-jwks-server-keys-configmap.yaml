{{/*
Dataspace mock-jwks-server JWKS public-key ConfigMap.

Ships a single key `public_key.json` (verbatim copy of
`core/src/security-server/api-test/src/intTest/resources/container-files/jwks/public_key.json`)
mounted read-only at `/jwks` on the mock-jwks-server Pod — mirroring the
compose volume `./container-files/jwks/:/jwks` for the dev-profile JWKS
endpoint.

Helm's `.Files.Get` is sandboxed to the chart root, so the upstream JSON
is duplicated into `files/jwks/public_key.json` inside the chart (see
`files/jwks/README` for the upstream pointer and refresh guidance).

Rendered unconditionally. The ConfigMap ships
the JWKS public key for the mock-jwks-server Pod.

ConfigMap name is release-prefixed via `xroad.dsp.mockJwksServerKeysConfigMapName`
(Story 1.2 Finding F3 — Secrets / ConfigMaps take the `.Release.Name`
prefix; workloads + Services stay bare for compose DNS parity).
*/}}
{{- if include "xroad.dsp.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xroad.dsp.mockJwksServerKeysConfigMapName" . }}
  labels:
    {{- include "xroad.dsp.labels" . | nindent 4 }}
    app: xroad-mock-jwks-server
data:
  public_key.json: {{ required "files/jwks/public_key.json must exist inside the chart (copy from core/src/security-server/api-test/src/intTest/resources/container-files/jwks/public_key.json)" (.Files.Get "files/jwks/public_key.json") | quote }}
{{- end }}
