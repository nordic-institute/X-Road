global:
  image:
    registry: artifactory.niis.org/xroad8-snapshot-image
    tag: 8.0.0-beta2-SNAPSHOT
    pullPolicy: IfNotPresent
  # Extra annotations applied to every X-Road service pod (spec.template.metadata.annotations).
  # Used e.g. for prometheus.io/scrape style annotations consumed by service-discovery
  # collectors (Prometheus, Netdata go.d/prometheus, etc.).
  extraPodAnnotations: {}

init:
  imageName: ss-db-init
  securityContext:
    runAsUser: 1001
  serverconf:
    host: "db-serverconf"
    port: "5432"
    database: "serverconf"
    username: "serverconf"
    schema: "public"
  messagelog:
    host: "db-messagelog"
    port: "5432"
    database: "messagelog"
    username: "messagelog"
    schema: "public"
  opmonitor:
    host: "db-opmonitor"
    port: "5432"
    database: "op-monitor"
    username: "opmonitor"
    schema: "public"
    changelogName: "op-monitor"

imagePullSecrets: []

securityContext:
  pod:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  container:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Default writable paths for rootless containers (mounted as emptyDir)
writablePaths:
  - /var/log/xroad
  - /var/lib/xroad
  - /var/tmp/xroad
  - /var/cache/xroad
  - /etc/xroad

serviceAccount:
  name: "ss-init-sa"
  create: true

services:
  configuration-client:
    otelServiceName: xroad-confclient
    imageName: ss-configuration-client
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 448Mi
    ports:
      - port: 4099
        name: http
      - port: 5665
        name: grpc
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=128m
      XROAD_HOST: "configuration-client"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_CONFIGURATION_CLIENT_UPDATE_INTERVAL: "60"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME: "serverconf"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"

  signer:
    otelServiceName: xroad-signer
    imageName: ss-signer
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 896Mi
    ports:
      - port: 4099
        name: http
      - port: 5560
        name: grpc
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=192m
      XROAD_HOST: "signer"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME: "serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
  proxy:
    otelServiceName: xroad-proxy
    imageName: ss-proxy
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    ports:
      - port: 5588
        name: http
      - port: 5567
        name: grpc
      - port: 5500
        name: proxy-server
      - port: 5577
        name: proxy-ocsp
      - port: 8080
        name: proxy-http
      - port: 8443
        name: proxy-https
      - port: 5590
        name: dsp-dataflow
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
      initialDelaySeconds: 120
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=192m
      XROAD_HOST: "proxy"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_COMMON_RPC_CHANNEL_SIGNER_HOST: "signer"
      XROAD_COMMON_RPC_CHANNEL_ENV_MONITOR_HOST: "monitor"
      XROAD_PROXY_ADDON_OP_MONITOR_CONNECTION_HOST: "op-monitor"
      XROAD_PROXY_ADDON_OP_MONITOR_CONNECTION_SCHEME: https
      XROAD_PROXY_DSP_PARTICIPANT_CONTEXT_ID: "security-server"
      XROAD_PROXY_DSP_LISTEN_ADDRESS: "0.0.0.0"
      XROAD_COMMON_RPC_CHANNEL_ASSET_ACCESS_HOST: "ds-control-plane"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME: "serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-messagelog:5432/messagelog"
      XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_USERNAME: "messagelog"
      XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-messagelog"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
  proxy-ui-api:
    otelServiceName: xroad-ss-admin-service
    imageName: ss-proxy-ui-api
    resources:
      requests:
        memory: 312Mi
      limits:
        memory: 768Mi
    ports:
      - port: 4000
        name: https
    readinessProbe:
      path: "" # Replace with "/actuator/health" once it's working again
      scheme: "HTTPS"
    debugPort: 9999
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=240m
      DEBUG_PORT: "9999"
      XROAD_HOST: "proxy-ui-api"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_COMMON_RPC_CHANNEL_SIGNER_HOST: "signer"
      XROAD_COMMON_RPC_CHANNEL_PROXY_HOST: "proxy"
      XROAD_COMMON_RPC_CHANNEL_AUXILIARY_SERVICE_HOST: "auxiliary-service"
      XROAD_COMMON_RPC_CHANNEL_ENV_MONITOR_HOST: "monitor"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME: "serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-messagelog:5432/messagelog"
      XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_USERNAME: "messagelog"
      XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      XROAD_PROXY_UI_API_PROXY_SERVER_URL: "https://proxy:8443"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-messagelog"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
  monitor:
    otelServiceName: xroad-monitor
    imageName: ss-monitor
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 512Mi
    ports:
      - port: 4099
        name: http
      - port: 2552
        name: grpc
    debugPort: 9999
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=160m
      DEBUG_PORT: "9999"
      XROAD_HOST: "monitor"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_COMMON_RPC_CHANNEL_SIGNER_HOST: "signer"
      XROAD_COMMON_RPC_CHANNEL_PROXY_HOST: "proxy"
      XROAD_COMMON_RPC_CHANNEL_ENV_MONITOR_HOST: "monitor"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME: "serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
  op-monitor:
    enabled: false
    otelServiceName: xroad-opmonitor
    imageName: ss-op-monitor
    resources:
      requests:
        memory: 312Mi
      limits:
        memory: 768Mi
    ports:
      - port: 4099
        name: http
      - port: 2080
        name: opmon-daemon
    debugPort: 9999
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=120m
      DEBUG_PORT: "9999"
      XROAD_HOST: "op-monitor"
      XROAD_OP_MONITOR_LISTEN_ADDRESS: 0.0.0.0
      XROAD_OP_MONITOR_SCHEME: https
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-opmonitor:5432/op-monitor"
      XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_USERNAME: "opmonitor"
      XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_OP_MONITOR_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-opmonitor"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
  auxiliary-service:
    otelServiceName: xroad-auxiliary
    imageName: ss-auxiliary-service
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 448Mi
    rbac:
      extraRules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["create", "get", "list", "watch"]
        - apiGroups: [ "" ]
          resources: [ "pods/log" ]
          verbs: [ "get" ]
        - apiGroups: [ "apps" ]
          resources: [ "deployments","deployments/scale" ]
          verbs: [ "get", "list", "update", "watch", "patch" ]
    ports:
      - port: 4099
        name: http
      - port: 7665
        name: grpc
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
    serviceAccount:
      annotations: { }
    # Skip default emptyDir mounts for paths that use PVCs
    skipDefaultMounts:
      - /var/lib/xroad
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=128m
      XROAD_HOST: "auxiliary-service"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_SERVERCONF_DB_HOST: "db-serverconf"
      XROAD_SERVERCONF_DB_PORT: "5432"
      XROAD_SERVERCONF_DB_NAME: "serverconf"
      XROAD_SERVERCONF_DB_SCHEMA: "public"
      XROAD_SERVERCONF_DB_USERNAME: "serverconf"
      XROAD_OPENBAO_DB_HOST: "db-openbao"
      XROAD_OPENBAO_DB_PORT: "5432"
      XROAD_OPENBAO_DB_DATABASE: "openbao"
      XROAD_OPENBAO_DB_SCHEMA: "public"
      XROAD_OPENBAO_DB_USER: "openbao"
      SERVERCONF_INIT_IMAGE: "artifactory.niis.org/xroad8-snapshot-image/ss-db-init:8.0.0-beta2"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_SERVERCONF_DB_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "XROAD_SERVERCONF_DB_ADMIN_PASSWORD"
        secretName: "db-serverconf"
        key: "postgres-password"
      - name: "XROAD_OPENBAO_DB_PASSWORD"
        secretName: "db-openbao"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
    volumeMounts:
      - mountPath: /var/lib/xroad
        name: backups-volume
      - mountPath: /etc/xroad/gpghome
        name: gpg-key-volume
      - mountPath: /etc/xroad/job-templates
        name: job-templates
        readOnly: true
      - mountPath: /var/lib/xroad/messagelog-archives
        name: message-log-archives-volume
    volumes:
      - name: backups-volume
        persistentVolumeClaim:
          claimName: backups-pvc
      - name: gpg-key-volume
        persistentVolumeClaim:
          claimName: gpg-keys-pvc
      - name: job-templates
        configMap:
          name: message-log-archiver-job-template
      - name: message-log-archives-volume
        persistentVolumeClaim:
          claimName: message-log-archives-pvc

  # Split-out soft-token signing process (compose's `softtoken-signer` service). Not a token
  # type — a separate signing process. When the channel is enabled, `SignerSignRpcClient.sign()`
  # routes soft-token-based keys to it over gRPC instead of signing them co-located in `signer`.
  # Off by default (replicas: 0, the chart's existing off-switch for optional
  # workloads — see ds-control-plane/ds-identity-hub/ds-issuer-service below), so existing
  # deployers and every non-toggled release render unchanged.
  softtoken-signer:
    otelServiceName: xroad-softtoken-signer
    imageName: ss-softtoken-signer
    replicas: 0
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 384Mi
    ports:
      - port: 4099
        name: http
      - port: 5561
        name: grpc
    debugPort: 9999
    readinessProbe:
      path: "/q/health/ready"
      scheme: "HTTP"
    livenessProbe:
      path: "/q/health/live"
      scheme: "HTTP"
    serviceAccount:
      annotations: { }
    env:
      JAVA_OPTS: -XX:MaxMetaspaceSize=128m
      XROAD_HOST: "softtoken-signer"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_SIGNER_HOST: "signer"
      XROAD_SOFTTOKEN_SIGNER_RPC_LISTEN_ADDRESS: "0.0.0.0"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"

  ds-control-plane:
    imageName: ds-control-plane
    replicas: 0
    resources:
      requests:
        memory: "256M"
      limits:
        memory: "640M"
    ports:
      - port: 8181
        name: http
      - port: 8183
        name: dsp
      - port: 8184
        name: control
      - port: 8185
        name: signaling
      - port: 5461
        name: asset-access
      - port: 4099
        name: health
      - port: 9999
        name: debug
    readinessProbe:
      path: "/q/health"
      port: 4099
      scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      path: "/q/health"
      port: 4099
      scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 40
    serviceAccount:
      annotations: {}
    env:
      HOSTNAME: "ds-control-plane"
      XROAD_HOST: "ds-control-plane"
      XROAD_DSP_PARTICIPANT_CONTEXT_ID: "security-server"
      XROAD_PROXY_DATAPLANE_URL: "http://proxy:5590/full/api/v1/dataflows"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-ds-control-plane:5432/ds-control-plane"
      XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_USERNAME: "ds_control_plane"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
      DB_CONFIG_SOURCE_ENABLED: "true"
      DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      DB_CONFIG_SOURCE_USERNAME: "serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_USERNAME: "serverconf"
      XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_DRIVER_CLASS: "org.postgresql.Driver"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_DS_CONTROL_PLANE_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-ds-control-plane"
        key: "password"
      - name: "DB_CONFIG_SOURCE_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
      - name: "XROAD_DB_SERVERCONF_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-serverconf"
        key: "password"
    # DSP-scoped initContainer wait chain. Each entry is dispatched by
    # `xroad.dsp.waits.render` to a typed helper (postgres | tcp |
    # serverconfSeed). Keep ordering meaningful — waits run sequentially.
    waits:
      - type: postgres
        host: db-ds-control-plane
        name: wait-db
      - type: tcp
        host: configuration-client
        port: 4099
        name: wait-config-client
      - type: tcp
        host: ds-identity-hub
        port: 7185
        name: wait-identity-hub
      - type: serverconfSeed

  ds-identity-hub:
    imageName: ds-identity-hub
    replicas: 0
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 896Mi
    ports:
      - port: 7181
        name: health
      - port: 7182
        name: identity
      - port: 7183
        name: did
      - port: 7184
        name: sts
      - port: 7185
        name: creds
      - port: 5460
        name: provisioning
      - port: 9999
        name: debug
    readinessProbe:
      path: "/api/check/health"
      port: 7181
      scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      path: "/api/check/health"
      port: 7181
      scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 40
    serviceAccount:
      annotations: {}
    env:
      HOSTNAME: "ds-identity-hub"
      XROAD_HOST: "ds-identity-hub"
      XROAD_COMMON_RPC_CHANNEL_SIGNER_HOST: "signer"
      EDC_IH_DID_PUBLIC_HOSTNAME: "ds-identity-hub"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-ds-identity-hub:5432/ds-identity-hub"
      XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_USERNAME: "ds_identity_hub"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
      DEBUG: "true"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_DS_IDENTITY_HUB_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-ds-identity-hub"
        key: "password"
    waits:
      - type: postgres
        host: db-ds-identity-hub
        name: wait-db

  ds-issuer-service:
    imageName: ds-issuer-service
    replicas: 0
    resources:
      requests:
        memory: "256M"
      limits:
        memory: "640M"
    ports:
      - port: 6181
        name: health
      - port: 6183
        name: did
      - port: 6184
        name: sts
      - port: 6185
        name: issuance
      - port: 6187
        name: statuslist
      - port: 9999
        name: debug
    readinessProbe:
      path: "/api/check/health"
      port: 6181
      scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      path: "/api/check/health"
      port: 6181
      scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 40
    serviceAccount:
      annotations: {}
    env:
      HOSTNAME: "ds-issuer-service"
      XROAD_SECRET_STORE_HOST: "openbao"
      XROAD_COMMON_RPC_CHANNEL_CONFIGURATION_CLIENT_HOST: "configuration-client"
      XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-ds-issuer-service:5432/ds-issuer-service"
      XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_USERNAME: "ds_issuer_service"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
      DEBUG: "true"
    envFromSecrets:
      - name: "XROAD_SECRET_STORE_TOKEN"
        secretName: "xroad-token"
        key: "XROAD_SECRET_STORE_TOKEN"
      - name: "XROAD_DB_DS_ISSUER_SERVICE_HIBERNATE_CONNECTION_PASSWORD"
        secretName: "db-ds-issuer-service"
        key: "password"
    waits:
      - type: postgres
        host: db-ds-issuer-service
        name: wait-db

messageLogArchiver:
  ttlSecondsAfterFinished: 172800 # 48 hours
  imageName: ss-message-log-archiver
  env:
    JAVA_OPTS: "-XX:MaxMetaspaceSize=90m -XX:+ExitOnOutOfMemoryError"
    XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_URL: "jdbc:postgresql://db-messagelog:5432/messagelog"
    XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_USERNAME: "messagelog"
    XROAD_SECRET_STORE_HOST: "openbao"
    DB_CONFIG_SOURCE_ENABLED: "true"
    DB_CONFIG_SOURCE_URL: "jdbc:postgresql://db-serverconf:5432/serverconf"
    DB_CONFIG_SOURCE_USERNAME: "serverconf"
  envFromSecrets:
    - name: "XROAD_DB_MESSAGELOG_HIBERNATE_CONNECTION_PASSWORD"
      secretName: "db-messagelog"
      key: "password"
    - name: "XROAD_SECRET_STORE_TOKEN"
      secretName: "xroad-token"
      key: "XROAD_SECRET_STORE_TOKEN"
    - name: "DB_CONFIG_SOURCE_PASSWORD"
      secretName: "db-serverconf"
      key: "password"
  volumeMounts:
    - mountPath: /var/lib/xroad
      name: archive-volume
  volumes:
    - name: archive-volume
      persistentVolumeClaim:
        claimName: message-log-archives-pvc
  # Additive counterparts to volumes/volumeMounts above (see
  # templates/message-log-archiver-job-configmap.yaml) — appended rather than
  # replacing them, since a Helm values override replaces a list wholesale and
  # archive-volume must survive any e2e/dev overlay that also needs a mount here.
  extraVolumes: []
  extraVolumeMounts: []

# Messagelog DB + archive encryption, projected as a single Quarkus config
# file (application.yaml) into the proxy and message-log-archiver containers
# via their extraVolumes/extraVolumeMounts. See
# MessageLogEncryptionProperties (lib/messagelog-core) for the config
# contract this feeds. Off by default — no ConfigMap, no mounts.
messageLogEncryption:
  enabled: false
  applicationYaml: ""

# Single top-level knob for OpenBao (secret store) TLS trust. Every workload
# whose env carries XROAD_SECRET_STORE_HOST (services/all.yaml's fan-out
# rule; messageLogArchiver is checked the same way) reaches the secret store
# and, when caSecretName is set, gets the CA cert mounted at
# /etc/xroad/ssl/openbao.crt plus the trust env matching its runtime —
# QUARKUS_VAULT_TLS_CA_CERT for the Quarkus services, the
# SPRING_CLOUD_VAULT_SSL_TRUST_STORE(_TYPE) pair for the Spring-based
# proxy-ui-api. Default empty = today's behaviour: no cert Secret is
# referenced, no volume or mount is added, render is unchanged — plaintext
# to OpenBao or an already-trusted CA remains the deployer's responsibility.
secretStore:
  tls:
    caSecretName: "" # Secret in the release namespace holding the OpenBao CA cert
    caSecretKey: "tls.crt" # key within that Secret

persistentVolumeClaims:
  backups-pvc:
    accessMode: ReadWriteOnce
    storage: 1Gi
  gpg-keys-pvc:
    accessMode: ReadWriteOnce
    storage: 128Mi
  message-log-archives-pvc:
    accessMode: ReadWriteOnce
    storage: 1Gi

jvmHeap:
  maxRAMPercentage: 60.0
  # Cap glibc malloc arenas fleet-wide: these JVMs are small-heap/large-native
  # (netty direct buffers, per-thread arenas) and default 8×cores arenas bloat RSS.
  # Per-service env can override (e.g. set "" to disable for a throughput-sensitive svc).
  mallocArenaMax: 2

jvmMetrics:
  enabled: false
  jmxExporter:
    port: 9801
    config: |
      lowercaseOutputName: true
      lowercaseOutputLabelNames: true
      rules:
        - pattern: ".*"

otel:
  enabled: false
  # Optional node suffix for dev environments where multiple SS instances share one Jaeger backend (e.g. ss2).
  nodeId: ""
  # OTLP endpoint. Must match `protocol`: gRPC defaults to :4317, http/protobuf to :4318.
  endpoint: ""
  protocol: grpc
  sampler: parentbased_always_on
  resourceAttributes:
    serviceNamespace: xroad
    deploymentEnvironment: k8s-dev

# PostgreSQL image used by DSP wait-gate initContainers (`xroad.dsp.wait.*`
# helpers shell into this image for `pg_isready` / `psql`). The DB clusters
# themselves are provisioned externally — in the ansible dev stack by the
# cloudnative_pg role, in production by whatever operator owns DSP state.
# Required only when any ds-* service has replicas > 0; when DSP is off,
# `xroad.dsp.enabled` short-circuits all DSP-scoped resources.
postgres:
  image: ""

# DSP seed knobs. trustedIssuerDid is the issuer participant DID written into
# the core-SS serverconf `configuration_properties` row that ds-control-plane
# reads on startup. Default points at the in-cluster issuer; multi-release
# topologies override it with the dataspace-wide issuer.
#
# participantContextId, when non-empty, overrides the per-release DSP
# participant-context identifier on both the proxy
# (XROAD_PROXY_DSP_PARTICIPANT_CONTEXT_ID) and ds-control-plane
# (XROAD_DSP_PARTICIPANT_CONTEXT_ID) services — see
# templates/_configmap.tpl's `xroad.configmap.env`. Left empty by default so
# a standalone `helm install` with no overrides keeps rendering the two
# services' own hardcoded "security-server" env entries below unchanged; set
# it (e.g. per Security Server Helm release) to give distinct releases
# distinct identifiers instead of conflating them on the same value.
dsp:
  seed:
    trustedIssuerDid: "did:web:ds-issuer-service%3A10100:issuer"
  participantContextId: ""

# Signer PKCS#11 HSM stop-gap toggle (per-release, default off). When
# enabled, the signer service's image is swapped for the dev-only
# signer-with-hsm image (built from
# development/docker/security-server/signer-with-hsm) so the release's
# signer reports a pkcs11 HARDWARE token (SoftHSM2-backed) instead of the
# plain signer's softToken-0 SOFTWARE token — e.g. required by e2e's ss1
# bootstrap. TEMPORARY: reusing that compose/e2e-test dev image here is a
# stop-gap until SoftHSM provisioning is built natively into this chart.
# Off by default — ss0 and every existing non-E2E consumer render
# unchanged.
#
# The SoftHSM token directory is backed by a PersistentVolumeClaim scoped
# to this release, so the signer's sign key and certificate survive a pod
# restart or redeploy instead of the entrypoint re-initializing an empty
# token. Tearing the release down (`helm uninstall`, `--recreate`) still
# deletes the claim, so a fresh bring-up gets a fresh token as before.
signer:
  hsm:
    enabled: false
    imageName: ss-signer-with-hsm
    # Sized like gpg-keys-pvc, not the 1Gi archive claims — the token
    # directory holds a handful of keys and certs.
    tokenStorage:
      storage: 128Mi

# Wait-gate initContainer resources + retry tunables. Conservative defaults
# so wait-gate Pods are not BestEffort QoS (first-OOM-kill target).
# maxAttempts × periodSeconds = total wait cap (default 120 × 2s = 240s).
waitGate:
  maxAttempts: 120
  periodSeconds: 2
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
