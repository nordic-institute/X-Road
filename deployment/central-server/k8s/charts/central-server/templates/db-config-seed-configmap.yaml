{{- /*
xroad.* overrides the k8s topology needs. Pod env carrying xroad.* keys is
ignored — cs-entrypoint.sh instead upserts /etc/xroad/db-config-seed/*.properties
into the configuration_properties table at startup (later files win).
- alt-names: without the namespace-qualified names, Jetty's SNI check rejects
  cross-namespace callers with an empty 400
- issuer.host: the "localhost" default breaks credential issuance for any
  out-of-pod caller
*/}}
{{- $cs := index .Values.services "central-server" }}
{{- $replicas := 1 }}
{{- if hasKey $cs "replicas" }}{{ $replicas = $cs.replicas | int }}{{ end }}
{{- if gt $replicas 0 }}
{{- $svcFqdn := printf "central-server.%s" .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-central-server-db-config-seed
  labels:
    {{- include "xroad.labels" . | nindent 4 }}
    app: xroad-central-server
data:
  90-k8s.properties: |
    xroad.management-service.tls.certificate-provisioning.alt-names={{ $svcFqdn }},{{ $svcFqdn }}.svc.cluster.local
    xroad.dataspace.issuer.host={{ $svcFqdn }}
{{- end }}
