# NOT production-ready — wraps the all-in-one `central-server-dev` image. See README.md.
# The `services` map follows the Security Server chart's shape so a later
# decomposition only adds map entries, not a templates rewrite.

global:
  image:
    registry: ghcr.io/nordic-institute/x-road
    tag: latest
    pullPolicy: IfNotPresent
  # Extra annotations applied to every pod (spec.template.metadata.annotations).
  extraPodAnnotations: {}

imagePullSecrets: []

# Empty on purpose: the dev image runs postgres/supervisord/nginx as root and
# cannot honor the Security Server chart's rootless/read-only-rootfs posture.
securityContext:
  pod: {}
  container: {}

services:
  central-server:
    imageName: central-server-dev
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 3Gi
    ports:
      # 80 serves global conf distribution (/internalconf) to the Security Servers
      - port: 80
        name: gconf-http
      - port: 443
        name: gconf-https
      - port: 4000
        name: https
      # 4001/4002: management-request endpoints Security Servers call cross-namespace
      - port: 4001
        name: reg-service
      - port: 4002
        name: mgmt-service
      - port: 5432
        name: postgres
      - port: 6183
        name: issuer-did
      # Co-located Issuer Service — STS. The image bundles the same ds-issuer-service unit
      # the standalone SS deployment runs (development/docker/central-server/files/etc/xroad/
      # services/local.conf sets XROAD_DS_ISSUER_SERVICE_PARAMS), so it binds the same
      # web.http.sts.port (6184) declared in ds-issuer-service's application.yaml — a real,
      # live listener, previously undeclared here. No caller found in src/ or the k8s/ansible
      # trees (see the matching comment on the security-server chart's ds-issuer-service
      # sts port); declared for inventory accuracy, not asserted as ADR-42 cross-host surface.
      - port: 6184
        name: issuer-sts
      - port: 6185
        name: issuer-issuance
      - port: 6187
        name: issuer-status
      - port: 9955
        name: signer-debug
    readinessProbe:
      # empty-path placeholder: no unauthenticated health endpoint identified yet
      path: ""
      port: 4000
      scheme: HTTPS
    serviceAccount:
      annotations: {}
    env:
      XROAD_HOST: "central-server"
      # The Issuer Service's EDC vault client rides the fail-closed DS TLS OkHttp
      # client, which replaces JVM default trust — the in-pod OpenBao's self-signed
      # cert must be trusted through VaultEndpointTrust's escape hatch instead.
      # The path is already baked into the central-server-dev image by
      # xroad-secret-store-local's postinst (install /opt/openbao/tls/tls.crt →
      # /usr/local/share/ca-certificates/openbao.crt), so no extra mount is needed.
      # Same fix as the compose e2e cs container (compose.aux.yaml); the
      # security-server chart covers its services via secretStore.tls instead.
      QUARKUS_VAULT_TLS_CA_CERT: "/usr/local/share/ca-certificates/openbao.crt"
