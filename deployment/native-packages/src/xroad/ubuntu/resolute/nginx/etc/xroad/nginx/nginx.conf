##
# ---------------------------------------------------------------------------------------------
# X-Road nginx.conf
# ---------------------------------------------------------------------------------------------
# Based on the default nginx.conf shipped with nginx-extras 1.28.3-2ubuntu1 (Ubuntu 26.04).
#
# Notes:
# - This configuration preserves the original Ubuntu-provided layout and defaults.
#
# - The Ubuntu-specific directive:
#
#       server_tokens build;
#
#   has been commented out because it conflicts with the X-Road nginx configuration loaded via:
#
#       /etc/nginx/conf.d/xroad-securing.conf
#
#   which ultimately configures:
#
#       server_tokens off;
#
#   from the xroad-nginx package.
#
#   The conflicting directives prevent nginx.service from starting.
#
# Reference:
# - https://ubuntu.pkgs.org/26.04/ubuntu-updates-universe-amd64/nginx-extras_1.28.3-2ubuntu1.1_amd64.deb.html
# ---------------------------------------------------------------------------------------------
##
user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;

        # Commented due to conflict with xroad-nginx configuration
        # server_tokens build; # Recommended practice is to turn this off

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3 (POODLE), TLS 1.0, 1.1
        ssl_prefer_server_ciphers off; # Don't force server cipher order.

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
}


