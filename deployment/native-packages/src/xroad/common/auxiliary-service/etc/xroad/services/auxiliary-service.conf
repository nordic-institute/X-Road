#!/bin/bash

# Please do not change this file! It will be overwritten by updates.
# System specific changes should be added to /etc/xroad/services/local.properties

. /etc/xroad/services/global.conf

export OTEL_SERVICE_NAME=xroad-auxiliary${XROAD_NODE_ID:+-${XROAD_NODE_ID}}

XROAD_AUXILIARY_SERVICE_PARAMS=" ${XROAD_OTEL_PARAMS} -Xmx50m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError \
-Djava.util.logging.manager=org.jboss.logmanager.LogManager \
-Dquarkus.profile=${XROAD_QUARKUS_PROFILES} ${XROAD_AUXILIARY_SERVICE_PARAMS}"

apply_local_conf XROAD_AUXILIARY_SERVICE_PARAMS
