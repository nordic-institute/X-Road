# extract version number from "version" query parameter
map $args $version {
        default                         "2";
        "~(^|&)version=(?P<V>\d+)(&|$)" $V;
}

access_log /var/log/nginx/localhost.access.log;
root /var/lib/xroad/public;

server {
        listen 80;
        listen [::]:80;

        location ~ ^/(internal|external)conf$ {
                try_files /V$version$uri =404;
                expires -1;
        }

        # Where admin-service listens for ACME certificate renewal (its acme-challenge-port).
        # Only change the host if admin-service runs on another machine - and update its
        # acme-challenge-bind-address to match, or it will reject these connections.
        location ^~ /.well-known/acme-challenge/ {
                proxy_pass http://127.0.0.1:5987;
        }
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        ssl_certificate /etc/xroad/ssl/global-conf.crt;
        ssl_certificate_key /etc/xroad/ssl/global-conf.key;

        location ~ ^/(internal|external)conf$ {
                try_files /V$version$uri =404;
                expires -1;
        }
}
