# Address where admin-service listens for certificate renewal requests (host:port).
# The port must always match admin-service's own acme-challenge-port. Change the host part only
# if admin-service runs on a different machine than this nginx - and update its
# acme-challenge-bind-address to match, or it will keep rejecting connections from anywhere but itself.
set $acme_challenge_upstream 127.0.0.1:5987;
