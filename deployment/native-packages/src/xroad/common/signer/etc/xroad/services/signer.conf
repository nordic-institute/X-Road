#!/bin/bash

# Please do not change this file! It will be overwritten by updates.
# System specific changes should be added to /etc/xroad/services/local.conf

. /etc/xroad/services/global.conf

export OTEL_SERVICE_NAME=xroad-signer${XROAD_NODE_ID:+-${XROAD_NODE_ID}}

XROAD_SIGNER_PARAMS=" ${XROAD_OTEL_PARAMS} -Xmx128m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError \
-Djava.util.logging.manager=org.jboss.logmanager.LogManager \
-Dquarkus.profile=${XROAD_QUARKUS_PROFILES} ${XROAD_SIGNER_PARAMS}"

apply_local_conf XROAD_SIGNER_PARAMS
