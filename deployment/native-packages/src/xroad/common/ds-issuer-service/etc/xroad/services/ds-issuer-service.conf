#!/bin/bash

# Please do not change this file! It will be overwritten by updates.
# System specific changes should be added to /etc/xroad/services/local.properties

. /etc/xroad/services/global.conf

if [[ -n "${XROAD_ADMIN_SERVICE_HA_NODE_NAME:-}" ]]; then
  export XROAD_ADMIN_SERVICE_HA_NODE_NAME
else
  ha_node_name="$(/usr/share/xroad/scripts/yaml_helper.sh get /etc/xroad/conf.d/local.yaml "xroad.admin-service.ha-node-name" 2>/dev/null)" || ha_node_name=""
  if [[ -n "$ha_node_name" ]]; then
    export XROAD_ADMIN_SERVICE_HA_NODE_NAME="$ha_node_name"
  fi
fi

export OTEL_SERVICE_NAME=xroad-ds-issuer-service${XROAD_NODE_ID:+-${XROAD_NODE_ID}}

XROAD_DS_ISSUER_SERVICE_PARAMS="${XROAD_OTEL_PARAMS} -Xmx256m -XX:MaxMetaspaceSize=192m \
-Djava.util.logging.manager=org.jboss.logmanager.LogManager \
-Dquarkus.profile=${XROAD_QUARKUS_PROFILES} $XROAD_DS_ISSUER_SERVICE_PARAMS"

apply_local_conf XROAD_DS_ISSUER_SERVICE_PARAMS
